Участники:<\/strong> фактор (банк), поставщик, покупатель (должник).<\/li>\n<li><strong>Цель:<\/strong> ускорить получение денег поставщиком.<\/li>\n<li><em>Пример:<\/em> поставщик продал товар с отсрочкой на 60 дней, но получил 80–90% суммы от банка сразу.<\/li>\n<\/ul>\n<p><strong>Форфейтинг<\/strong> — покупка банком долгосрочных долговых обязательств (обычно векселей) экспортёра <strong>без права регресса<\/strong>, то есть все риски неплатежа переходят на банк.<\/p>\n<ul>\n<li>Применяется во <strong>внешнеторговых<\/strong> операциях.<\/li>\n<li><em>Пример:<\/em> казахстанский экспортёр продаёт оборудование в рассрочку, получает векселя покупателя и продаёт их банку, сразу получая деньги.<\/li>\n<\/ul>\n<p><strong>Сравнение:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Признак<\/th>\n<th>Лизинг<\/th>\n<th>Факторинг<\/th>\n<th>Форфейтинг<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Суть<\/td>\n<td>Аренда с выкупом<\/td>\n<td>Уступка краткосрочных долгов<\/td>\n<td>Покупка долгосрочных долгов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Срок<\/td>\n<td>Средне- и долгосрочный<\/td>\n<td>Краткосрочный<\/td>\n<td>Средне- и долгосрочный<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Риск неплатежа<\/td>\n<td>У лизингодателя<\/td>\n<td>Может оставаться у поставщика<\/td>\n<td>Полностью у банка<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "k": ["Лизинг", "Участники", "Виды", "Факторинг", "Цель", "Форфейтинг", "без права регресса", "внешнеторговых"], "s": "Лизинг — долгосрочная аренда имущества (оборудования, транспорта, недвижимости) с последующим правом выкупа. Лизингодатель покупает имущество и передаёт его лизингополучателю за периодические платежи."}, {"n": 41, "q": "Внутренние и внешние причины и факторы возникновения банковских рисков", "a": "<p><strong>Банковский риск<\/strong> — вероятность того, что банк понесёт потери или недополучит доход из-за наступления неблагоприятных событий.<\/p>\n<p><strong>Внутренние причины (зависят от банка):<\/strong><\/p>\n<ul>\n<li>ошибки руководства и неэффективный менеджмент;<\/li>\n<li>слабая система риск-менеджмента и внутреннего контроля;<\/li>\n<li>неправильная кредитная политика (выдача займов ненадёжным заёмщикам);<\/li>\n<li>концентрация кредитов у одного заёмщика или в одной отрасли;<\/li>\n<li>низкая квалификация персонала;<\/li>\n<li>мошенничество сотрудников;<\/li>\n<li>технические сбои, ошибки в IT-системах;<\/li>\n<li>несбалансированность активов и пассивов по срокам.<\/li>\n<\/ul>\n<p><strong>Внешние причины (не зависят от банка):<\/strong><\/p>\n<ul>\n<li>экономический кризис, спад производства;<\/li>\n<li>инфляция и изменение процентных ставок;<\/li>\n<li>колебания валютного курса, девальвация;<\/li>\n<li>политическая нестабильность;<\/li>\n<li>изменения в законодательстве и налогах;<\/li>\n<li>снижение платёжеспособности населения и предприятий;<\/li>\n<li>стихийные бедствия;<\/li>\n<li>кибератаки;<\/li>\n<li>кризисы на мировых финансовых рынках.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> девальвация тенге (внешний фактор) привела к росту долга заёмщиков с валютными кредитами, и они перестали платить — у банка вырос кредитный риск.<\/p>", "k": ["Банковский риск"], "s": "Банковский риск — вероятность того, что банк понесёт потери или недополучит доход из-за наступления неблагоприятных событий."}, {"n": 42, "q": "Организационная структура банка второго уровня", "a": "<p><strong>Организационная структура банка<\/strong> — система органов управления и подразделений банка, их подчинённость и распределение функций.<\/p>\n<p><strong>Органы управления (банк — акционерное общество):<\/strong><\/p>\n<ul>\n<li><strong>Общее собрание акционеров<\/strong> — высший орган (изменение устава, избрание совета директоров, утверждение отчётности, дивиденды).<\/li>\n<li><strong>Совет директоров<\/strong> — орган управления, определяет стратегию, контролирует правление.<\/li>\n<li><strong>Правление<\/strong> — исполнительный орган, руководит текущей деятельностью; возглавляет Председатель правления.<\/li>\n<li><strong>Служба внутреннего аудита<\/strong> — подотчётна совету директоров.<\/li>\n<li><strong>Комитеты<\/strong> — кредитный комитет, комитет по управлению активами и пассивами (КУАП), комитет по рискам.<\/li>\n<\/ul>\n<p><strong>Основные подразделения:<\/strong><\/p>\n<ul>\n<li><strong>Фронт-офис<\/strong> — работа с клиентами: розничный бизнес (физлица), корпоративный бизнес (юрлица), МСБ, казначейство.<\/li>\n<li><strong>Мидл-офис<\/strong> — управление рисками, анализ, комплаенс.<\/li>\n<li><strong>Бэк-офис<\/strong> — бухгалтерия, операционное обслуживание, обработка платежей.<\/li>\n<li><strong>Вспомогательные службы<\/strong> — IT, безопасность, юридический департамент, HR, маркетинг.<\/li>\n<\/ul>\n<p><strong>Филиальная сеть:<\/strong> головной офис, филиалы в регионах, отделения (центры обслуживания).<\/p>\n<p><em>Пример:<\/em> решение о выдаче крупного кредита принимает кредитный комитет на основе заключений подразделений по рискам и безопасности.<\/p>", "k": ["Организационная структура банка", "Общее собрание акционеров", "Совет директоров", "Правление", "Служба внутреннего аудита", "Комитеты", "Фронт-офис", "Мидл-офис", "Бэк-офис", "Вспомогательные службы", "Филиальная сеть"], "s": "Организационная структура банка — система органов управления и подразделений банка, их подчинённость и распределение функций."}, {"n": 43, "q": "Валютный риск и способы его хеджирования", "a": "<p><strong>Валютный риск<\/strong> — риск потерь из-за изменения обменного курса валют.<\/p>\n<p><strong>Виды валютного риска:<\/strong><\/p>\n<ul>\n<li><strong>Операционный (риск сделки)<\/strong> — потери по конкретной сделке из-за изменения курса между заключением и оплатой.<\/li>\n<li><strong>Трансляционный (балансовый)<\/strong> — изменение стоимости активов и обязательств в валюте при пересчёте в отчётности.<\/li>\n<li><strong>Экономический<\/strong> — влияние курса на конкурентоспособность и будущие доходы компании.<\/li>\n<\/ul>\n<p><strong>Хеджирование<\/strong> — страхование от неблагоприятного изменения курса с помощью финансовых инструментов.<\/p>\n<p><strong>Способы хеджирования:<\/strong><\/p>\n<ul>\n<li><strong>Форвард<\/strong> — договор о покупке или продаже валюты в будущем по заранее установленному курсу.<\/li>\n<li><strong>Фьючерс<\/strong> — стандартизированный биржевой контракт на покупку или продажу валюты в будущем.<\/li>\n<li><strong>Опцион<\/strong> — право (но не обязанность) купить или продать валюту по заранее оговорённому курсу.<\/li>\n<li><strong>Своп<\/strong> — обмен валютами с обязательством обратного обмена в будущем.<\/li>\n<\/ul>\n<p><strong>Другие методы управления валютным риском:<\/strong><\/p>\n<ul>\n<li>открытая валютная позиция в пределах лимитов;<\/li>\n<li>выбор валюты договора (заключение договоров в тенге);<\/li>\n<li>валютная оговорка в договоре;<\/li>\n<li>согласование валют активов и пассивов;<\/li>\n<li>ускорение или задержка платежей.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> импортёр, которому через 3 месяца платить в долларах, заключает с банком форвард и фиксирует курс, чтобы не потерять при ослаблении тенге.<\/p>", "k": ["Валютный риск", "Операционный (риск сделки)", "Трансляционный (балансовый)", "Экономический", "Хеджирование", "Форвард", "Фьючерс", "Опцион", "Своп"], "s": "Валютный риск — риск потерь из-за изменения обменного курса валют."}, {"n": 44, "q": "Понятие ценных бумаг и их виды", "a": "<p><strong>Ценная бумага<\/strong> — совокупность определённых записей и других обозначений, удостоверяющих имущественные права (на получение дохода, долю в капитале, возврат долга и т. д.).<\/p>\n<p><strong>Виды ценных бумаг:<\/strong><\/p>\n<p><strong>1. Долевые:<\/strong><\/p>\n<ul>\n<li><strong>Акция<\/strong> — подтверждает право на долю в капитале АО, на получение дивидендов и участие в управлении. Бывают <strong>простые<\/strong> (право голоса) и <strong>привилегированные<\/strong> (гарантированный дивиденд, обычно без права голоса).<\/li>\n<\/ul>\n<p><strong>2. Долговые:<\/strong><\/p>\n<ul>\n<li><strong>Облигация<\/strong> — подтверждает право получить от эмитента номинальную стоимость и вознаграждение (купон) в установленный срок.<\/li>\n<li><strong>Вексель<\/strong> — письменное безусловное обязательство заплатить определённую сумму. Бывает <strong>простой<\/strong> и <strong>переводной<\/strong>.<\/li>\n<li><strong>Депозитный сертификат<\/strong> — свидетельство банка о внесении вклада.<\/li>\n<\/ul>\n<p><strong>3. Производные (деривативы):<\/strong> фьючерсы, опционы, форварды, свопы — их стоимость зависит от базового актива.<\/p>\n<p><strong>4. Прочие:<\/strong> чеки, коносаменты, депозитарные расписки, паи инвестиционных фондов.<\/p>\n<p><strong>Классификация:<\/strong><\/p>\n<ul>\n<li>по эмитенту — <strong>государственные<\/strong> (ГЦБ) и <strong>негосударственные<\/strong> (корпоративные);<\/li>\n<li>по сроку — краткосрочные, среднесрочные, долгосрочные;<\/li>\n<li>по форме — <strong>документарные<\/strong> и <strong>бездокументарные<\/strong> (записи в реестре);<\/li>\n<li>по способу передачи — <strong>именные<\/strong> и <strong>на предъявителя<\/strong>.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> Министерство финансов РК выпускает государственные облигации, а компания «Казатомпром» — акции.<\/p>", "k": ["Ценная бумага", "Акция", "привилегированные", "Облигация", "Вексель", "переводной", "Депозитный сертификат", "государственные", "негосударственные", "документарные", "бездокументарные", "на предъявителя"], "s": "Ценная бумага — совокупность определённых записей и других обозначений, удостоверяющих имущественные права (на получение дохода, долю в капитале, возврат долга и т. д.)."}, {"n": 45, "q": "Значение банковских рисков и их классификация", "a": "<p><strong>Банковские риски<\/strong> — вероятность потерь или недополучения доходов банком.<\/p>\n<p><strong>Значение управления рисками:<\/strong><\/p>\n<ul>\n<li>риски неизбежны: банк получает доход именно за принятие рисков;<\/li>\n<li>неуправляемые риски ведут к потерям, снижению капитала и банкротству банка;<\/li>\n<li>банкротство банка угрожает вкладчикам и стабильности всей финансовой системы;<\/li>\n<li>поэтому государство устанавливает пруденциальные нормативы, а банки создают системы риск-менеджмента.<\/li>\n<\/ul>\n<p><strong>Классификация банковских рисков:<\/strong><\/p>\n<ul>\n<li><strong>Кредитный риск<\/strong> — заёмщик не вернёт кредит или проценты.<\/li>\n<li><strong>Риск ликвидности<\/strong> — банк не сможет вовремя выполнить свои обязательства (например, выдать вклады).<\/li>\n<li><strong>Рыночный риск<\/strong> — потери из-за изменения рыночных цен:\n<ul>\n<li><strong>процентный<\/strong> — изменение процентных ставок;<\/li>\n<li><strong>валютный<\/strong> — изменение курсов валют;<\/li>\n<li><strong>фондовый<\/strong> — изменение цен ценных бумаг.<\/li>\n<\/ul><\/li>\n<li><strong>Операционный риск<\/strong> — ошибки персонала, сбои систем, мошенничество.<\/li>\n<li><strong>Страновой (политический) риск<\/strong> — потери из-за событий в другой стране.<\/li>\n<li><strong>Правовой риск<\/strong> — изменения законодательства, судебные споры.<\/li>\n<li><strong>Репутационный риск<\/strong> — потеря доверия клиентов.<\/li>\n<li><strong>Стратегический риск<\/strong> — ошибочные управленческие решения.<\/li>\n<\/ul>\n<p><strong>Методы снижения рисков:<\/strong> диверсификация, лимитирование, резервирование (провизии), страхование, хеджирование, залог и гарантии.<\/p>\n<p><em>Пример:<\/em> чтобы снизить кредитный риск, банк требует залог недвижимости и проверяет кредитную историю заёмщика.<\/p>", "k": ["Банковские риски", "Кредитный риск", "Риск ликвидности", "Рыночный риск", "процентный", "Операционный риск", "Страновой (политический) риск", "Правовой риск", "Репутационный риск", "Стратегический риск", "Методы снижения рисков"], "s": "Банковские риски — вероятность потерь или недополучения доходов банком."}, {"n": 46, "q": "Роль центральных банков в экономике", "a": "<p>Центральные банки занимают верхний уровень банковской системы и играют ключевую роль в экономической и финансовой стабильности государства.<\/p>\n<p><strong>Главная цель<\/strong> Национального Банка РК — стабильность цен. Для этого он выполняет функции:<\/p>\n<ul>\n<li><strong>ДКП<\/strong> — регулирование денежного предложения, ставок и инфляции.<\/li>\n<li><strong>Эмиссия денег<\/strong> — монопольный выпуск банкнот и монет.<\/li>\n<li><strong>Банк банков<\/strong> — рефинансирование, хранение резервов, кредитор последней инстанции.<\/li>\n<li><strong>Банк и агент Правительства<\/strong> — обслуживание бюджета, размещение гособлигаций.<\/li>\n<li><strong>Управление золотовалютными резервами.<\/strong><\/li>\n<li><strong>Платёжные системы<\/strong> — бесперебойные межбанковские расчёты.<\/li>\n<li><strong>Валютное регулирование и контроль.<\/strong><\/li>\n<\/ul>", "k": ["Главная цель", "ДКП", "Эмиссия денег", "Банк банков", "Банк и агент Правительства", "Управление золотовалютными резервами", "Платёжные системы", "Валютное регулирование и контроль"], "s": "Центральные банки занимают верхний уровень банковской системы и играют ключевую роль в экономической и финансовой стабильности государства."}, {"n": 47, "q": "Национальный фонд Республики Казахстан", "a": "<p><strong>Национальный фонд Республики Казахстан<\/strong> — фонд, в котором накапливаются доходы государства от нефтегазового сектора. Создан в <strong>2000 году<\/strong>.<\/p>\n<p><strong>Цели Национального фонда:<\/strong><\/p>\n<ul>\n<li><strong>Стабилизационная<\/strong> — снижение зависимости экономики и бюджета от колебаний мировых цен на нефть;<\/li>\n<li><strong>Сберегательная<\/strong> — накопление средств для будущих поколений.<\/li>\n<\/ul>\n<p><strong>Источники формирования (прямые налоги от нефтяного сектора):<\/strong><\/p>\n<ul>\n<li>КПН с организаций нефтяного сектора;<\/li>\n<li>налог на добычу полезных ископаемых;<\/li>\n<li>рентный налог на экспорт;<\/li>\n<li>бонусы, доля по разделу продукции;<\/li>\n<li>доходы от продажи госимущества в горнодобывающей отрасли;<\/li>\n<li>инвестиционный доход от управления фондом.<\/li>\n<\/ul>\n<p><strong>Использование средств:<\/strong><\/p>\n<ul>\n<li><strong>гарантированный трансферт<\/strong> в республиканский бюджет;<\/li>\n<li><strong>целевые трансферты<\/strong> — на конкретные программы;<\/li>\n<li>с 2024 года — программа <strong>«Национальный фонд — детям»<\/strong>: ежегодное зачисление части инвестиционного дохода на накопительные счета детей до 18 лет.<\/li>\n<\/ul>\n<p><strong>Управление:<\/strong> доверительный управляющий — <strong>Национальный Банк РК<\/strong>; средства инвестируются в иностранные финансовые активы (облигации, акции, золото).<\/p>\n<p><em>Пример:<\/em> в период падения цен на нефть средства Национального фонда помогают профинансировать бюджет и поддержать экономику.<\/p>", "k": ["Национальный фонд Республики Казахстан", "2000 году", "Стабилизационная", "Сберегательная", "гарантированный трансферт", "целевые трансферты", "«Национальный фонд — детям»", "Управление", "Национальный Банк РК"], "s": "Национальный фонд Республики Казахстан — фонд, в котором накапливаются доходы государства от нефтегазового сектора. Создан в 2000 году."}, {"n": 48, "q": "Этапы становления и развития финансовой системы Казахстана", "a": "<p><strong>1. Начальный этап (1991–1995 гг.)<\/strong><\/p>\n<ul>\n<li>обретение независимости, выход из союзной финансовой системы;<\/li>\n<li>создание <strong>Национального Банка РК<\/strong> и двухуровневой банковской системы;<\/li>\n<li><strong>15 ноября 1993 года<\/strong> — введение национальной валюты <strong>тенге<\/strong>;<\/li>\n<li>период высокой инфляции, начало приватизации;<\/li>\n<li>принятие законов о Национальном Банке и о банках (1995 г.).<\/li>\n<\/ul>\n<p><strong>2. Этап реформ и стабилизации (1996–2000 гг.)<\/strong><\/p>\n<ul>\n<li><strong>пенсионная реформа 1998 года<\/strong> — переход к накопительной пенсионной системе;<\/li>\n<li>первый Налоговый кодекс, реформа бюджетной системы;<\/li>\n<li>создание системы гарантирования депозитов;<\/li>\n<li>кризис 1998 года и переход к плавающему курсу тенге (1999 г.);<\/li>\n<li><strong>создание Национального фонда<\/strong> (2000 г.).<\/li>\n<\/ul>\n<p><strong>3. Этап активного роста (2001–2007 гг.)<\/strong><\/p>\n<ul>\n<li>быстрый рост банковского сектора и кредитования;<\/li>\n<li>развитие фондового рынка (KASE);<\/li>\n<li>создание единого регулятора финансового рынка (АФН, 2004 г.);<\/li>\n<li>выход казахстанских банков на внешние рынки заимствований.<\/li>\n<\/ul>\n<p><strong>4. Кризис и восстановление (2007–2014 гг.)<\/strong><\/p>\n<ul>\n<li>мировой финансовый кризис, проблемы крупных банков (БТА, Альянс);<\/li>\n<li>господдержка банков, реструктуризация;<\/li>\n<li>передача функций финансового надзора Национальному Банку (2011 г.);<\/li>\n<li>создание Единого накопительного пенсионного фонда (ЕНПФ, 2013 г.).<\/li>\n<\/ul>\n<p><strong>5. Современный этап (с 2015 г.)<\/strong><\/p>\n<ul>\n<li>переход к <strong>инфляционному таргетированию и плавающему курсу<\/strong> (2015 г.);<\/li>\n<li>запуск <strong>МФЦА<\/strong> (Международного финансового центра «Астана»);<\/li>\n<li>программа повышения финансовой устойчивости банков;<\/li>\n<li>создание <strong>АРРФР<\/strong> (2020 г.) — отдельного регулятора финансового рынка;<\/li>\n<li>развитие цифровых платежей и запуск <strong>цифрового тенге<\/strong>;<\/li>\n<li><strong>новый Налоговый кодекс<\/strong> (с 2026 г.).<\/li>\n<\/ul>", "k": ["Национального Банка РК", "15 ноября 1993 года", "пенсионная реформа 1998 года", "создание Национального фонда", "МФЦА", "АРРФР", "цифрового тенге", "новый Налоговый кодекс"], "s": "2. Этап реформ и стабилизации (1996–2000 гг.)"}, {"n": 49, "q": "Сущность банковских рисков и их классификация", "a": "<p><strong>Сущность банковского риска<\/strong> — это вероятность того, что фактические результаты деятельности банка окажутся хуже ожидаемых: банк понесёт убытки, потеряет ликвидность или недополучит доход.<\/p>\n<p>Риск связан с <strong>неопределённостью<\/strong>: банк работает с чужими деньгами, размещает их на срок и не может заранее точно знать, вернутся ли они вовремя и в полном объёме.<\/p>\n<p><strong>Особенности банковских рисков:<\/strong><\/p>\n<ul>\n<li>присущи любой банковской операции;<\/li>\n<li>поддаются оценке и управлению;<\/li>\n<li>могут передаваться от одного банка к другим (системный риск).<\/li>\n<\/ul>\n<p><strong>Классификация:<\/strong><\/p>\n<p><strong>1. По источнику:<\/strong> внутренние (ошибки управления, персонала) и внешние (экономические, политические, правовые).<\/p>\n<p><strong>2. По видам:<\/strong><\/p>\n<ul>\n<li><strong>Кредитный<\/strong> — невозврат кредита заёмщиком.<\/li>\n<li><strong>Ликвидности<\/strong> — неспособность банка вовремя исполнить обязательства.<\/li>\n<li><strong>Процентный<\/strong> — потери из-за изменения ставок.<\/li>\n<li><strong>Валютный<\/strong> — потери из-за изменения курсов.<\/li>\n<li><strong>Рыночный (фондовый)<\/strong> — изменение цен ценных бумаг.<\/li>\n<li><strong>Операционный<\/strong> — сбои систем, ошибки, мошенничество.<\/li>\n<li><strong>Правовой<\/strong>, <strong>репутационный<\/strong>, <strong>страновой<\/strong>.<\/li>\n<\/ul>\n<p><strong>3. По степени:<\/strong> допустимый, критический, катастрофический.<\/p>\n<p><strong>4. По охвату:<\/strong> индивидуальный (по конкретной сделке) и совокупный (портфельный).<\/p>\n<p><em>Пример:<\/em> если многие вкладчики одновременно снимают депозиты, у банка возникает риск ликвидности.<\/p>", "k": ["Сущность банковского риска", "неопределённостью", "Кредитный", "Ликвидности", "Процентный", "Валютный", "Рыночный (фондовый)", "Операционный", "Правовой", "репутационный", "страновой"], "s": "Сущность банковского риска — это вероятность того, что фактические результаты деятельности банка окажутся хуже ожидаемых: банк понесёт убытки, потеряет ликвидность или недополучит доход."}, {"n": 50, "q": "Виды кредитных организаций: банки и небанковские финансовые институты", "a": "<p><strong>Кредитные организации<\/strong> — организации, осуществляющие кредитные и другие финансовые операции.<\/p>\n<p><strong>1. Банки:<\/strong><\/p>\n<ul>\n<li><strong>Центральный банк<\/strong> (Национальный Банк РК) — не работает с населением напрямую.<\/li>\n<li><strong>Банки второго уровня<\/strong> — коммерческие банки, обслуживающие физических и юридических лиц.<\/li>\n<li><strong>Исламские банки<\/strong> — работают по принципам исламского финансирования (без процентов).<\/li>\n<li><strong>Банки развития<\/strong> — например, <strong>Банк Развития Казахстана<\/strong> (финансирование крупных проектов).<\/li>\n<li><strong>Жилищные строительные сберегательные банки<\/strong> — например, <strong>Отбасы банк<\/strong> (жилищные накопления и займы).<\/li>\n<\/ul>\n<p><strong>2. Небанковские финансовые институты:<\/strong><\/p>\n<ul>\n<li><strong>Микрофинансовые организации (МФО)<\/strong> — микрокредиты физлицам и малому бизнесу.<\/li>\n<li><strong>Кредитные товарищества<\/strong> — кредитование своих участников.<\/li>\n<li><strong>Ломбарды<\/strong> — займы под залог имущества.<\/li>\n<li><strong>Ипотечные организации<\/strong> — ипотечные займы.<\/li>\n<li><strong>Страховые компании<\/strong> — страхование рисков.<\/li>\n<li><strong>Пенсионные фонды<\/strong> — ЕНПФ (накопление пенсионных взносов).<\/li>\n<li><strong>Инвестиционные фонды, брокеры и дилеры<\/strong> — операции с ценными бумагами.<\/li>\n<li><strong>Лизинговые компании<\/strong> — лизинг оборудования и транспорта.<\/li>\n<li><strong>Национальный оператор почты<\/strong> («Казпочта») — отдельные банковские операции.<\/li>\n<\/ul>\n<p><strong>Отличие:<\/strong> банки имеют право принимать депозиты населения, а большинство небанковских организаций — нет.<\/p>\n<p><em>Пример:<\/em> малый предприниматель может взять кредит в БВУ, а если банк отказал — микрокредит в МФО по более высокой ставке.<\/p>", "k": ["Кредитные организации", "Центральный банк", "Банки второго уровня", "Исламские банки", "Банки развития", "Банк Развития Казахстана", "Жилищные строительные сберегательные банки", "Отбасы банк", "Микрофинансовые организации (МФО)", "Кредитные товарищества", "Ломбарды", "Ипотечные организации", "Страховые компании", "Пенсионные фонды"], "s": "Кредитные организации — организации, осуществляющие кредитные и другие финансовые операции."}, {"n": 51, "q": "Типы и основные направления денежно-кредитной политики", "a": "<p><strong>Денежно-кредитная политика (ДКП)<\/strong> — совокупность мер центрального банка по регулированию денежной массы, процентных ставок и кредита для достижения целей экономической политики (прежде всего стабильности цен).<\/p>\n<p><strong>Типы ДКП:<\/strong><\/p>\n<ul>\n<li><strong>Стимулирующая (политика «дешёвых денег», экспансионистская)<\/strong> — снижение базовой ставки и резервных требований, увеличение денежной массы. Применяется при спаде экономики.<\/li>\n<li><strong>Сдерживающая (политика «дорогих денег», рестрикционная)<\/strong> — повышение ставки, сокращение денежной массы. Применяется при высокой инфляции.<\/li>\n<\/ul>\n<p><strong>Режимы ДКП:<\/strong><\/p>\n<ul>\n<li><strong>Таргетирование инфляции<\/strong> — цель по уровню инфляции (применяется в РК с 2015 года);<\/li>\n<li><strong>Таргетирование валютного курса<\/strong> — поддержание фиксированного курса;<\/li>\n<li><strong>Таргетирование денежной массы<\/strong> — контроль роста денежных агрегатов.<\/li>\n<\/ul>\n<p><strong>Основные направления ДКП НБРК:<\/strong><\/p>\n<ul>\n<li>удержание инфляции в целевом коридоре;<\/li>\n<li>управление базовой ставкой;<\/li>\n<li>поддержание плавающего обменного курса;<\/li>\n<li>развитие денежного рынка;<\/li>\n<li>обеспечение финансовой стабильности;<\/li>\n<li>повышение прозрачности и доверия к политике НБРК.<\/li>\n<\/ul>\n<p><strong>Инструменты:<\/strong> базовая ставка, операции на открытом рынке, минимальные резервные требования, постоянные операции, валютные интервенции.<\/p>\n<p><em>Пример:<\/em> при росте инфляции НБРК проводит сдерживающую политику — повышает базовую ставку.<\/p>", "k": ["Денежно-кредитная политика (ДКП)", "Таргетирование инфляции", "Таргетирование валютного курса", "Таргетирование денежной массы", "Инструменты"], "s": "Денежно-кредитная политика (ДКП) — совокупность мер центрального банка по регулированию денежной массы, процентных ставок и кредита для достижения целей экономической политики (прежде всего стабильности цен)."}, {"n": 52, "q": "Фондовая биржа Республики Казахстан", "a": "<p><strong>Фондовая биржа<\/strong> — организованный рынок, на котором заключаются сделки с ценными бумагами и другими финансовыми инструментами.<\/p>\n<p><strong>Казахстанская фондовая биржа (KASE)<\/strong> — основная биржа страны, создана в <strong>1993 году<\/strong> в Алматы (изначально как валютная биржа).<\/p>\n<p><strong>Рынки KASE:<\/strong><\/p>\n<ul>\n<li><strong>Рынок акций<\/strong>;<\/li>\n<li><strong>Рынок облигаций<\/strong> (корпоративных и государственных);<\/li>\n<li><strong>Валютный рынок<\/strong> — формирование курса тенге;<\/li>\n<li><strong>Денежный рынок<\/strong> — операции репо, валютные свопы;<\/li>\n<li><strong>Рынок производных инструментов.<\/strong><\/li>\n<\/ul>\n<p><strong>Функции биржи:<\/strong><\/p>\n<ul>\n<li>организация торгов и формирование справедливых цен;<\/li>\n<li>обеспечение ликвидности ценных бумаг;<\/li>\n<li>привлечение капитала компаниями;<\/li>\n<li>раскрытие информации об эмитентах;<\/li>\n<li>расчёт фондовых индексов (индекс KASE).<\/li>\n<\/ul>\n<p><strong>Участники:<\/strong> брокеры и дилеры (члены биржи), эмитенты, инвесторы, Центральный депозитарий ценных бумаг.<\/p>\n<p>Также в Казахстане работает <strong>Astana International Exchange (AIX)<\/strong> — биржа Международного финансового центра «Астана» (с 2017 года).<\/p>\n<p><em>Пример:<\/em> государственные облигации Министерства финансов и курс тенге к доллару формируются на торгах KASE.<\/p>", "k": ["Фондовая биржа", "Казахстанская фондовая биржа (KASE)", "1993 году", "Рынок акций", "Рынок облигаций", "Валютный рынок", "Денежный рынок", "Рынок производных инструментов", "Участники", "Astana International Exchange (AIX)"], "s": "Фондовая биржа — организованный рынок, на котором заключаются сделки с ценными бумагами и другими финансовыми инструментами."}, {"n": 53, "q": "Необходимость и значение международных расчётов", "a": "<p><strong>Международные расчёты<\/strong> — система организации и регулирования платежей по денежным требованиям и обязательствам между государствами, организациями и гражданами разных стран.<\/p>\n<p><strong>Необходимость<\/strong> — возникает из-за международной торговли, перемещения капитала, услуг, туризма, кредитов и денежных переводов между странами.<\/p>\n<p><strong>Значение:<\/strong><\/p>\n<ul>\n<li>обеспечивают внешнюю торговлю (экспорт и импорт);<\/li>\n<li>позволяют привлекать иностранные инвестиции и кредиты;<\/li>\n<li>влияют на платёжный баланс и валютный курс страны;<\/li>\n<li>способствуют интеграции страны в мировую экономику.<\/li>\n<\/ul>\n<p><strong>Основные формы международных расчётов:<\/strong><\/p>\n<ul>\n<li><strong>Аккредитив<\/strong> — банк покупателя обязуется заплатить продавцу при предъявлении документов об отгрузке; самая надёжная форма.<\/li>\n<li><strong>Инкассо<\/strong> — банк получает платёж от покупателя по поручению продавца против документов.<\/li>\n<li><strong>Банковский перевод<\/strong> — поручение банку перевести деньги иностранному получателю (через SWIFT).<\/li>\n<li><strong>Авансовый платёж<\/strong> — оплата до поставки товара.<\/li>\n<li><strong>Расчёты по открытому счёту<\/strong> — оплата после получения товара.<\/li>\n<li><strong>Чеки и векселя.<\/strong><\/li>\n<\/ul>\n<p><strong>Участники:<\/strong> экспортёр, импортёр, банк экспортёра, банк импортёра, банки-корреспонденты.<\/p>\n<p><em>Пример:<\/em> казахстанская компания покупает оборудование в Китае и оплачивает его через аккредитив, чтобы гарантировать поставку.<\/p>", "k": ["Международные расчёты", "Необходимость", "Аккредитив", "Инкассо", "Банковский перевод", "Авансовый платёж", "Расчёты по открытому счёту", "Чеки и векселя", "Участники"], "s": "Международные расчёты — система организации и регулирования платежей по денежным требованиям и обязательствам между государствами, организациями и гражданами разных стран."}, {"n": 54, "q": "Возникновение и сущность акционерных обществ", "a": "<p><strong>Акционерное общество (АО)<\/strong> — юридическое лицо, которое выпускает акции для привлечения средств на свою деятельность. Акционеры не отвечают по обязательствам общества и несут риск убытков только в пределах стоимости своих акций.<\/p>\n<p><strong>Возникновение:<\/strong><\/p>\n<ul>\n<li>первые акционерные общества появились в <strong>XVII веке<\/strong> — Голландская и Британская Ост-Индские компании;<\/li>\n<li>их создание было вызвано потребностью в крупных капиталах для дальних торговых экспедиций, которые не мог собрать один человек;<\/li>\n<li>в XIX веке АО широко распространились в промышленности, на железных дорогах и в банковском деле.<\/li>\n<\/ul>\n<p><strong>Сущность АО:<\/strong><\/p>\n<ul>\n<li><strong>объединение капиталов<\/strong> многих инвесторов;<\/li>\n<li><strong>ограниченная ответственность<\/strong> акционеров;<\/li>\n<li><strong>отделение собственности от управления<\/strong> — управляют наёмные менеджеры;<\/li>\n<li>свободное обращение акций на рынке.<\/li>\n<\/ul>\n<p><strong>Органы управления АО (по закону РК «Об акционерных обществах»):<\/strong><\/p>\n<ul>\n<li>общее собрание акционеров;<\/li>\n<li>совет директоров;<\/li>\n<li>исполнительный орган (правление);<\/li>\n<li>служба внутреннего аудита.<\/li>\n<\/ul>\n<p><strong>Права акционера:<\/strong> участие в управлении (голосование), получение дивидендов, получение информации, часть имущества при ликвидации.<\/p>\n<p><em>Пример:<\/em> в Казахстане в форме АО работают все банки второго уровня, а также крупные компании — «Казатомпром», «Казахтелеком».<\/p>", "k": ["Акционерное общество (АО)", "XVII веке", "объединение капиталов", "ограниченная ответственность", "отделение собственности от управления", "Права акционера"], "s": "Акционерное общество (АО) — юридическое лицо, которое выпускает акции для привлечения средств на свою деятельность. Акционеры не отвечают по обязательствам общества и несут риск убытков только в пределах стоимости своих акций."}, {"n": 55, "q": "Роль Национального Банка в регулировании финансового рынка", "a": "<p><strong>Финансовый рынок<\/strong> — система отношений по купле-продаже финансовых ресурсов: денежный, кредитный, валютный рынки, рынок ценных бумаг, страховой рынок.<\/p>\n<p>С <strong>2020 года<\/strong> пруденциальное регулирование и надзор за финансовыми организациями (банками, страховыми компаниями, участниками рынка ценных бумаг) осуществляет <strong>АРРФР<\/strong>. При этом <strong>Национальный Банк<\/strong> сохраняет ключевую роль в регулировании финансового рынка.<\/p>\n<p><strong>Роль Национального Банка:<\/strong><\/p>\n<ul>\n<li><strong>Денежно-кредитная политика<\/strong> — через базовую ставку влияет на ставки по кредитам и депозитам на всём рынке.<\/li>\n<li><strong>Регулирование денежного рынка<\/strong> — управление ликвидностью банковской системы.<\/li>\n<li><strong>Валютное регулирование<\/strong> — правила валютных операций, мониторинг валютного рынка.<\/li>\n<li><strong>Платёжные системы<\/strong> — регулирование и надзор за платёжными системами и платёжными организациями.<\/li>\n<li><strong>Финансовая стабильность<\/strong> — макропруденциальная политика, оценка системных рисков совместно с АРРФР.<\/li>\n<li><strong>Управление активами<\/strong> — золотовалютные резервы и Национальный фонд.<\/li>\n<li><strong>Развитие инфраструктуры<\/strong> — участие в капитале KASE, Центрального депозитария.<\/li>\n<li><strong>Финансовая грамотность<\/strong> и защита интересов потребителей (совместно с АРРФР).<\/li>\n<\/ul>\n<p><em>Пример:<\/em> повышение базовой ставки НБРК приводит к росту ставок по депозитам и кредитам во всех банках страны.<\/p>", "k": ["Финансовый рынок", "2020 года", "АРРФР", "Национальный Банк", "Денежно-кредитная политика", "Регулирование денежного рынка", "Валютное регулирование", "Платёжные системы", "Финансовая стабильность", "Управление активами", "Развитие инфраструктуры", "Финансовая грамотность"], "s": "Финансовый рынок — система отношений по купле-продаже финансовых ресурсов: денежный, кредитный, валютный рынки, рынок ценных бумаг, страховой рынок."}, {"n": 56, "q": "Профессиональная деятельность на рынке ценных бумаг", "a": "<p><strong>Профессиональные участники рынка ценных бумаг<\/strong> — организации, которые на основании <strong>лицензии<\/strong> (выдаёт АРРФР) осуществляют профессиональную деятельность на рынке ценных бумаг.<\/p>\n<p><strong>Виды профессиональной деятельности:<\/strong><\/p>\n<ul>\n<li><strong>Брокерская<\/strong> — совершение сделок с ценными бумагами по поручению и за счёт клиента.<\/li>\n<li><strong>Дилерская<\/strong> — совершение сделок от своего имени и за свой счёт.<\/li>\n<li><strong>Деятельность по управлению инвестиционным портфелем<\/strong> — управление ценными бумагами и деньгами клиента для получения дохода.<\/li>\n<li><strong>Трансфер-агентская<\/strong> — приём и передача документов на сделки с ценными бумагами.<\/li>\n<li><strong>Кастодиальная<\/strong> — хранение финансовых инструментов клиентов и учёт прав на них.<\/li>\n<li><strong>Ведение системы реестров держателей ценных бумаг<\/strong> (регистраторская) — в РК функции регистратора выполняет <strong>Центральный депозитарий<\/strong>.<\/li>\n<li><strong>Клиринговая<\/strong> — сбор и сверка информации по сделкам, определение взаимных обязательств.<\/li>\n<li><strong>Организация торговли<\/strong> — деятельность фондовой биржи (KASE).<\/li>\n<\/ul>\n<p><strong>Требования к профессиональным участникам:<\/strong><\/p>\n<ul>\n<li>наличие лицензии;<\/li>\n<li>минимальный размер собственного капитала;<\/li>\n<li>квалифицированные сотрудники;<\/li>\n<li>соблюдение пруденциальных нормативов и правил раскрытия информации.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> гражданин открывает счёт у брокера (например, Freedom Finance или Halyk Finance) и через него покупает акции на KASE.<\/p>", "k": ["Профессиональные участники рынка ценных бумаг", "Брокерская", "Дилерская", "Трансфер-агентская", "Кастодиальная", "Центральный депозитарий", "Клиринговая", "Организация торговли"], "s": "Профессиональные участники рынка ценных бумаг — организации, которые на основании лицензии (выдаёт АРРФР) осуществляют профессиональную деятельность на рынке ценных бумаг."}, {"n": 57, "q": "Основные направления валютной политики Национального Банка Республики Казахстан", "a": "<p><strong>Валютная политика<\/strong> — совокупность мер государства и центрального банка в сфере валютных отношений, регулирования курса и валютных операций.<\/p>\n<p><strong>Основные направления валютной политики НБРК:<\/strong><\/p>\n<ul>\n<li><strong>Режим плавающего обменного курса<\/strong> — с августа 2015 года курс тенге определяется спросом и предложением на рынке.<\/li>\n<li><strong>Валютные интервенции<\/strong> — НБРК может вмешиваться в торги только для сглаживания резких колебаний курса, а не для его удержания на определённом уровне.<\/li>\n<li><strong>Продажи валюты из Национального фонда<\/strong> — для обеспечения трансфертов в бюджет.<\/li>\n<li><strong>Управление золотовалютными резервами<\/strong> — поддержание их достаточного уровня.<\/li>\n<li><strong>Валютное регулирование и контроль<\/strong> — правила проведения валютных операций резидентами и нерезидентами, мониторинг движения капитала.<\/li>\n<li><strong>Дедолларизация<\/strong> — снижение доли валюты в депозитах и кредитах, повышение доверия к тенге.<\/li>\n<li><strong>Развитие валютного рынка<\/strong> и его инфраструктуры.<\/li>\n<li><strong>Прозрачность<\/strong> — регулярная публикация данных об интервенциях.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> при резком ослаблении тенге из-за внешнего шока НБРК может провести интервенцию — продать часть резервов в долларах, чтобы сгладить скачок курса.<\/p>", "k": ["Валютная политика", "Режим плавающего обменного курса", "Валютные интервенции", "Продажи валюты из Национального фонда", "Управление золотовалютными резервами", "Валютное регулирование и контроль", "Дедолларизация", "Развитие валютного рынка", "Прозрачность"], "s": "Валютная политика — совокупность мер государства и центрального банка в сфере валютных отношений, регулирования курса и валютных операций."}, {"n": 58, "q": "Формы организации и виды валютных систем", "a": "<p><strong>Валютная система<\/strong> — форма организации валютных отношений, закреплённая национальным законодательством или межгосударственными соглашениями.<\/p>\n<p><strong>Виды валютных систем:<\/strong><\/p>\n<ul>\n<li><strong>Национальная<\/strong> — форма организации валютных отношений внутри страны (национальная валюта, режим курса, валютное регулирование, органы регулирования).<\/li>\n<li><strong>Региональная<\/strong> — валютные отношения группы стран (например, Европейская валютная система и единая валюта евро).<\/li>\n<li><strong>Мировая<\/strong> — форма организации международных валютных отношений.<\/li>\n<\/ul>\n<p><strong>Элементы валютной системы:<\/strong> валюта, валютный курс и режим курса, условия конвертируемости, международные расчёты, валютные рынки, регулирующие органы.<\/p>\n<p><strong>Этапы развития мировой валютной системы:<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>Парижская (1867 г.)<\/strong> — золотомонетный стандарт; валюты имели золотое содержание.<\/li>\n<li><strong>Генуэзская (1922 г.)<\/strong> — золотодевизный стандарт; наряду с золотом резервами стали валюты (фунт, доллар).<\/li>\n<li><strong>Бреттон-Вудская (1944 г.)<\/strong> — золотодолларовый стандарт; фиксированные курсы к доллару, доллар обменивался на золото (35 долларов за унцию); созданы МВФ и Всемирный банк.<\/li>\n<li><strong>Ямайская (1976–1978 гг.)<\/strong> — современная система; отмена золотого стандарта, свободный выбор режима курса, плавающие курсы, СДР.<\/li>\n<\/ol>\n<p><strong>Режимы валютного курса:<\/strong> фиксированный, плавающий, промежуточные (валютный коридор, управляемое плавание).<\/p>\n<p><em>Пример:<\/em> Казахстан использует режим плавающего курса тенге в рамках Ямайской валютной системы.<\/p>", "k": ["Валютная система", "Национальная", "Региональная", "Мировая", "Элементы валютной системы", "Парижская (1867 г.)", "Генуэзская (1922 г.)", "Бреттон-Вудская (1944 г.)", "Ямайская (1976–1978 гг.)", "Режимы валютного курса"], "s": "Валютная система — форма организации валютных отношений, закреплённая национальным законодательством или межгосударственными соглашениями."}, {"n": 59, "q": "Сущность, основные формы и классификация международного кредита", "a": "<p><strong>Международный кредит<\/strong> — движение ссудного капитала между странами на условиях возвратности, срочности и платности.<\/p>\n<p><strong>Сущность<\/strong> — перераспределение временно свободных средств между государствами, банками и компаниями разных стран для финансирования торговли, инвестиций и покрытия дефицитов.<\/p>\n<p><strong>Функции:<\/strong><\/p>\n<ul>\n<li>перераспределение капитала между странами;<\/li>\n<li>ускорение международной торговли;<\/li>\n<li>финансирование инвестиционных проектов;<\/li>\n<li>выравнивание платёжного баланса.<\/li>\n<\/ul>\n<p><strong>Основные формы и классификация:<\/strong><\/p>\n<ul>\n<li><strong>По источникам:<\/strong> внутренние (экспортёр за счёт отечественных средств), иностранные, смешанные.<\/li>\n<li><strong>По кредиторам:<\/strong>\n<ul>\n<li><strong>фирменный (коммерческий)<\/strong> — экспортёр предоставляет импортёру отсрочку платежа;<\/li>\n<li><strong>банковский<\/strong> — кредиты иностранных банков;<\/li>\n<li><strong>государственный<\/strong> — между правительствами;<\/li>\n<li><strong>кредиты международных организаций<\/strong> — МВФ, Всемирный банк, ЕБРР, АБР.<\/li>\n<\/ul><\/li>\n<li><strong>По назначению:<\/strong> коммерческие (для торговли), финансовые (для инвестиций, погашения долгов), промежуточные.<\/li>\n<li><strong>По срокам:<\/strong> краткосрочные (до 1 года), среднесрочные (1–5 лет), долгосрочные (свыше 5 лет).<\/li>\n<li><strong>По валюте:<\/strong> в валюте страны-должника, страны-кредитора, третьей страны.<\/li>\n<li><strong>По обеспечению:<\/strong> обеспеченные и бланковые (без обеспечения).<\/li>\n<li><strong>Специальные формы:<\/strong> лизинг, факторинг, форфейтинг, синдицированные кредиты, еврооблигации.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> Казахстан получает кредиты Всемирного банка и Азиатского банка развития на строительство дорог.<\/p>", "k": ["Международный кредит", "Сущность", "По источникам", "По кредиторам", "фирменный (коммерческий)", "банковский", "государственный", "кредиты международных организаций", "По назначению", "По срокам", "По валюте", "По обеспечению", "Специальные формы"], "s": "Международный кредит — движение ссудного капитала между странами на условиях возвратности, срочности и платности."}, {"n": 60, "q": "Денежная масса и её виды", "a": "<p><strong>Денежная масса<\/strong> — совокупность покупательных, платёжных и накопленных средств, обслуживающая экономические связи и принадлежащая физическим и юридическим лицам, а также государству.<\/p>\n<p><strong>Закон денежного обращения<\/strong> устанавливает количество денег, необходимое для выполнения функций средства обращения и средства платежа. Денежные агрегаты помогают определить количество денег в обращении.<\/p>\n<p><strong>Денежные агрегаты:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Агрегат<\/th>\n<th>Состав<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>M0<\/td>\n<td>Наличные деньги в обращении<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>M1<\/td>\n<td>M0 + средства предприятий на счетах в банках, вклады населения до востребования, средства страховых компаний<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>M2<\/td>\n<td>M1 + срочные депозиты населения<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>M3<\/td>\n<td>M2 + сертификаты и облигации государственного займа<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "k": ["Денежная масса", "Закон денежного обращения"], "s": "Денежная масса — совокупность покупательных, платёжных и накопленных средств, обслуживающая экономические связи и принадлежащая физическим и юридическим лицам, а также государству."}]}, {"id": "econ", "title": "Экономическая теория", "short": "Экономика", "questions": [{"n": 1, "q": "Что является предметом изучения экономической теории?", "a": "<p><strong>Экономическая теория<\/strong> — наука о том, как общество использует ограниченные ресурсы для производства товаров и услуг и распределения их между людьми.<\/p>\n<p><strong>Предмет изучения<\/strong> — экономические отношения между людьми в процессе производства, распределения, обмена и потребления благ, а также поведение экономических субъектов в условиях ограниченности ресурсов.<\/p>\n<p><strong>Что изучает экономическая теория:<\/strong><\/p>\n<ul>\n<li>как сделать <strong>выбор<\/strong> при ограниченных ресурсах и безграничных потребностях;<\/li>\n<li>поведение <strong>домохозяйств, фирм и государства<\/strong>;<\/li>\n<li>законы функционирования <strong>рынков<\/strong> (спрос, предложение, цены);<\/li>\n<li>экономику страны в целом (ВВП, инфляция, безработица, экономический рост).<\/li>\n<\/ul>\n<p><strong>Разделы экономической теории:<\/strong><\/p>\n<ul>\n<li><strong>Микроэкономика<\/strong> — поведение отдельных потребителей, фирм и рынков.<\/li>\n<li><strong>Макроэкономика<\/strong> — экономика страны в целом.<\/li>\n<li><strong>Мировая экономика<\/strong> — экономические отношения между странами.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> экономическая теория объясняет, почему при росте цены на хлеб люди покупают его меньше.<\/p>", "k": ["Экономическая теория", "Предмет изучения", "домохозяйств, фирм и государства", "Микроэкономика", "Макроэкономика", "Мировая экономика"], "s": "Экономическая теория — наука о том, как общество использует ограниченные ресурсы для производства товаров и услуг и распределения их между людьми."}, {"n": 2, "q": "В чем заключается главное противоречие экономики?", "a": "<p><strong>Главное противоречие экономики<\/strong> — противоречие между <strong>безграничными потребностями<\/strong> людей и <strong>ограниченными ресурсами<\/strong> для их удовлетворения.<\/p>\n<ul>\n<li><strong>Потребности<\/strong> — нужда в чём-либо для поддержания жизни и развития. Они постоянно растут: удовлетворив одни, человек сразу хочет другие.<\/li>\n<li><strong>Ресурсы<\/strong> — земля, труд, капитал, предпринимательские способности. Их количество ограничено.<\/li>\n<\/ul>\n<p><strong>Следствие — проблема выбора.<\/strong> Общество вынуждено решать три главных вопроса:<\/p>\n<ol type=\"1\">\n<li><strong>Что производить?<\/strong> — какие товары и в каком количестве.<\/li>\n<li><strong>Как производить?<\/strong> — какими технологиями и ресурсами.<\/li>\n<li><strong>Для кого производить?<\/strong> — как распределить произведённые блага.<\/li>\n<\/ol>\n<p><strong>Альтернативная стоимость (альтернативные издержки)<\/strong> — ценность лучшей из упущенных возможностей при выборе.<\/p>\n<p><em>Пример:<\/em> если государство тратит деньги на строительство дороги, оно не может потратить те же деньги на новую больницу.<\/p>", "k": ["Главное противоречие экономики", "безграничными потребностями", "ограниченными ресурсами", "Потребности", "Ресурсы", "Следствие — проблема выбора", "Что производить?", "Как производить?", "Для кого производить?"], "s": "Главное противоречие экономики — противоречие между безграничными потребностями людей и ограниченными ресурсами для их удовлетворения."}, {"n": 3, "q": "Методы экономической теории", "a": "<p><strong>Метод<\/strong> — совокупность способов и приёмов изучения экономических явлений.<\/p>\n<p><strong>Основные методы:<\/strong><\/p>\n<ul>\n<li><strong>Научная абстракция<\/strong> — отвлечение от второстепенных деталей, чтобы выделить главное.<\/li>\n<li><strong>Анализ и синтез<\/strong> — анализ разделяет явление на части, синтез объединяет их в целое.<\/li>\n<li><strong>Индукция и дедукция<\/strong> — индукция: от частных фактов к общему выводу; дедукция: от общей теории к частным случаям.<\/li>\n<li><strong>Историческое и логическое<\/strong> — изучение явлений в их развитии и выявление закономерностей.<\/li>\n<li><strong>Экономико-математическое моделирование<\/strong> — описание экономики с помощью формул, графиков, моделей.<\/li>\n<li><strong>Экономический эксперимент<\/strong> — проверка теории на практике (например, в отдельном регионе).<\/li>\n<li><strong>Сравнительный метод<\/strong> — сопоставление экономик разных стран и периодов.<\/li>\n<li><strong>Статистический метод<\/strong> — сбор и обработка данных.<\/li>\n<li><strong>Позитивный и нормативный анализ<\/strong> — позитивный описывает «как есть», нормативный — «как должно быть».<\/li>\n<\/ul>\n<p><em>Пример:<\/em> график спроса и предложения — это экономическая модель, построенная методом абстракции (учитывается только цена, остальные факторы считаются неизменными).<\/p>", "k": ["Метод", "Научная абстракция", "Анализ и синтез", "Индукция и дедукция", "Историческое и логическое", "Экономико-математическое моделирование", "Экономический эксперимент", "Сравнительный метод", "Статистический метод", "Позитивный и нормативный анализ"], "s": "Метод — совокупность способов и приёмов изучения экономических явлений."}, {"n": 4, "q": "Каковы основные функции экономической теории в обществе?", "a": "<p><strong>Функции экономической теории:<\/strong><\/p>\n<ul>\n<li><strong>Познавательная<\/strong> — изучение и объяснение экономических явлений и законов.<\/li>\n<li><strong>Практическая<\/strong> — разработка рекомендаций для экономической политики государства и решений фирм.<\/li>\n<li><strong>Прогностическая<\/strong> — предсказание будущего развития экономики.<\/li>\n<li><strong>Методологическая<\/strong> — является теоретической основой для других экономических наук (финансы, маркетинг, бухгалтерский учёт).<\/li>\n<li><strong>Идеологическая (мировоззренческая)<\/strong> — формирование экономического мышления и взглядов людей.<\/li>\n<li><strong>Критическая<\/strong> — оценка существующих экономических явлений и политики.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> на основе экономической теории Национальный Банк решает, повышать ли базовую ставку для борьбы с инфляцией (практическая функция).<\/p>", "k": ["Познавательная", "Практическая", "Прогностическая", "Методологическая", "Идеологическая (мировоззренческая)", "Критическая"], "s": ""}, {"n": 5, "q": "Что такое общественное производство и из каких основных фаз оно состоит? Опишите каждую фазу", "a": "<p><strong>Общественное производство<\/strong> — процесс создания материальных и нематериальных благ, необходимых для жизни и развития общества.<\/p>\n<p><strong>Воспроизводство<\/strong> — постоянно повторяющийся процесс производства. Бывает <strong>простое<\/strong> (в прежних масштабах) и <strong>расширенное<\/strong> (в растущих масштабах).<\/p>\n<p><strong>Фазы общественного производства:<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>Производство<\/strong> — создание благ путём соединения факторов производства. Это главная фаза: без неё нечего распределять и потреблять.<\/li>\n<li><strong>Распределение<\/strong> — определение доли каждого участника в произведённом продукте (зарплата, прибыль, рента, процент, налоги).<\/li>\n<li><strong>Обмен<\/strong> — получение нужных благ в обмен на свою долю: через рынок, куплю-продажу.<\/li>\n<li><strong>Потребление<\/strong> — использование благ для удовлетворения потребностей. Бывает <strong>личным<\/strong> (еда, одежда) и <strong>производственным<\/strong> (использование сырья, оборудования).<\/li>\n<\/ol>\n<p><strong>Взаимосвязь:<\/strong> производство — исходный пункт, потребление — конечная цель, а распределение и обмен связывают их.<\/p>\n<p><em>Пример:<\/em> фермер выращивает пшеницу (производство), получает доход от её продажи (распределение и обмен), хлебозавод перерабатывает её (производственное потребление), люди покупают хлеб (личное потребление).<\/p>", "k": ["Общественное производство", "Воспроизводство", "расширенное", "Производство", "Распределение", "Обмен", "Потребление", "производственным", "Взаимосвязь"], "s": "Общественное производство — процесс создания материальных и нематериальных благ, необходимых для жизни и развития общества."}, {"n": 6, "q": "Факторы производства", "a": "<p><strong>Факторы производства<\/strong> — ресурсы, используемые для производства товаров и услуг.<\/p>\n<p><strong>Основные факторы и доходы от них:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Фактор<\/th>\n<th>Что включает<\/th>\n<th>Доход владельца<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Земля<\/strong><\/td>\n<td>Все природные ресурсы: земля, вода, недра, лес<\/td>\n<td>Рента<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Труд<\/strong><\/td>\n<td>Физические и умственные способности человека<\/td>\n<td>Заработная плата<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Капитал<\/strong><\/td>\n<td>Здания, оборудование, инструменты, деньги для производства<\/td>\n<td>Процент<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Предпринимательские способности<\/strong><\/td>\n<td>Умение организовать производство, принимать решения и рисковать<\/td>\n<td>Прибыль<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Сегодня также выделяют <strong>информацию<\/strong> и <strong>технологии (знания)<\/strong> как отдельные факторы.<\/p>\n<p><strong>Особенности:<\/strong><\/p>\n<ul>\n<li>факторы <strong>ограничены<\/strong>;<\/li>\n<li>факторы <strong>взаимозаменяемы<\/strong> (например, рабочих можно заменить машинами);<\/li>\n<li>все факторы необходимо <strong>сочетать<\/strong> для производства.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> для работы пекарни нужны помещение и земля под ним, пекари, печи и мука, а также предприниматель, который всё это организует.<\/p>", "k": ["Факторы производства", "Земля", "Труд", "Капитал", "Предпринимательские способности", "информацию", "технологии (знания)", "ограничены", "взаимозаменяемы"], "s": "Факторы производства — ресурсы, используемые для производства товаров и услуг."}, {"n": 7, "q": "Что характеризует экономическую категорию «собственность» и какова ее структура?", "a": "<p><strong>Собственность<\/strong> — отношения между людьми по поводу присвоения материальных благ и ресурсов. Это не сама вещь, а отношения людей к вещи и друг к другу по поводу этой вещи.<\/p>\n<p><strong>Две стороны собственности:<\/strong><\/p>\n<ul>\n<li><strong>Экономическая<\/strong> — реальные отношения присвоения благ и получения дохода.<\/li>\n<li><strong>Юридическая<\/strong> — закрепление этих отношений в законах.<\/li>\n<\/ul>\n<p><strong>Структура права собственности (триада правомочий):<\/strong><\/p>\n<ul>\n<li><strong>Владение<\/strong> — фактическое обладание вещью.<\/li>\n<li><strong>Пользование<\/strong> — извлечение из вещи полезных свойств и доходов.<\/li>\n<li><strong>Распоряжение<\/strong> — определение судьбы вещи: продажа, дарение, сдача в аренду.<\/li>\n<\/ul>\n<p><strong>Субъекты собственности<\/strong> — те, кто владеет (граждане, организации, государство).<\/p>\n<p><strong>Объекты собственности<\/strong> — то, чем владеют (земля, здания, оборудование, деньги, интеллектуальная собственность).<\/p>\n<p><em>Пример:<\/em> владелец квартиры может жить в ней (владение и пользование) или продать её (распоряжение). Если он сдаёт квартиру в аренду, право пользования временно передаётся арендатору.<\/p>", "k": ["Собственность", "Экономическая", "Юридическая", "Владение", "Пользование", "Распоряжение", "Субъекты собственности", "Объекты собственности"], "s": "Собственность — отношения между людьми по поводу присвоения материальных благ и ресурсов. Это не сама вещь, а отношения людей к вещи и друг к другу по поводу этой вещи."}, {"n": 8, "q": "Назовите основные формы собственности в современной экономике", "a": "<p>По <strong>Конституции Республики Казахстан<\/strong> признаются и равным образом защищаются <strong>государственная<\/strong> и <strong>частная<\/strong> собственность.<\/p>\n<p><strong>Основные формы собственности:<\/strong><\/p>\n<ul>\n<li><strong>Частная собственность<\/strong> — принадлежит гражданам и негосударственным юридическим лицам.\n<ul>\n<li><strong>индивидуальная<\/strong> — принадлежит одному человеку (ИП);<\/li>\n<li><strong>коллективная (партнёрская)<\/strong> — принадлежит группе лиц (ТОО, акционерные общества, кооперативы).<\/li>\n<\/ul><\/li>\n<li><strong>Государственная собственность<\/strong> — принадлежит государству.\n<ul>\n<li><strong>республиканская<\/strong> — находится в ведении центральных органов;<\/li>\n<li><strong>коммунальная<\/strong> — находится в ведении местных органов (акиматов).<\/li>\n<\/ul><\/li>\n<li><strong>Смешанная собственность<\/strong> — сочетание государственной и частной (например, АО с участием государства).<\/li>\n<li><strong>Собственность общественных и религиозных объединений.<\/strong><\/li>\n<li><strong>Иностранная собственность<\/strong> — принадлежит иностранным гражданам и компаниям.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> магазин ИП — частная индивидуальная собственность, «Казахтелеком» — смешанная (часть акций у государства), городской парк — коммунальная собственность.<\/p>", "k": ["Конституции Республики Казахстан", "государственная", "Частная собственность", "индивидуальная", "коллективная (партнёрская)", "Государственная собственность", "республиканская", "коммунальная", "Смешанная собственность", "Иностранная собственность"], "s": "По Конституции Республики Казахстан признаются и равным образом защищаются государственная и частная собственность."}, {"n": 9, "q": "В чем заключается процесс приватизации и национализации имущества? Приведите примеры", "a": "<p><strong>Приватизация<\/strong> — передача государственного имущества в частную собственность (продажа, безвозмездная передача, выпуск акций).<\/p>\n<p><strong>Цели приватизации:<\/strong><\/p>\n<ul>\n<li>повышение эффективности предприятий;<\/li>\n<li>развитие конкуренции и предпринимательства;<\/li>\n<li>пополнение государственного бюджета;<\/li>\n<li>сокращение расходов государства на содержание убыточных предприятий.<\/li>\n<\/ul>\n<p><strong>Способы:<\/strong> аукцион, тендер, продажа акций на фондовой бирже (IPO), передача в доверительное управление с правом выкупа.<\/p>\n<p><strong>Национализация<\/strong> — переход частной собственности в собственность государства (обычно с компенсацией владельцу).<\/p>\n<p><strong>Причины национализации:<\/strong><\/p>\n<ul>\n<li>стратегическое значение отрасли (энергетика, оборона);<\/li>\n<li>спасение крупных предприятий от банкротства;<\/li>\n<li>защита национальных интересов.<\/li>\n<\/ul>\n<p><strong>Примеры в Казахстане:<\/strong><\/p>\n<ul>\n<li><strong>Приватизация<\/strong> — массовая приватизация в 1990-е годы (купонная приватизация); программа «Народное IPO» (размещение акций «Казатомпрома», «KEGOC», «Казахтелекома»).<\/li>\n<li><strong>Национализация<\/strong> — возврат государству доли в крупных проектах; в 2009 году государство через «Самрук-Казына» стало крупным акционером проблемных банков (БТА, Альянс) для их спасения.<\/li>\n<\/ul>", "k": ["Приватизация", "Способы", "Национализация"], "s": "Приватизация — передача государственного имущества в частную собственность (продажа, безвозмездная передача, выпуск акций)."}, {"n": 10, "q": "Что такое натуральное хозяйство и чем оно отличается от товарного?", "a": "<p><strong>Натуральное хозяйство<\/strong> — хозяйство, в котором продукты производятся для собственного потребления, а не для продажи.<\/p>\n<p><strong>Товарное хозяйство<\/strong> — хозяйство, в котором продукты производятся для продажи (обмена) на рынке.<\/p>\n<p><strong>Отличия:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Признак<\/th>\n<th>Натуральное хозяйство<\/th>\n<th>Товарное хозяйство<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Цель производства<\/td>\n<td>Собственное потребление<\/td>\n<td>Продажа на рынке<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Связи между производителями<\/td>\n<td>Замкнутость, почти нет связей<\/td>\n<td>Связаны через рынок<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Разделение труда<\/td>\n<td>Слабое<\/td>\n<td>Развитое<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Обмен<\/td>\n<td>Почти отсутствует<\/td>\n<td>Основа экономики<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Технологии<\/td>\n<td>Примитивные, рутинные<\/td>\n<td>Развиваются, совершенствуются<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Роль денег<\/td>\n<td>Почти не используются<\/td>\n<td>Деньги — посредник обмена<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Условия возникновения товарного хозяйства:<\/strong> общественное разделение труда и экономическая обособленность производителей (частная собственность).<\/p>\n<p><em>Пример:<\/em> семья, которая выращивает овощи на огороде только для себя, ведёт натуральное хозяйство, а фермер, выращивающий овощи на продажу, — товарное.<\/p>", "k": ["Натуральное хозяйство", "Товарное хозяйство", "Условия возникновения товарного хозяйства"], "s": "Натуральное хозяйство — хозяйство, в котором продукты производятся для собственного потребления, а не для продажи."}, {"n": 11, "q": "Охарактеризуйте понятие «товар» и его ключевые свойства", "a": "<p><strong>Товар<\/strong> — продукт труда, произведённый для обмена (продажи) и удовлетворяющий какую-либо потребность человека.<\/p>\n<p><strong>Ключевые свойства товара:<\/strong><\/p>\n<ul>\n<li><strong>Потребительная стоимость<\/strong> — способность товара удовлетворять потребность (полезность). <em>Пример:<\/em> хлеб утоляет голод.<\/li>\n<li><strong>Стоимость (меновая стоимость)<\/strong> — способность товара обмениваться на другие товары в определённых пропорциях; выражается в цене.<\/li>\n<\/ul>\n<p><strong>Подходы к стоимости товара:<\/strong><\/p>\n<ul>\n<li><strong>Трудовая теория<\/strong> (А. Смит, Д. Рикардо, К. Маркс) — стоимость определяется затратами общественно необходимого труда.<\/li>\n<li><strong>Теория предельной полезности<\/strong> — стоимость определяется полезностью последней единицы товара для потребителя.<\/li>\n<\/ul>\n<p><strong>Виды товаров:<\/strong><\/p>\n<ul>\n<li><strong>материальные<\/strong> (одежда, мебель) и <strong>услуги<\/strong> (стрижка, обучение);<\/li>\n<li><strong>потребительские<\/strong> (для личного пользования) и <strong>производственные<\/strong> (оборудование, сырьё);<\/li>\n<li>товары <strong>длительного<\/strong> и <strong>кратковременного<\/strong> пользования.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> вода в реке — благо, но не товар; вода в бутылке, произведённая для продажи, — товар.<\/p>", "k": ["Товар", "Потребительная стоимость", "Стоимость (меновая стоимость)", "Трудовая теория", "Теория предельной полезности", "материальные", "потребительские", "производственные", "длительного", "кратковременного"], "s": "Товар — продукт труда, произведённый для обмена (продажи) и удовлетворяющий какую-либо потребность человека."}, {"n": 12, "q": "Каковы условия возникновения и признаки рыночной экономики?", "a": "<p><strong>Рыночная экономика<\/strong> — экономическая система, основанная на частной собственности, свободе выбора и конкуренции, в которой основные вопросы (что, как и для кого производить) решаются через рынок.<\/p>\n<p><strong>Условия возникновения:<\/strong><\/p>\n<ul>\n<li><strong>общественное разделение труда<\/strong> и специализация;<\/li>\n<li><strong>экономическая обособленность<\/strong> производителей (частная собственность);<\/li>\n<li><strong>свобода предпринимательства<\/strong> и выбора;<\/li>\n<li>развитие <strong>товарно-денежных отношений<\/strong>.<\/li>\n<\/ul>\n<p><strong>Признаки рыночной экономики:<\/strong><\/p>\n<ul>\n<li><strong>Частная собственность<\/strong> на ресурсы;<\/li>\n<li><strong>Свобода предпринимательства<\/strong> — каждый может открыть бизнес;<\/li>\n<li><strong>Свобода выбора<\/strong> — потребитель сам решает, что покупать;<\/li>\n<li><strong>Конкуренция<\/strong> между производителями;<\/li>\n<li><strong>Свободное ценообразование<\/strong> — цены формируются спросом и предложением;<\/li>\n<li><strong>Личный интерес<\/strong> — стремление к выгоде как главный мотив;<\/li>\n<li><strong>Ограниченная роль государства.<\/strong><\/li>\n<\/ul>\n<p><em>Пример:<\/em> цены на овощи на рынке «Зелёный базар» устанавливают сами продавцы в зависимости от спроса, а не государство.<\/p>", "k": ["Рыночная экономика", "общественное разделение труда", "экономическая обособленность", "свобода предпринимательства", "товарно-денежных отношений", "Частная собственность", "Свобода выбора", "Конкуренция", "Свободное ценообразование", "Личный интерес", "Ограниченная роль государства"], "s": "Рыночная экономика — экономическая система, основанная на частной собственности, свободе выбора и конкуренции, в которой основные вопросы (что, как и для кого производить) решаются через рынок."}, {"n": 13, "q": "В чем преимущества и недостатки рыночной системы хозяйствования?", "a": "<p><strong>Преимущества рыночной экономики:<\/strong><\/p>\n<ul>\n<li><strong>Эффективное распределение ресурсов<\/strong> — ресурсы направляются туда, где они больше нужны;<\/li>\n<li><strong>Свобода выбора<\/strong> для потребителей и производителей;<\/li>\n<li><strong>Конкуренция<\/strong> стимулирует качество и снижение цен;<\/li>\n<li><strong>Стимулы к инновациям<\/strong> и внедрению новых технологий;<\/li>\n<li><strong>Гибкость<\/strong> — быстрая адаптация к изменениям спроса;<\/li>\n<li><strong>Разнообразие товаров и услуг.<\/strong><\/li>\n<\/ul>\n<p><strong>Недостатки рыночной экономики:<\/strong><\/p>\n<ul>\n<li><strong>Неравенство доходов<\/strong> — разрыв между богатыми и бедными;<\/li>\n<li><strong>Нестабильность<\/strong> — экономические кризисы, безработица, инфляция;<\/li>\n<li><strong>Не производит общественные блага<\/strong> (оборона, дороги, наука), так как они невыгодны бизнесу;<\/li>\n<li><strong>Внешние эффекты<\/strong> — например, загрязнение окружающей среды;<\/li>\n<li><strong>Монополизация<\/strong> — подавление конкуренции крупными компаниями;<\/li>\n<li><strong>Не учитывает интересы нетрудоспособных<\/strong> (пенсионеры, инвалиды).<\/li>\n<\/ul>\n<p><strong>Вывод:<\/strong> для устранения недостатков рынка необходимо государственное регулирование, поэтому большинство стран имеют <strong>смешанную экономику<\/strong>.<\/p>", "k": ["Эффективное распределение ресурсов", "Свобода выбора", "Конкуренция", "Стимулы к инновациям", "Гибкость", "Разнообразие товаров и услуг", "Неравенство доходов", "Нестабильность", "Не производит общественные блага", "Внешние эффекты", "Монополизация", "Не учитывает интересы нетрудоспособных", "Вывод", "смешанную экономику"], "s": "Вывод: для устранения недостатков рынка необходимо государственное регулирование, поэтому большинство стран имеют смешанную экономику."}, {"n": 14, "q": "Чем отличается рыночная экономика от командно-административной и традиционной?", "a": "<p><strong>Экономическая система<\/strong> — совокупность способов решения главных экономических вопросов (что, как, для кого производить).<\/p>\n<p><strong>Типы экономических систем:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Признак<\/th>\n<th>Традиционная<\/th>\n<th>Командно-административная<\/th>\n<th>Рыночная<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Собственность<\/td>\n<td>Общинная, семейная<\/td>\n<td>Государственная<\/td>\n<td>Частная<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Кто решает, что производить<\/td>\n<td>Обычаи и традиции<\/td>\n<td>Государство (план)<\/td>\n<td>Рынок (спрос и предложение)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Цены<\/td>\n<td>Почти не используются<\/td>\n<td>Устанавливает государство<\/td>\n<td>Свободные<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Конкуренция<\/td>\n<td>Отсутствует<\/td>\n<td>Отсутствует<\/td>\n<td>Есть<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Технологии<\/td>\n<td>Примитивные<\/td>\n<td>Отстают, кроме военных<\/td>\n<td>Быстро развиваются<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Пример<\/td>\n<td>Племена в Африке, Амазонии<\/td>\n<td>СССР, КНДР<\/td>\n<td>США, Сингапур<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Смешанная экономика<\/strong> — сочетание рыночного механизма и государственного регулирования. Это наиболее распространённая система сегодня (Казахстан, Германия, Швеция).<\/p>\n<p><em>Пример:<\/em> в СССР цену на хлеб устанавливал Госплан, а в Казахстане сегодня её формирует рынок, но государство может регулировать цены на социально значимые продукты.<\/p>", "k": ["Экономическая система", "Смешанная экономика"], "s": "Экономическая система — совокупность способов решения главных экономических вопросов (что, как, для кого производить)."}, {"n": 15, "q": "Какова роль конкуренции в рыночной экономике и какие существуют ее виды?", "a": "<p><strong>Конкуренция<\/strong> — соперничество между участниками рынка за лучшие условия производства и продажи товаров, за покупателей и прибыль.<\/p>\n<p><strong>Роль (функции) конкуренции:<\/strong><\/p>\n<ul>\n<li><strong>Регулирующая<\/strong> — устанавливает рыночные цены и баланс спроса и предложения;<\/li>\n<li><strong>Стимулирующая<\/strong> — побуждает снижать издержки, повышать качество, внедрять инновации;<\/li>\n<li><strong>Распределительная<\/strong> — направляет ресурсы к самым эффективным производителям;<\/li>\n<li><strong>Контролирующая<\/strong> — ограничивает власть отдельных фирм над рынком;<\/li>\n<li><strong>Санирующая<\/strong> — вытесняет неэффективные предприятия с рынка.<\/li>\n<\/ul>\n<p><strong>Виды конкуренции по методам:<\/strong><\/p>\n<ul>\n<li><strong>Ценовая<\/strong> — снижение цены;<\/li>\n<li><strong>Неценовая<\/strong> — качество, сервис, реклама, дизайн, гарантии.<\/li>\n<\/ul>\n<p><strong>Типы рыночных структур:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Тип<\/th>\n<th>Число фирм<\/th>\n<th>Товар<\/th>\n<th>Контроль над ценой<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Совершенная конкуренция<\/td>\n<td>Очень много<\/td>\n<td>Однородный<\/td>\n<td>Нет<\/td>\n<td>Рынок зерна, овощей<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Монополистическая конкуренция<\/td>\n<td>Много<\/td>\n<td>Дифференцированный<\/td>\n<td>Небольшой<\/td>\n<td>Кафе, магазины одежды<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Олигополия<\/td>\n<td>Несколько крупных<\/td>\n<td>Однородный или разный<\/td>\n<td>Значительный<\/td>\n<td>Мобильные операторы, автопроизводители<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Монополия<\/td>\n<td>Одна<\/td>\n<td>Уникальный<\/td>\n<td>Полный<\/td>\n<td>Железная дорога, электросети<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>В Казахстане конкуренцию защищает <strong>Агентство по защите и развитию конкуренции<\/strong>.<\/p>", "k": ["Конкуренция", "Регулирующая", "Стимулирующая", "Распределительная", "Контролирующая", "Санирующая", "Ценовая", "Неценовая", "Агентство по защите и развитию конкуренции"], "s": "Конкуренция — соперничество между участниками рынка за лучшие условия производства и продажи товаров, за покупателей и прибыль."}, {"n": 16, "q": "Что такое закон спроса и какова его графическая интерпретация?", "a": "<p><strong>Спрос<\/strong> — желание и возможность покупателей приобрести товар по определённой цене в определённый период.<\/p>\n<p><strong>Величина спроса<\/strong> — количество товара, которое покупатели готовы купить по данной цене.<\/p>\n<p><strong>Закон спроса:<\/strong> при прочих равных условиях <strong>чем выше цена товара, тем меньше величина спроса<\/strong>, и наоборот. Зависимость между ценой и величиной спроса — <strong>обратная<\/strong>.<\/p>\n<p><strong>Причины действия закона спроса:<\/strong><\/p>\n<ul>\n<li><strong>эффект дохода<\/strong> — при снижении цены покупатель становится «богаче» и может купить больше;<\/li>\n<li><strong>эффект замещения<\/strong> — при снижении цены товар становится выгоднее заменителей;<\/li>\n<li><strong>закон убывающей предельной полезности.<\/strong><\/li>\n<\/ul>\n<p><strong>Графическая интерпретация:<\/strong><\/p>\n<ul>\n<li><strong>Кривая спроса (D)<\/strong> строится в системе координат: по вертикали — цена (P), по горизонтали — количество (Q);<\/li>\n<li>кривая имеет <strong>нисходящий наклон<\/strong> (идёт сверху вниз слева направо);<\/li>\n<li><strong>изменение цены<\/strong> — движение <strong>вдоль<\/strong> кривой;<\/li>\n<li><strong>изменение неценовых факторов<\/strong> — <strong>сдвиг<\/strong> кривой (вправо — рост спроса, влево — снижение).<\/li>\n<\/ul>\n<p><strong>Исключения:<\/strong> товары Гиффена (дешёвые продукты первой необходимости у бедных), престижные товары (эффект Веблена).<\/p>\n<p><em>Пример:<\/em> при цене мороженого 500 тенге покупают 100 штук в день, а при цене 300 тенге — 200 штук.<\/p>", "k": ["Спрос", "Величина спроса", "Закон спроса", "эффект дохода", "эффект замещения", "закон убывающей предельной полезности", "Кривая спроса (D)", "нисходящий наклон", "изменение цены", "изменение неценовых факторов", "Исключения"], "s": "Спрос — желание и возможность покупателей приобрести товар по определённой цене в определённый период."}, {"n": 17, "q": "Перечислите неценовые факторы, влияющие на изменение спроса", "a": "<p><strong>Неценовые факторы спроса<\/strong> — факторы, кроме цены самого товара, которые меняют спрос и <strong>сдвигают кривую спроса<\/strong>.<\/p>\n<p><strong>Основные неценовые факторы:<\/strong><\/p>\n<ul>\n<li><strong>Доходы потребителей<\/strong> — при росте доходов спрос на нормальные товары растёт, на низшие (дешёвые) — падает.<\/li>\n<li><strong>Цены на товары-заменители<\/strong> — если подорожал чай, растёт спрос на кофе.<\/li>\n<li><strong>Цены на дополняющие товары<\/strong> — если подорожал бензин, падает спрос на автомобили.<\/li>\n<li><strong>Вкусы и предпочтения<\/strong> — мода, реклама, тренды.<\/li>\n<li><strong>Число покупателей<\/strong> — рост населения увеличивает спрос.<\/li>\n<li><strong>Ожидания потребителей<\/strong> — если ждут подорожания, покупают больше сейчас.<\/li>\n<li><strong>Сезонность и погода<\/strong> — летом растёт спрос на мороженое и кондиционеры.<\/li>\n<li><strong>Государственная политика<\/strong> — налоги, субсидии, льготные кредиты.<\/li>\n<\/ul>\n<p><strong>Направление сдвига:<\/strong><\/p>\n<ul>\n<li>рост спроса — кривая D сдвигается <strong>вправо<\/strong>;<\/li>\n<li>снижение спроса — кривая D сдвигается <strong>влево<\/strong>.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> после выхода популярного ролика в TikTok спрос на определённый товар резко растёт даже без снижения цены.<\/p>", "k": ["Неценовые факторы спроса", "сдвигают кривую спроса", "Доходы потребителей", "Цены на товары-заменители", "Цены на дополняющие товары", "Вкусы и предпочтения", "Число покупателей", "Ожидания потребителей", "Сезонность и погода", "Государственная политика"], "s": "Неценовые факторы спроса — факторы, кроме цены самого товара, которые меняют спрос и сдвигают кривую спроса."}, {"n": 18, "q": "Что такое закон предложения и какие факторы вызывают его сдвиг?", "a": "<p><strong>Предложение<\/strong> — желание и возможность продавцов продать товар по определённой цене в определённый период.<\/p>\n<p><strong>Закон предложения:<\/strong> при прочих равных условиях <strong>чем выше цена товара, тем больше величина предложения<\/strong>. Зависимость — <strong>прямая<\/strong>.<\/p>\n<p><strong>Причина:<\/strong> при высокой цене производство выгоднее, производители увеличивают выпуск, на рынок приходят новые фирмы.<\/p>\n<p><strong>График:<\/strong> кривая предложения (S) имеет <strong>восходящий наклон<\/strong> (снизу вверх слева направо).<\/p>\n<p><strong>Неценовые факторы, сдвигающие предложение:<\/strong><\/p>\n<ul>\n<li><strong>Цены на ресурсы<\/strong> — подорожание сырья снижает предложение;<\/li>\n<li><strong>Технологии<\/strong> — новые технологии снижают издержки и увеличивают предложение;<\/li>\n<li><strong>Налоги и субсидии<\/strong> — налоги уменьшают предложение, субсидии увеличивают;<\/li>\n<li><strong>Число продавцов<\/strong> на рынке;<\/li>\n<li><strong>Ожидания производителей<\/strong> — если ждут роста цен, могут придержать товар;<\/li>\n<li><strong>Цены на другие товары<\/strong> — производитель может переключиться на более выгодный товар;<\/li>\n<li><strong>Природные условия<\/strong> — особенно в сельском хозяйстве (засуха снижает урожай).<\/li>\n<\/ul>\n<p><strong>Направление сдвига:<\/strong> рост предложения — кривая S <strong>вправо<\/strong>, снижение — <strong>влево<\/strong>.<\/p>\n<p><em>Пример:<\/em> после засухи урожай пшеницы падает, предложение снижается, и цена на муку растёт.<\/p>", "k": ["Предложение", "Закон предложения", "Причина", "График", "восходящий наклон", "Цены на ресурсы", "Технологии", "Налоги и субсидии", "Число продавцов", "Ожидания производителей", "Цены на другие товары", "Природные условия", "Направление сдвига"], "s": "Предложение — желание и возможность продавцов продать товар по определённой цене в определённый период."}, {"n": 19, "q": "Как формируется рыночное равновесие и что такое равновесная цена?", "a": "<p><strong>Рыночное равновесие<\/strong> — состояние рынка, при котором величина спроса равна величине предложения.<\/p>\n<p><strong>Равновесная цена<\/strong> — цена, при которой количество товара, которое хотят купить покупатели, равно количеству, которое хотят продать продавцы.<\/p>\n<p><strong>Равновесный объём<\/strong> — количество товара, которое продаётся по равновесной цене.<\/p>\n<p><strong>Графически:<\/strong> равновесие — это <strong>точка пересечения<\/strong> кривых спроса (D) и предложения (S).<\/p>\n<p><strong>Как формируется равновесие:<\/strong><\/p>\n<ul>\n<li>если цена <strong>выше<\/strong> равновесной — возникает <strong>избыток (излишек)<\/strong> товара, продавцы снижают цены;<\/li>\n<li>если цена <strong>ниже<\/strong> равновесной — возникает <strong>дефицит<\/strong>, покупатели конкурируют, цена растёт;<\/li>\n<li>в результате цена сама движется к равновесному уровню.<\/li>\n<\/ul>\n<p><strong>Изменение равновесия:<\/strong><\/p>\n<ul>\n<li>рост спроса — равновесная цена и объём растут;<\/li>\n<li>рост предложения — цена снижается, объём растёт.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> если при цене 1 000 тенге за кг яблок покупатели хотят купить 500 кг и продавцы хотят продать 500 кг — это равновесная цена.<\/p>", "k": ["Рыночное равновесие", "Равновесная цена", "Равновесный объём", "Графически", "точка пересечения", "избыток (излишек)"], "s": "Рыночное равновесие — состояние рынка, при котором величина спроса равна величине предложения."}, {"n": 20, "q": "Что показывает эластичность спроса и предложения по цене?", "a": "<p><strong>Эластичность<\/strong> — степень реакции одной величины на изменение другой.<\/p>\n<p><strong>Эластичность спроса по цене<\/strong> — показывает, на сколько процентов изменится величина спроса при изменении цены на 1%.<\/p>\n<p><strong>Формула:<\/strong> Ed = % изменения величины спроса / % изменения цены.<\/p>\n<p><strong>Виды спроса по эластичности:<\/strong><\/p>\n<ul>\n<li><strong>Эластичный (Ed &gt; 1)<\/strong> — спрос сильно реагирует на цену (предметы роскоши, товары с заменителями).<\/li>\n<li><strong>Неэластичный (Ed &lt; 1)<\/strong> — спрос слабо реагирует (хлеб, соль, лекарства, бензин).<\/li>\n<li><strong>Единичной эластичности (Ed = 1)<\/strong> — изменение спроса равно изменению цены.<\/li>\n<li><strong>Абсолютно неэластичный (Ed = 0)<\/strong> — спрос не меняется (жизненно важные лекарства).<\/li>\n<li><strong>Абсолютно эластичный<\/strong> — малейший рост цены сводит спрос к нулю.<\/li>\n<\/ul>\n<p><strong>Факторы эластичности спроса:<\/strong> наличие заменителей, доля в бюджете, необходимость товара, время.<\/p>\n<p><strong>Эластичность предложения по цене<\/strong> — показывает, на сколько процентов изменится предложение при изменении цены на 1%. Зависит от <strong>времени<\/strong> (в долгосрочном периоде предложение эластичнее) и возможности увеличить производство.<\/p>\n<p><em>Пример:<\/em> цена на хлеб выросла на 10%, а спрос снизился только на 2% — спрос неэластичный.<\/p>", "k": ["Эластичность", "Эластичность спроса по цене", "Формула", "Эластичный (Ed > 1)", "Неэластичный (Ed < 1)", "Единичной эластичности (Ed = 1)", "Абсолютно неэластичный (Ed = 0)", "Абсолютно эластичный", "Факторы эластичности спроса", "Эластичность предложения по цене"], "s": "Эластичность — степень реакции одной величины на изменение другой."}, {"n": 21, "q": "Что характеризует понятие «полезность» в теории потребительского поведения?", "a": "<p><strong>Полезность<\/strong> — способность блага удовлетворять потребности человека; удовлетворение, которое потребитель получает от потребления блага.<\/p>\n<p><strong>Особенности полезности:<\/strong><\/p>\n<ul>\n<li><strong>субъективна<\/strong> — у разных людей разная (одному нравится кофе, другому нет);<\/li>\n<li>зависит от <strong>условий<\/strong> (вода в пустыне полезнее, чем в городе);<\/li>\n<li>зависит от <strong>количества<\/strong> уже потреблённого блага.<\/li>\n<\/ul>\n<p><strong>Виды полезности:<\/strong><\/p>\n<ul>\n<li><strong>Общая полезность (TU)<\/strong> — суммарное удовлетв
