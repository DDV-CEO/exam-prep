<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сдам на 5">
<title>Сдам на 5 — подготовка к экзаменам</title>
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1C1D21; --muted:#6B6E76; --line:#E6E2D9; --soft:#EFEBE2;
  --good:#1F8A5B; --good-bg:#E3F3EA; --mid:#B7791F; --mid-bg:#FBF0DC; --bad:#C2413B; --bad-bg:#FBE5E3;
  --acc:#2F6F5E; --acc-bg:#E2EFEA; --acc-ink:#FFFFFF;
  --r:16px; --shadow:0 1px 2px rgba(20,20,30,.05),0 4px 16px rgba(20,20,30,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171B; --card:#1F2126; --ink:#ECEDEF; --muted:#9A9DA6; --line:#2E3038; --soft:#272A31;
  --good:#4CC38A; --good-bg:#183326; --mid:#E0A84A; --mid-bg:#352A16; --bad:#F07067; --bad-bg:#3A1E1C;
  --shadow:none; }
}
body[data-subj="fin"]{ --acc:#2F6F5E; --acc-bg:#E2EFEA; }
body[data-subj="econ"]{ --acc:#4A4FB3; --acc-bg:#E7E8F8; }
@media (prefers-color-scheme: dark){
  body[data-subj="fin"]{ --acc:#5DB79C; --acc-bg:#1C3029; --acc-ink:#0E1A16; }
  body[data-subj="econ"]{ --acc:#8C91F0; --acc-bg:#24264A; --acc-ink:#12132A; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
textarea,input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.subj-pill{font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--acc-bg);color:var(--acc)}
h2{font-size:22px;line-height:1.25;margin:8px 0 4px;letter-spacing:-.01em}
h3{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
p.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:14px;font-weight:600;background:var(--soft);width:100%;text-align:center}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px}
.row > *{flex:1}
.stat{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat small{font-size:14px;color:var(--muted);font-weight:500}
.label{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.c-new{background:var(--line)} .c-bad{background:var(--bad)} .c-mid{background:var(--mid)} .c-good{background:var(--good)}
/* subject chooser */
.subj-card{display:block;width:100%;text-align:left;padding:18px}
.subj-card .t{font-size:18px;font-weight:650;margin:2px 0 12px}
.subj-card .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px}
.tag{display:inline-block;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px}
.tag.fin{background:#E2EFEA;color:#2F6F5E} .tag.econ{background:#E7E8F8;color:#4A4FB3}
@media (prefers-color-scheme: dark){ .tag.fin{background:#1C3029;color:#5DB79C} .tag.econ{background:#24264A;color:#8C91F0} }
/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--acc)}
/* study card */
.qnum{font-size:13px;font-weight:650;color:var(--acc)}
.qtext{font-size:21px;font-weight:650;line-height:1.3;margin:6px 0 4px;letter-spacing:-.01em}
.hint{font-size:14px;color:var(--muted)}
.answer{font-size:16px;line-height:1.6}
.answer p{margin:0 0 10px}
.answer ul,.answer ol{margin:0 0 12px;padding-left:20px}
.answer li{margin:3px 0}
.answer strong{font-weight:650}
.answer table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px;display:block;overflow-x:auto}
.answer th,.answer td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.answer th{background:var(--soft)}
.answer blockquote{margin:0 0 12px;padding:10px 12px;background:var(--soft);border-radius:10px}
.answer em{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--soft);font-weight:550}
.chip.ok{background:var(--good-bg);color:var(--good)}
.chip.miss{background:var(--bad-bg);color:var(--bad)}
.chip.blur{filter:blur(5px);user-select:none}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{min-height:58px;border-radius:14px;font-weight:650;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.grades button span{font-size:11px;font-weight:500;opacity:.8;margin-top:3px}
.g-bad{background:var(--bad-bg);color:var(--bad)} .g-mid{background:var(--mid-bg);color:var(--mid)} .g-good{background:var(--good-bg);color:var(--good)}
.progress-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress-top .bar{flex:1}
.progress-top .label{white-space:nowrap}
textarea.blurt{width:100%;min-height:200px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);resize:vertical;line-height:1.5}
textarea.blurt:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list-item:last-child{border-bottom:0}
.list-item .n{width:30px;font-size:13px;color:var(--muted);font-weight:600;flex:none}
.list-item .q{flex:1;font-size:15px;line-height:1.35}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.big-grade{font-size:72px;font-weight:750;line-height:1;letter-spacing:-.03em}
.center{text-align:center}
.mt{margin-top:12px} .mt2{margin-top:20px} .mb{margin-bottom:12px}
.method{display:flex;gap:12px;align-items:flex-start}
.method .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--acc-bg);color:var(--acc);display:grid;place-items:center;font-weight:700}
.method b{display:block;margin-bottom:2px}
.method p{margin:0;color:var(--muted);font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:650}
.ring{width:84px;height:84px;flex:none}
.hero{display:flex;align-items:center;gap:16px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
input[type=date]{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);width:100%}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="app"></main>
<nav class="bottom" id="nav" hidden></nav>
<div class="toast" id="toast"></div>
<div id="modal" hidden style="position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:none;place-items:center;padding:24px">
  <div class="card" style="max-width:360px;width:100%"><p id="modal-t" style="margin:0 0 16px;font-weight:600"></p>
  <div class="row"><button class="btn" id="modal-no">Отмена</button><button class="btn primary" id="modal-yes">Да</button></div></div>
</div>

<script>
const DATA = [{"id": "fin", "title": "Финансы, кредит и денежное обращение", "short": "Финансы", "questions": [{"n": 1, "q": "Функции денег и основные теории денег в мировой экономической науке", "a": "<p><strong>Функции денег<\/strong> — это основные направления, в которых проявляется экономическая роль денег в обществе. В экономической теории традиционно выделяют пять функций:<\/p>\n<ul>\n<li><strong>Мера стоимости<\/strong> — позволяет выражать и сравнивать стоимость товаров и услуг в денежных единицах. Благодаря этой функции устанавливаются цены.<\/li>\n<li><strong>Средство обращения<\/strong> — деньги выступают посредником при покупке и продаже товаров и услуг.<\/li>\n<li><strong>Средство платежа<\/strong> — деньги используются для погашения денежных обязательств.<\/li>\n<li><strong>Средство накопления<\/strong> — позволяет сохранять покупательную способность и использовать накопленные средства в будущем.<\/li>\n<li><strong>Мировые деньги<\/strong> — проявляется в международной торговле, международных расчётах и финансовых отношениях между странами.<\/li>\n<\/ul>\n<p><strong>Основные теории денег<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Теория<\/th>\n<th>Основная идея<\/th>\n<th>Представители<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Металлистическая<\/td>\n<td>Деньги связаны с драгоценными металлами и их собственной стоимостью<\/td>\n<td>Меркантилисты, сторонники металлического обращения<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Номиналистическая<\/td>\n<td>Деньги — знаки без собственной стоимости, равной номиналу<\/td>\n<td>Представители номинализма<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Количественная<\/td>\n<td>Количество денег и скорость их обращения связаны с уровнем цен<\/td>\n<td>Дэвид Юм, Ирвинг Фишер<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Кейнсианская<\/td>\n<td>Деньги влияют на ставки, инвестиции, занятость и производство<\/td>\n<td>Джон Мейнард Кейнс<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Монетаристская<\/td>\n<td>Денежное обращение определяет динамику номинальных доходов и инфляции<\/td>\n<td>Милтон Фридман<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "k": ["Функции денег", "Мера стоимости", "Средство обращения", "Средство платежа", "Средство накопления", "Мировые деньги"], "s": "Функции денег — это основные направления, в которых проявляется экономическая роль денег в обществе. В экономической теории традиционно выделяют пять функций."}, {"n": 2, "q": "Понятие денег, их экономическая сущность и виды", "a": "<p><strong>Деньги<\/strong> — особый экономический инструмент, который используется для измерения стоимости товаров и услуг, осуществления платежей, обмена и накопления богатства.<\/p>\n<p><strong>Экономическая сущность денег<\/strong> — они выступают всеобщим эквивалентом стоимости товаров и услуг.<\/p>\n<p><strong>1. По материальной форме и полноте стоимости:<\/strong><\/p>\n<ul>\n<li><strong>Действительные (товарные) деньги<\/strong> — имеют внутреннюю стоимость, равную номиналу (золотые и серебряные монеты; в древности — скот, шкуры).<\/li>\n<li><strong>Заместители действительных денег (знаки стоимости)<\/strong> — внутренняя стоимость намного меньше номинальной (банкноты, разменные монеты из дешёвых сплавов).<\/li>\n<\/ul>\n<p><strong>2. По современным формам выпуска и обращения:<\/strong><\/p>\n<ul>\n<li><strong>Наличные<\/strong> — банкноты и монеты, выпускаемые центральными банками.<\/li>\n<li><strong>Безналичные (депозитные)<\/strong> — записи на банковских счетах, которыми управляют через переводы, карты, платёжные системы.<\/li>\n<li><strong>Электронные<\/strong> — денежные обязательства эмитента в электронном виде на электронных кошельках или предоплаченных картах.<\/li>\n<li><strong>Цифровые (криптовалюта)<\/strong> — децентрализованные цифровые активы на основе криптографии и блокчейна.<\/li>\n<\/ul>", "k": ["Деньги", "Экономическая сущность денег", "Действительные (товарные) деньги", "Наличные", "Безналичные (депозитные)", "Электронные", "Цифровые (криптовалюта)"], "s": "Деньги — особый экономический инструмент, который используется для измерения стоимости товаров и услуг, осуществления платежей, обмена и накопления богатства."}, {"n": 3, "q": "Рынок ссудного капитала: структура и участники", "a": "<p><strong>Рынок ссудного капитала<\/strong> — часть финансового рынка, на которой временно свободные денежные средства движутся между кредиторами и заёмщиками на условиях возвратности, срочности и платности.<\/p>\n<p><strong>Структура по временному признаку:<\/strong><\/p>\n<ul>\n<li><strong>Денежный рынок (Money Market)<\/strong> — краткосрочные ссудные капиталы (до 1 года); поддерживает текущую ликвидность.<\/li>\n<li><strong>Рынок капиталов (Capital Market)<\/strong> — среднесрочные (1–5 лет) и долгосрочные (свыше 5 лет) капиталы; обеспечивает инвестиции, крупные покупки и масштабирование бизнеса.<\/li>\n<\/ul>\n<p><strong>Структура по институциональному признаку:<\/strong><\/p>\n<ul>\n<li><strong>Кредитная система<\/strong> — кредитно-финансовые институты (НБРК, банки, микрокредитные организации).<\/li>\n<li><strong>Рынок ценных бумаг<\/strong> — капитал перераспределяется через выпуск и обращение акций, облигаций и других ценных бумаг.<\/li>\n<\/ul>\n<p><strong>Участники<\/strong><\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Кредиторы<\/th>\n<th>Заёмщики<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>банки<\/td>\n<td>физические лица<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>финансовые организации<\/td>\n<td>юридические лица<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>предприятия<\/td>\n<td>государство<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>население<\/td>\n<td>финансовые организации<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>государство<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "k": ["Рынок ссудного капитала", "Денежный рынок (Money Market)", "Рынок капиталов (Capital Market)", "Кредитная система", "Рынок ценных бумаг"], "s": "Рынок ссудного капитала — часть финансового рынка, на которой временно свободные денежные средства движутся между кредиторами и заёмщиками на условиях возвратности, срочности и платности."}, {"n": 4, "q": "Понятие денежной системы и её основные элементы", "a": "<p><strong>Денежная система<\/strong> — установленная законодательством организация денежного обращения в стране.<\/p>\n<p>Элементы:<\/p>\n<ul>\n<li><strong>Денежная единица<\/strong> — установленный законом масштаб и наименование единицы счёта (тенге, доллар).<\/li>\n<li><strong>Формы денег<\/strong> — товарные, металлические (монеты), бумажные (банкноты), кредитные, электронные, цифровые.<\/li>\n<li><strong>Порядок эмиссии<\/strong> — законодательно регламентированный выпуск денег в обращение центральным банком.<\/li>\n<li><strong>Организация наличного и безналичного оборота<\/strong> — регламентированное движение денег при обращении товаров и услуг, платежах, распределении доходов.<\/li>\n<li><strong>Органы и инструменты регулирования<\/strong> — органы (Центральный банк, Министерство финансов, банки, регуляторы) и инструменты (учётная ставка, нормы обязательных резервов, операции на открытом рынке), направленные на борьбу с инфляцией и поддержание стабильности.<\/li>\n<\/ul>", "k": ["Денежная система", "Денежная единица", "Формы денег", "Порядок эмиссии", "Организация наличного и безналичного оборота", "Органы и инструменты регулирования"], "s": "Денежная система — установленная законодательством организация денежного обращения в стране."}, {"n": 5, "q": "Структура национальной денежной системы и её особенности", "a": "<p><strong>Основные элементы:<\/strong><\/p>\n<ul>\n<li><strong>Национальная валюта<\/strong> — установленный законом денежный знак (тенге). Действует десятичное деление: 1 тенге = 100 тиын.<\/li>\n<li><strong>Виды денежных средств<\/strong> — наличные, безналичные, электронные, цифровые.<\/li>\n<li><strong>Центральный банк<\/strong> — исключительное право выпуска наличных денег, их изъятия и регулирования денежной массы.<\/li>\n<li><strong>Коммерческие банки и финансовые институты<\/strong> — банки, страховые компании, пенсионные фонды, микрокредитные организации.<\/li>\n<li><strong>Законодательная база<\/strong> — законы и нормы, определяющие статус денег как законного платёжного средства.<\/li>\n<\/ul>\n<p><strong>Особенности современных денежных систем:<\/strong><\/p>\n<ul>\n<li><strong>Демонетизация золота<\/strong> — деньги не обеспечены драгоценными металлами.<\/li>\n<li><strong>Преобладание безналичного оборота<\/strong> — наличные составляют малую часть денежной массы.<\/li>\n<li><strong>Двухуровневая банковская модель<\/strong> — ЦБ отвечает за эмиссию и стабильность, коммерческие банки — за работу с клиентами.<\/li>\n<li><strong>Суверенность и валютное регулирование<\/strong> — независимая денежно-кредитная политика, плавающий или фиксированный курс.<\/li>\n<li><strong>Цифровые валюты ЦБ (CBDC)<\/strong> — например, цифровой тенге.<\/li>\n<\/ul>", "k": ["Национальная валюта", "Виды денежных средств", "Центральный банк", "Коммерческие банки и финансовые институты", "Законодательная база", "Демонетизация золота", "Преобладание безналичного оборота", "Двухуровневая банковская модель", "Суверенность и валютное регулирование", "Цифровые валюты ЦБ (CBDC)"], "s": ""}, {"n": 6, "q": "Организация безналичных расчётов", "a": "<p><strong>Организация безналичных расчётов<\/strong> — система правил, способов и механизмов проведения платежей без наличных денег, путём перечисления средств между банковскими счетами или через электронные платёжные инструменты.<\/p>\n<p><strong>Основные элементы:<\/strong><\/p>\n<ul>\n<li><strong>Участники<\/strong> — плательщик, получатель, банки и платёжные организации.<\/li>\n<li><strong>Формы расчётов<\/strong> — переводы, платёжные поручения, карты, QR-платежи, электронные платежи.<\/li>\n<li><strong>Банковские счета<\/strong> — для хранения и перечисления средств.<\/li>\n<li><strong>Платёжная инфраструктура<\/strong> — обработка информации и проведение платежей.<\/li>\n<\/ul>\n<p><strong>Порядок проведения расчёта:<\/strong><\/p>\n<ol type=\"1\">\n<li>Плательщик даёт распоряжение на оплату.<\/li>\n<li>Банк плательщика принимает и проверяет распоряжение.<\/li>\n<li>Средства списываются со счёта плательщика.<\/li>\n<li>Платёж проходит через платёжную инфраструктуру.<\/li>\n<li>Деньги зачисляются на счёт получателя.<\/li>\n<\/ol>\n<p><strong>Преимущества:<\/strong> ускорение расчётов, снижение расходов на перевозку и хранение наличных, безопасность, контроль денежных потоков, развитие экономики, прозрачность операций.<\/p>", "k": ["Организация безналичных расчётов", "Участники", "Формы расчётов", "Банковские счета", "Платёжная инфраструктура", "Преимущества"], "s": "Организация безналичных расчётов — система правил, способов и механизмов проведения платежей без наличных денег, путём перечисления средств между банковскими счетами или через электронные платёжные инструменты."}, {"n": 7, "q": "Экономическая сущность инфляции, причины её возникновения и последствия", "a": "<p><strong>Инфляция<\/strong> — устойчивое повышение общего уровня цен на товары и услуги, которое приводит к снижению покупательной способности денег.<\/p>\n<p><strong>Экономическая сущность<\/strong> — нарушение равновесия между денежной массой и товарной массой: денег в обращении становится больше, чем нужно для обслуживания товарооборота.<\/p>\n<p><strong>Виды инфляции по темпам:<\/strong><\/p>\n<ul>\n<li><strong>Умеренная (ползучая)<\/strong> — до 10% в год.<\/li>\n<li><strong>Галопирующая<\/strong> — от 10% до 50–100% в год.<\/li>\n<li><strong>Гиперинфляция<\/strong> — свыше 50% в месяц.<\/li>\n<\/ul>\n<p><strong>Причины возникновения:<\/strong><\/p>\n<ul>\n<li><strong>Инфляция спроса<\/strong> — спрос превышает предложение (рост доходов, кредитования, госрасходов, избыточная эмиссия).<\/li>\n<li><strong>Инфляция издержек<\/strong> — рост затрат производства (сырьё, энергия, зарплата, ослабление национальной валюты).<\/li>\n<li><strong>Дефицит бюджета<\/strong>, финансируемый за счёт эмиссии.<\/li>\n<li><strong>Инфляционные ожидания<\/strong> — население и бизнес ждут роста цен и заранее повышают цены и спрос.<\/li>\n<li><strong>Внешние факторы<\/strong> — рост цен на импорт, девальвация.<\/li>\n<\/ul>\n<p><strong>Последствия:<\/strong><\/p>\n<ul>\n<li>снижение реальных доходов и сбережений населения;<\/li>\n<li>перераспределение доходов (выигрывают должники, проигрывают кредиторы);<\/li>\n<li>рост неопределённости, снижение инвестиций;<\/li>\n<li>обесценивание национальной валюты, рост процентных ставок.<\/li>\n<\/ul>\n<p><strong>Меры борьбы:<\/strong> повышение базовой ставки, сокращение денежной массы, сокращение дефицита бюджета, стимулирование производства.<\/p>\n<p><em>Пример:<\/em> если инфляция составляет 10% в год, то на 100 000 тенге через год можно купить столько же товаров, сколько сейчас примерно на 90 900 тенге.<\/p>", "k": ["Инфляция", "Экономическая сущность", "Умеренная (ползучая)", "Галопирующая", "Гиперинфляция", "Инфляция спроса", "Инфляция издержек", "Дефицит бюджета", "Инфляционные ожидания", "Внешние факторы", "Меры борьбы"], "s": "Инфляция — устойчивое повышение общего уровня цен на товары и услуги, которое приводит к снижению покупательной способности денег."}, {"n": 8, "q": "Необходимость кредита и его экономическая сущность", "a": "<p><strong>Кредит<\/strong> — экономические отношения, возникающие при предоставлении денежных средств или имущества во временное пользование на условиях возвратности, срочности и платности, а в предусмотренных случаях — обеспеченности и целевого использования.<\/p>\n<p>Кредит позволяет временно перераспределять денежные ресурсы между участниками экономики.<\/p>\n<p><strong>Необходимость кредита<\/strong> обусловлена тем, что у участников экономики деньги появляются в разное время и в разных объёмах. Например:<\/p>\n<ul>\n<li>предприятию нужно купить сырьё сегодня, а выручка придёт позже;<\/li>\n<li>предпринимателю нужно оборудование для расширения производства;<\/li>\n<li>гражданину нужно жильё, а собственных средств недостаточно;<\/li>\n<li>сельхозпредприятию нужны средства до реализации урожая;<\/li>\n<li>государство привлекает заёмные средства для финансирования расходов и проектов.<\/li>\n<\/ul>", "k": ["Кредит", "Необходимость кредита"], "s": "Кредит — экономические отношения, возникающие при предоставлении денежных средств или имущества во временное пользование на условиях возвратности, срочности и платности, а в предусмотренных случаях — обеспеченности и целевого использования."}, {"n": 9, "q": "Сущность и функции финансов", "a": "<p><strong>Финансы<\/strong> — экономические отношения, связанные с формированием, распределением и использованием централизованных (государственных) и децентрализованных (ресурсов хозяйствующих субъектов) фондов денежных средств для выполнения функций государства и обеспечения расширенного воспроизводства.<\/p>\n<p>Например, отношения между:<\/p>\n<ul>\n<li>предприятием и государством (уплата налогов);<\/li>\n<li>населением и государством (налоги и сборы, социальное финансирование);<\/li>\n<li>предприятиями и работниками (зарплата);<\/li>\n<li>предприятиями (оплата счетов);<\/li>\n<li>предприятиями и банками (кредитование, хранение средств на счетах).<\/li>\n<\/ul>\n<p><strong>Сущность финансов<\/strong> — формирование, распределение и использование фондов денежных средств для задач государства и жизнедеятельности предприятий и населения.<\/p>\n<p><strong>Функции финансов:<\/strong><\/p>\n<ul>\n<li><strong>Распределительная<\/strong> — направление ресурсов на определённые цели (покупка оборудования, оплата расходов).<\/li>\n<li><strong>Контрольная<\/strong> — контроль использования ресурсов (проверка бюджета расходов).<\/li>\n<\/ul>", "k": ["Финансы", "Сущность финансов", "Распределительная", "Контрольная"], "s": "Финансы — экономические отношения, связанные с формированием, распределением и использованием централизованных (государственных) и децентрализованных (ресурсов хозяйствующих субъектов) фондов денежных средств для выполнения функций государства и обеспечения расширенного воспроизводства."}, {"n": 10, "q": "Субъекты и объекты кредитной сделки", "a": "<p><strong>Субъекты (кто участвует):<\/strong> кредитор и заёмщик.<\/p>\n<p>Например, банковский кредит предоставляется банком заёмщику по договору банковского займа. Коммерческий кредит возникает между хозяйствующими субъектами при отсрочке или рассрочке платежа.<\/p>\n<p><strong>Объекты (что передаётся):<\/strong><\/p>\n<ul>\n<li><strong>Денежная форма<\/strong> — конкретная сумма денег в виде ссуды.<\/li>\n<li><strong>Товарная форма (коммерческий кредит)<\/strong> — товары, оборудование, сырьё или транспорт в рассрочку, лизинг или под вексель.<\/li>\n<\/ul>", "k": ["Субъекты (кто участвует)", "Денежная форма", "Товарная форма (коммерческий кредит)"], "s": "Субъекты (кто участвует): кредитор и заёмщик."}, {"n": 11, "q": "Сущность и принципы организации безналичных расчётов", "a": "<p><strong>Безналичные расчёты<\/strong> — форма денежного обращения, при которой платежи осуществляются без наличных денег, путём перечисления средств со счёта на счёт или через электронные платёжные инструменты.<\/p>\n<p><em>Пример:<\/em> покупатель оплачивает покупку картой или QR-кодом — деньги перечисляются продавцу без передачи наличных.<\/p>\n<p><strong>Принципы:<\/strong><\/p>\n<ul>\n<li><strong>Законность<\/strong> — операции соответствуют законодательству РК.<\/li>\n<li><strong>Документальное подтверждение<\/strong> — на основании платёжных распоряжений или электронных сообщений.<\/li>\n<li><strong>Обеспеченность платежа<\/strong> — на счёте должно быть достаточно средств.<\/li>\n<li><strong>Своевременность<\/strong> — платежи в установленные сроки.<\/li>\n<li><strong>Безопасность<\/strong> — защита средств и данных клиентов.<\/li>\n<li><strong>Контроль операций<\/strong> — участники выполняют обязанности по контролю, предусмотренные законом.<\/li>\n<\/ul>", "k": ["Безналичные расчёты", "Законность", "Документальное подтверждение", "Обеспеченность платежа", "Своевременность", "Безопасность", "Контроль операций"], "s": "Безналичные расчёты — форма денежного обращения, при которой платежи осуществляются без наличных денег, путём перечисления средств со счёта на счёт или через электронные платёжные инструменты."}, {"n": 12, "q": "Функции и классификация кредита", "a": "<p><strong>Функции кредита:<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>Перераспределительная<\/strong> — перераспределение временно свободных средств. <em>Пример:<\/em> банк выдаёт заём предпринимателю на оборудование.<\/li>\n<li><strong>Стимулирующая<\/strong> — позволяет осуществлять расходы и инвестиции сверх собственных средств.<\/li>\n<li><strong>Обеспечение непрерывности кругооборота капитала<\/strong> — покрывает разрыв: закупка сырья → производство → продажа → выручка.<\/li>\n<li><strong>Ускорение экономического развития<\/strong> — финансирование производства, торговли и инвестиций. Но кредит сам по себе не гарантирует роста: всё зависит от рационального использования средств.<\/li>\n<\/ol>\n<p><strong>Классификация по субъектам:<\/strong><\/p>\n<ul>\n<li><strong>Банковский<\/strong> — банк выдаёт заём по договору банковского займа.<\/li>\n<li><strong>Коммерческий<\/strong> — между предприятиями при отсрочке платежа. <em>Пример:<\/em> поставщик передаёт товар магазину с оплатой через 30 дней.<\/li>\n<li><strong>Государственный<\/strong> — государство выступает заёмщиком, кредитором или гарантом.<\/li>\n<li><strong>Международный<\/strong> — между субъектами разных государств.<\/li>\n<\/ul>", "k": ["Перераспределительная", "Стимулирующая", "Ускорение экономического развития", "Банковский", "Коммерческий", "Государственный", "Международный"], "s": ""}, {"n": 13, "q": "Кредитная система и её структура", "a": "<p><strong>Кредитная система<\/strong> — совокупность кредитных отношений, форм и методов кредитования, а также кредитно-финансовых институтов, обеспечивающих аккумуляцию и перераспределение временно свободных средств.<\/p>\n<p><strong>Структура:<\/strong> банковская система и небанковские кредитно-финансовые институты.<\/p>\n<p>Банковская система Казахстана — <strong>двухуровневая<\/strong>:<\/p>\n<ul>\n<li>1-й уровень — Национальный Банк РК;<\/li>\n<li>2-й уровень — банки второго уровня.<\/li>\n<\/ul>\n<p><strong>Функции:<\/strong> аккумуляция средств, перераспределение, стимулирование экономической активности, обеспечение непрерывности движения капитала.<\/p>", "k": ["Кредитная система", "Структура", "двухуровневая", "Функции"], "s": "Кредитная система — совокупность кредитных отношений, форм и методов кредитования, а также кредитно-финансовых институтов, обеспечивающих аккумуляцию и перераспределение временно свободных средств."}, {"n": 14, "q": "Экономическая сущность, цели и задачи бюджетной политики", "a": "<p><strong>Бюджетная политика<\/strong> — совокупность мер государства по формированию доходов бюджета, распределению и использованию бюджетных средств, а также по управлению дефицитом и государственным долгом.<\/p>\n<p><strong>Экономическая сущность<\/strong> — с помощью бюджета государство перераспределяет часть национального дохода и влияет на экономический рост, занятость и уровень жизни.<\/p>\n<p><strong>Цели:<\/strong><\/p>\n<ul>\n<li>обеспечение макроэкономической стабильности;<\/li>\n<li>устойчивый экономический рост;<\/li>\n<li>повышение уровня жизни населения;<\/li>\n<li>сбалансированность бюджета.<\/li>\n<\/ul>\n<p><strong>Задачи:<\/strong><\/p>\n<ul>\n<li><strong>Мобилизация доходов<\/strong> — сбор налогов и других поступлений в бюджет.<\/li>\n<li><strong>Эффективное распределение расходов<\/strong> — финансирование образования, здравоохранения, обороны, инфраструктуры.<\/li>\n<li><strong>Социальная защита<\/strong> — пенсии, пособия, адресная помощь.<\/li>\n<li><strong>Регулирование экономики<\/strong> — поддержка приоритетных отраслей, субсидии, госинвестиции.<\/li>\n<li><strong>Управление дефицитом и долгом<\/strong> — удержание дефицита и госдолга в безопасных пределах.<\/li>\n<li><strong>Межбюджетное выравнивание<\/strong> — трансферты между республиканским и местными бюджетами.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> государство увеличивает расходы на строительство дорог, чтобы создать рабочие места и поддержать экономику в период спада.<\/p>", "k": ["Бюджетная политика", "Экономическая сущность", "Мобилизация доходов", "Эффективное распределение расходов", "Социальная защита", "Регулирование экономики", "Управление дефицитом и долгом", "Межбюджетное выравнивание"], "s": "Бюджетная политика — совокупность мер государства по формированию доходов бюджета, распределению и использованию бюджетных средств, а также по управлению дефицитом и государственным долгом."}, {"n": 15, "q": "Специализированные кредитные организации", "a": "<p>Специализированные финансово-кредитные организации ориентируются на определённые услуги или группы клиентов.<\/p>\n<p>В Казахстане к ним относятся:<\/p>\n<ul>\n<li><strong>Микрофинансовые организации (МФО)<\/strong> — предоставляют микрокредиты;<\/li>\n<li><strong>Кредитные товарищества<\/strong> — финансируют своих участников;<\/li>\n<li><strong>Ломбарды<\/strong> — выдают микрокредиты физлицам под залог движимого имущества.<\/li>\n<\/ul>\n<p>Отдельно выделяют <strong>организации, осуществляющие отдельные виды банковских операций (ООВПО)<\/strong> — юрлица, не являющиеся банками второго уровня, которые по лицензии или в силу закона проводят только определённые операции (ипотечные компании, национальный оператор почты и др.). <em>Пример:<\/em> ипотечная компания выдаёт ипотечный заём, но не принимает вклады населения.<\/p>", "k": ["Микрофинансовые организации (МФО)", "Кредитные товарищества", "Ломбарды"], "s": "Специализированные финансово-кредитные организации ориентируются на определённые услуги или группы клиентов."}, {"n": 16, "q": "Банковская система Республики Казахстан и её особенности", "a": "<p>В Казахстане <strong>двухуровневая банковская система<\/strong>:<\/p>\n<ul>\n<li><strong>Верхний уровень — Национальный Банк<\/strong>: стабильность цен, денежно-кредитная политика, платёжная инфраструктура.<\/li>\n<li><strong>Нижний уровень — банки второго уровня<\/strong>: депозиты, платежи, займы и иные услуги.<\/li>\n<\/ul>\n<p>Регулирование и надзор за банками осуществляет <strong>АРРФР<\/strong>. Для банковской деятельности нужна лицензия.<\/p>\n<blockquote>\n<p><strong>Примечание:<\/strong> «коммерческий банк» — экономическая характеристика; «банк второго уровня» — категория, используемая в РК. АРРФР не является третьим уровнем банковской системы.<\/p>\n<\/blockquote>", "k": ["двухуровневая банковская система", "Верхний уровень — Национальный Банк", "Нижний уровень — банки второго уровня", "АРРФР"], "s": "Регулирование и надзор за банками осуществляет АРРФР. Для банковской деятельности нужна лицензия."}, {"n": 17, "q": "Значение, задачи, основные направления и типы финансовой политики", "a": "<p><strong>Финансовая политика<\/strong> — совокупность мер государства по мобилизации финансовых ресурсов, их распределению и использованию для выполнения его функций.<\/p>\n<p><strong>Значение<\/strong> — финансовая политика определяет, сколько ресурсов получит государство, на что они будут потрачены и как это повлияет на экономику и уровень жизни.<\/p>\n<p><strong>Задачи:<\/strong><\/p>\n<ul>\n<li>обеспечение государства финансовыми ресурсами;<\/li>\n<li>создание условий для экономического роста;<\/li>\n<li>регулирование и стимулирование экономики;<\/li>\n<li>социальная защита населения;<\/li>\n<li>финансовая стабильность.<\/li>\n<\/ul>\n<p><strong>Основные направления (составные части):<\/strong><\/p>\n<ul>\n<li><strong>Бюджетная политика<\/strong> — доходы и расходы бюджета.<\/li>\n<li><strong>Налоговая политика<\/strong> — налоги, ставки, льготы.<\/li>\n<li><strong>Денежно-кредитная политика<\/strong> — денежная масса, ставки, кредит.<\/li>\n<li><strong>Таможенная политика<\/strong> — пошлины и регулирование внешней торговли.<\/li>\n<li><strong>Социальная политика<\/strong> — пенсии, пособия, социальные программы.<\/li>\n<li><strong>Инвестиционная политика<\/strong> — привлечение и направление инвестиций.<\/li>\n<\/ul>\n<p><strong>Типы финансовой политики:<\/strong><\/p>\n<ul>\n<li><strong>Классическая<\/strong> — минимальное вмешательство государства, сбалансированный бюджет.<\/li>\n<li><strong>Регулирующая (кейнсианская)<\/strong> — активное вмешательство через бюджет и налоги для сглаживания кризисов.<\/li>\n<li><strong>Планово-директивная<\/strong> — государство централизованно управляет финансами (характерно для плановой экономики).<\/li>\n<\/ul>\n<p><em>Пример:<\/em> снижение налогов для малого бизнеса — инструмент стимулирующей финансовой политики.<\/p>", "k": ["Финансовая политика", "Значение", "Бюджетная политика", "Налоговая политика", "Денежно-кредитная политика", "Таможенная политика", "Социальная политика", "Инвестиционная политика", "Классическая", "Регулирующая (кейнсианская)", "Планово-директивная"], "s": "Финансовая политика — совокупность мер государства по мобилизации финансовых ресурсов, их распределению и использованию для выполнения его функций."}, {"n": 18, "q": "Экономическое содержание финансовых отношений и роль финансового механизма", "a": "<p>Финансовые отношения возникают при распределении доходов, уплате налогов, финансировании расходов, формировании капитала и страховых фондов.<\/p>\n<p><strong>Экономическое содержание:<\/strong><\/p>\n<ul>\n<li><strong>Денежная природа<\/strong> — финансы всегда имеют денежную форму.<\/li>\n<li><strong>Распределительный характер<\/strong> — распределение и перераспределение созданного продукта.<\/li>\n<li><strong>Общественная потребность<\/strong> — финансы возникают вместе с государством и товарно-денежными отношениями.<\/li>\n<\/ul>\n<p><strong>Участники:<\/strong> государство, организации, население.<\/p>\n<p><strong>Финансовый механизм<\/strong> — совокупность методов, инструментов и правил реализации финансовой политики: планирование, налогообложение, бюджетное финансирование, нормативы, льготы, контроль.<\/p>\n<p><strong>Роль финансового механизма:<\/strong><\/p>\n<ul>\n<li><strong>Практическая реализация финансовой политики<\/strong> — связующее звено между целями и реальными действиями.<\/li>\n<li><strong>Стимулирование или сдерживание<\/strong> — налоги, кредиты и субсидии привлекают инвестиции; ошибки тормозят экономику.<\/li>\n<li><strong>Сбалансированность ресурсов<\/strong> — своевременное поступление средств в бюджеты и предприятия.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> государство устанавливает налог, получает доход бюджета и финансирует строительство школы.<\/p>", "k": ["Денежная природа", "Распределительный характер", "Общественная потребность", "Участники", "Финансовый механизм", "Практическая реализация финансовой политики", "Стимулирование или сдерживание", "Сбалансированность ресурсов"], "s": "Финансовые отношения возникают при распределении доходов, уплате налогов, финансировании расходов, формировании капитала и страховых фондов."}, {"n": 19, "q": "Понятие и задачи финансового контроля", "a": "<p><strong>Финансовый контроль<\/strong> — деятельность по проверке формирования, распределения и использования финансовых ресурсов для соблюдения законодательства, выявления нарушений и повышения эффективности управления деньгами.<\/p>\n<p>Осуществляется на уровне государства, предприятий, организаций и учреждений. В Казахстане государственный аудит и финансовый контроль регулируются специальным законом.<\/p>\n<p><strong>Задачи:<\/strong><\/p>\n<ul>\n<li><strong>Проверка законности<\/strong> — соблюдаются ли законы и правила.<\/li>\n<li><strong>Проверка достоверности<\/strong> — правильно ли отражены доходы, расходы и обязательства.<\/li>\n<li><strong>Выявление нарушений<\/strong> — необоснованные расходы, ошибки, нецелевое использование.<\/li>\n<li><strong>Предупреждение нарушений<\/strong> — выявление рисков до потерь.<\/li>\n<li><strong>Оценка эффективности<\/strong> — соответствует ли результат затратам.<\/li>\n<li><strong>Принятие мер<\/strong> — устранение нарушений и выполнение предписаний.<\/li>\n<\/ul>", "k": ["Финансовый контроль", "Проверка законности", "Проверка достоверности", "Выявление нарушений", "Предупреждение нарушений", "Оценка эффективности", "Принятие мер"], "s": "Финансовый контроль — деятельность по проверке формирования, распределения и использования финансовых ресурсов для соблюдения законодательства, выявления нарушений и повышения эффективности управления деньгами."}, {"n": 20, "q": "Понятие, значение и структура бюджета", "a": "<p><strong>Государственный бюджет<\/strong> — централизованный фонд денежных средств, предназначенный для выполнения функций и задач государства. Это план доходов и расходов государства на определённый период (обычно на год).<\/p>\n<p><strong>Значение бюджета:<\/strong><\/p>\n<ul>\n<li>обеспечивает государство средствами для выполнения своих функций;<\/li>\n<li>перераспределяет национальный доход между отраслями, регионами и группами населения;<\/li>\n<li>является инструментом регулирования экономики и социальной политики;<\/li>\n<li>позволяет контролировать использование государственных средств.<\/li>\n<\/ul>\n<p><strong>Структура бюджета:<\/strong><\/p>\n<ul>\n<li><strong>Доходы<\/strong> — налоговые поступления, неналоговые поступления, поступления от продажи основного капитала, трансферты.<\/li>\n<li><strong>Расходы<\/strong> — затраты на образование, здравоохранение, социальную защиту, оборону, инфраструктуру, госуправление.<\/li>\n<li><strong>Сальдо<\/strong> — разница между доходами и расходами: профицит (доходы больше) или дефицит (расходы больше).<\/li>\n<li><strong>Финансирование дефицита<\/strong> — займы, использование остатков средств.<\/li>\n<\/ul>\n<p><strong>Бюджетная система РК<\/strong> (по Бюджетному кодексу):<\/p>\n<ul>\n<li><strong>Республиканский бюджет<\/strong> — общегосударственные задачи;<\/li>\n<li><strong>Местные бюджеты<\/strong> — областные, городов республиканского значения и столицы, районные (городские), бюджеты городов районного значения, сёл и сельских округов.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> за счёт республиканского бюджета финансируется оборона, а за счёт местного — содержание школ и дорог в регионе.<\/p>", "k": ["Государственный бюджет", "Доходы", "Расходы", "Сальдо", "Финансирование дефицита", "Бюджетная система РК", "Республиканский бюджет", "Местные бюджеты"], "s": "Государственный бюджет — централизованный фонд денежных средств, предназначенный для выполнения функций и задач государства. Это план доходов и расходов государства на определённый период (обычно на год)."}, {"n": 21, "q": "Функции финансов и финансовый механизм", "a": "<p><strong>Основные функции финансов:<\/strong><\/p>\n<ul>\n<li><strong>Распределительная<\/strong> — распределение и перераспределение ВВП и национального дохода между государством, предприятиями и домохозяйствами.<\/li>\n<li><strong>Контрольная<\/strong> — отслеживание пропорций распределения, полноты поступлений в фонды и эффективности расходования.<\/li>\n<li><strong>Накопительная (аккумулирующая)<\/strong> — образование средств и резервов для непрерывности и расширения производства.<\/li>\n<li><strong>Регулирующая (стабилизирующая)<\/strong> — вмешательство государства через налоги, расходы, трансферты и инвестиции.<\/li>\n<li><strong>Воспроизводственная<\/strong> — бесперебойный кругооборот капитала и возобновление ресурсов.<\/li>\n<\/ul>\n<p><strong>Финансовый механизм<\/strong> — совокупность методов, инструментов и правил реализации финансовой политики.<\/p>\n<p><strong>Взаимосвязь:<\/strong> финансовый механизм обеспечивает реализацию функций финансов.<\/p>\n<p><em>Пример:<\/em> предприятие распределяет выручку на затраты, налоги и инвестиции, а учёт позволяет проверить правильность распределения.<\/p>", "k": ["Распределительная", "Контрольная", "Накопительная (аккумулирующая)", "Регулирующая (стабилизирующая)", "Воспроизводственная", "Финансовый механизм", "Взаимосвязь"], "s": "Финансовый механизм — совокупность методов, инструментов и правил реализации финансовой политики."}, {"n": 22, "q": "Государственная финансовая система и её структура", "a": "<p><strong>Государственная финансовая система<\/strong> — совокупность звеньев финансовых отношений и институтов, через которые государство аккумулирует, распределяет и использует централизованные фонды.<\/p>\n<p><strong>Структура:<\/strong><\/p>\n<ul>\n<li><strong>Государственный бюджет<\/strong> (республиканский и местные) — главный централизованный фонд.<\/li>\n<li><strong>Внебюджетные (специальные) фонды<\/strong> — пенсионный, социального страхования, обязательного медицинского страхования.<\/li>\n<li><strong>Государственный кредит<\/strong> — государство как заёмщик, кредитор или гарант (гособлигации, внутренний и внешний долг).<\/li>\n<li><strong>Финансы государственных предприятий<\/strong> — доходы субъектов в госсобственности.<\/li>\n<\/ul>\n<p>В Казахстане важны республиканский и местные бюджеты, <strong>Национальный фонд<\/strong> и механизмы социального финансирования.<\/p>\n<p><em>Пример:<\/em> бюджет оплачивает содержание школы, а Национальный фонд накапливает часть нефтяных доходов.<\/p>", "k": ["Государственная финансовая система", "Государственный бюджет", "Внебюджетные (специальные) фонды", "Государственный кредит", "Финансы государственных предприятий", "Национальный фонд"], "s": "Государственная финансовая система — совокупность звеньев финансовых отношений и институтов, через которые государство аккумулирует, распределяет и использует централизованные фонды."}, {"n": 23, "q": "Экономическая сущность безналичных расчётов", "a": "<p><strong>Сущность<\/strong> — движение денежных средств и погашение обязательств через записи по счетам без передачи наличности.<\/p>\n<p><strong>Плюсы:<\/strong> ускоряют оборот, снижают расходы на наличные, облегчают учёт.<\/p>\n<p><strong>Риски:<\/strong> ошибочные реквизиты, мошенничество, технические сбои, нарушение сроков.<\/p>\n<p><em>Пример:<\/em> организация оплачивает поставку переводом со своего счёта на счёт поставщика.<\/p>", "k": ["Сущность", "Плюсы", "Риски"], "s": "Сущность — движение денежных средств и погашение обязательств через записи по счетам без передачи наличности."}, {"n": 24, "q": "Характеристика структуры и состава доходов и расходов государственного бюджета", "a": "<p><strong>Доходы государственного бюджета<\/strong> — денежные поступления, которые государство получает для выполнения своих функций.<\/p>\n<p><strong>Состав доходов (по Бюджетному кодексу РК):<\/strong><\/p>\n<ul>\n<li><strong>Налоговые поступления<\/strong> — основная часть доходов: КПН, ИПН, НДС, акцизы, социальный налог, налог на добычу полезных ископаемых, налоги на имущество и др.<\/li>\n<li><strong>Неналоговые поступления<\/strong> — доходы от госсобственности, штрафы, дивиденды по госпакетам акций, вознаграждения по бюджетным кредитам.<\/li>\n<li><strong>Поступления от продажи основного капитала<\/strong> — продажа государственного имущества, земли.<\/li>\n<li><strong>Поступления трансфертов<\/strong> — средства из других бюджетов и Национального фонда.<\/li>\n<\/ul>\n<p><strong>Расходы государственного бюджета<\/strong> — затраты государства на выполнение его функций.<\/p>\n<p><strong>Основные направления расходов:<\/strong><\/p>\n<ul>\n<li>социальная помощь и социальное обеспечение (пенсии, пособия);<\/li>\n<li>образование;<\/li>\n<li>здравоохранение;<\/li>\n<li>оборона и общественный порядок;<\/li>\n<li>транспорт, связь, жилищно-коммунальное хозяйство;<\/li>\n<li>сельское хозяйство;<\/li>\n<li>государственное управление;<\/li>\n<li>обслуживание государственного долга.<\/li>\n<\/ul>\n<p><strong>Классификация расходов по экономическому содержанию:<\/strong><\/p>\n<ul>\n<li><strong>Текущие<\/strong> — зарплата бюджетникам, содержание учреждений, социальные выплаты.<\/li>\n<li><strong>Капитальные (бюджет развития)<\/strong> — строительство, инвестиционные проекты.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> НДС и КПН формируют крупную часть доходов республиканского бюджета, а самая большая статья расходов — социальная сфера.<\/p>", "k": ["Доходы государственного бюджета", "Налоговые поступления", "Неналоговые поступления", "Поступления от продажи основного капитала", "Поступления трансфертов", "Расходы государственного бюджета", "Текущие", "Капитальные (бюджет развития)"], "s": "Доходы государственного бюджета — денежные поступления, которые государство получает для выполнения своих функций."}, {"n": 25, "q": "Бюджетная политика Республики Казахстан и её инструменты", "a": "<p><strong>Бюджетная политика РК<\/strong> — деятельность государства по формированию и использованию бюджетных средств для обеспечения устойчивого экономического роста и социальной стабильности.<\/p>\n<p>Основы бюджетной политики закреплены в <strong>Бюджетном кодексе РК<\/strong>. Ежегодно принимается закон о республиканском бюджете на трёхлетний период.<\/p>\n<p><strong>Основные направления:<\/strong><\/p>\n<ul>\n<li>сокращение ненефтяного дефицита и зависимости бюджета от нефтяных доходов;<\/li>\n<li>ограничение трансфертов из Национального фонда;<\/li>\n<li>повышение эффективности бюджетных расходов;<\/li>\n<li>приоритет социальных расходов и инфраструктуры;<\/li>\n<li>контроль за уровнем государственного долга.<\/li>\n<\/ul>\n<p><strong>Инструменты бюджетной политики:<\/strong><\/p>\n<ul>\n<li><strong>Налоги и неналоговые платежи<\/strong> — регулируют доходы бюджета.<\/li>\n<li><strong>Бюджетные расходы<\/strong> — финансирование госпрограмм и социальной сферы.<\/li>\n<li><strong>Трансферты<\/strong> — гарантированный и целевые трансферты из Национального фонда, субвенции и изъятия между бюджетами.<\/li>\n<li><strong>Бюджетные кредиты<\/strong> — выдаются местным бюджетам и организациям на возвратной основе.<\/li>\n<li><strong>Государственные займы<\/strong> — выпуск государственных ценных бумаг для финансирования дефицита.<\/li>\n<li><strong>Бюджетные правила<\/strong> — ограничения на размер дефицита, госдолга и изъятий из Национального фонда.<\/li>\n<li><strong>Субсидии<\/strong> — поддержка сельского хозяйства, предпринимательства.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> государство направляет гарантированный трансферт из Национального фонда в республиканский бюджет для финансирования социальных расходов.<\/p>", "k": ["Бюджетная политика РК", "Бюджетном кодексе РК", "Налоги и неналоговые платежи", "Бюджетные расходы", "Трансферты", "Бюджетные кредиты", "Государственные займы", "Бюджетные правила", "Субсидии"], "s": "Бюджетная политика РК — деятельность государства по формированию и использованию бюджетных средств для обеспечения устойчивого экономического роста и социальной стабильности."}, {"n": 26, "q": "Денежно-кредитная политика Национального Банка Республики Казахстан и регулирование денежного обращения", "a": "<p><strong>Денежно-кредитная политика (ДКП)<\/strong> — совокупность мер Национального Банка по регулированию денежной массы, процентных ставок и кредита для обеспечения стабильности цен.<\/p>\n<p><strong>Главная цель ДКП НБРК<\/strong> — обеспечение стабильности цен (удержание инфляции в целевом коридоре).<\/p>\n<p>С 2015 года НБРК проводит <strong>режим инфляционного таргетирования<\/strong> и <strong>плавающий обменный курс<\/strong> тенге.<\/p>\n<p><strong>Инструменты ДКП:<\/strong><\/p>\n<ul>\n<li><strong>Базовая ставка<\/strong> — главный инструмент; от неё зависят ставки по кредитам и депозитам.<\/li>\n<li><strong>Операции на открытом рынке<\/strong> — покупка и продажа ценных бумаг (ноты НБРК), операции репо.<\/li>\n<li><strong>Постоянные операции<\/strong> — операции по предоставлению и изъятию ликвидности по ставкам процентного коридора.<\/li>\n<li><strong>Минимальные резервные требования<\/strong> — часть средств банков, которую они обязаны хранить в НБРК.<\/li>\n<li><strong>Валютные интервенции<\/strong> — для сглаживания резких колебаний курса.<\/li>\n<li><strong>Коммуникационная политика<\/strong> — информирование рынка о решениях и прогнозах.<\/li>\n<\/ul>\n<p><strong>Регулирование денежного обращения:<\/strong><\/p>\n<ul>\n<li>при высокой инфляции НБРК <strong>повышает базовую ставку<\/strong> — кредиты дорожают, спрос и денежная масса снижаются;<\/li>\n<li>при низкой инфляции и замедлении экономики — <strong>снижает ставку<\/strong>, кредиты становятся доступнее.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> если инфляция выше цели, НБРК повышает базовую ставку, и депозиты становятся выгоднее, а займы — дороже.<\/p>", "k": ["Денежно-кредитная политика (ДКП)", "Главная цель ДКП НБРК", "режим инфляционного таргетирования", "плавающий обменный курс", "Базовая ставка", "Операции на открытом рынке", "Постоянные операции", "Минимальные резервные требования", "Валютные интервенции", "Коммуникационная политика", "повышает базовую ставку", "снижает ставку"], "s": "Денежно-кредитная политика (ДКП) — совокупность мер Национального Банка по регулированию денежной массы, процентных ставок и кредита для обеспечения стабильности цен."}, {"n": 27, "q": "Экономическая сущность налогов и их функции", "a": "<p><strong>Налог<\/strong> — обязательный, безвозмездный и безвозвратный денежный платёж в бюджет, установленный законом и взимаемый государством с физических и юридических лиц.<\/p>\n<p><strong>Экономическая сущность<\/strong> — налоги изымают часть доходов субъектов в пользу государства для финансирования его функций. Это основной источник доходов бюджета.<\/p>\n<p><strong>Признаки налога:<\/strong><\/p>\n<ul>\n<li>обязательность;<\/li>\n<li>безвозмездность (нет прямой встречной услуги);<\/li>\n<li>установление законом;<\/li>\n<li>денежная форма.<\/li>\n<\/ul>\n<p><strong>Элементы налога:<\/strong> объект налогообложения, налоговая база, ставка, налоговый период, налогоплательщик, порядок исчисления и уплаты, льготы.<\/p>\n<p><strong>Функции налогов:<\/strong><\/p>\n<ul>\n<li><strong>Фискальная<\/strong> — формирование доходов бюджета.<\/li>\n<li><strong>Регулирующая<\/strong> — влияние на экономику через ставки и льготы (стимулирование или сдерживание отраслей).<\/li>\n<li><strong>Социальная (распределительная)<\/strong> — перераспределение доходов между группами населения.<\/li>\n<li><strong>Контрольная<\/strong> — контроль за доходами и деятельностью налогоплательщиков.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> повышенные акцизы на табак выполняют одновременно фискальную и регулирующую функции — пополняют бюджет и снижают потребление.<\/p>", "k": ["Налог", "Экономическая сущность", "Элементы налога", "Фискальная", "Регулирующая", "Социальная (распределительная)", "Контрольная"], "s": "Налог — обязательный, безвозмездный и безвозвратный денежный платёж в бюджет, установленный законом и взимаемый государством с физических и юридических лиц."}, {"n": 28, "q": "Налоговая система Республики Казахстан и виды действующих налогов", "a": "<p><strong>Налоговая система<\/strong> — совокупность налогов и других обязательных платежей, принципов, форм и методов их установления, взимания и контроля.<\/p>\n<p>С <strong>1 января 2026 года<\/strong> действует <strong>новый Налоговый кодекс РК<\/strong> (от 18 июля 2025 года). Налоговое администрирование осуществляет Комитет государственных доходов Министерства финансов.<\/p>\n<p><strong>Принципы налогообложения:<\/strong> обязательность, определённость, справедливость, единство налоговой системы, гласность.<\/p>\n<p><strong>Виды налогов в РК:<\/strong><\/p>\n<ul>\n<li><strong>Корпоративный подоходный налог (КПН)<\/strong> — с доходов юрлиц; базовая ставка 20% (для банков и игорного бизнеса — 25%, для сельхозпроизводителей — 3%).<\/li>\n<li><strong>Индивидуальный подоходный налог (ИПН)<\/strong> — с доходов физлиц; с 2026 года прогрессивная шкала: 10% и 15% на доходы свыше установленного порога.<\/li>\n<li><strong>Налог на добавленную стоимость (НДС)<\/strong> — базовая ставка 16% (с 2026 года, ранее 12%); для ряда медицинских товаров и услуг — пониженная ставка.<\/li>\n<li><strong>Акцизы<\/strong> — на алкоголь, табак, бензин, автомобили и др.<\/li>\n<li><strong>Социальный налог<\/strong> — уплачивается работодателями; с 2026 года — 6%.<\/li>\n<li><strong>Налоги на недропользование<\/strong> — налог на добычу полезных ископаемых, рентный налог на экспорт и др.<\/li>\n<li><strong>Налог на транспортные средства.<\/strong><\/li>\n<li><strong>Земельный налог.<\/strong><\/li>\n<li><strong>Налог на имущество.<\/strong><\/li>\n<li><strong>Плата за игорный бизнес<\/strong> и иные.<\/li>\n<\/ul>\n<p><strong>Специальные налоговые режимы<\/strong> — для малого бизнеса и самозанятых (упрощённая декларация, режим для крестьянских хозяйств и др.).<\/p>\n<p><em>Пример:<\/em> магазин платит НДС с продаж, КПН с прибыли, ИПН и социальный налог за работников.<\/p>", "k": ["Налоговая система", "1 января 2026 года", "новый Налоговый кодекс РК", "Принципы налогообложения", "Корпоративный подоходный налог (КПН)", "Индивидуальный подоходный налог (ИПН)", "Налог на добавленную стоимость (НДС)", "Акцизы", "Социальный налог", "Налоги на недропользование", "Налог на транспортные средства", "Земельный налог", "Налог на имущество", "Плата за игорный бизнес"], "s": "Налоговая система — совокупность налогов и других обязательных платежей, принципов, форм и методов их установления, взимания и контроля."}, {"n": 29, "q": "Обязательные платежи в бюджет, кроме налогов", "a": "<p>Кроме налогов, Налоговый кодекс РК устанавливает <strong>другие обязательные платежи в бюджет<\/strong> — сборы, пошлины и плату за использование государственных ресурсов.<\/p>\n<p><strong>Основные виды:<\/strong><\/p>\n<ul>\n<li><strong>Государственная пошлина<\/strong> — плата за юридически значимые действия госорганов (регистрация, выдача документов, рассмотрение исков в суде).<\/li>\n<li><strong>Сборы<\/strong> — например, сбор за государственную регистрацию юрлиц, прав на недвижимость, транспортных средств, за выдачу разрешений.<\/li>\n<li><strong>Плата за пользование земельными участками.<\/strong><\/li>\n<li><strong>Плата за пользование водными ресурсами поверхностных источников.<\/strong><\/li>\n<li><strong>Плата за негативное воздействие на окружающую среду<\/strong> (эмиссии).<\/li>\n<li><strong>Плата за пользование животным миром и лесными ресурсами.<\/strong><\/li>\n<li><strong>Плата за использование радиочастотного спектра.<\/strong><\/li>\n<li><strong>Плата за размещение наружной (визуальной) рекламы.<\/strong><\/li>\n<\/ul>\n<p>Отдельно существуют <strong>таможенные платежи<\/strong> (таможенные пошлины и сборы) и <strong>социальные платежи<\/strong> (обязательные пенсионные взносы, социальные отчисления, взносы на ОСМС), которые не являются налогами.<\/p>\n<p><strong>Отличие от налога<\/strong> — обязательный платёж обычно связан с получением конкретного права или услуги от государства (возмездный характер).<\/p>\n<p><em>Пример:<\/em> при регистрации автомобиля владелец уплачивает сбор, а при подаче иска в суд — государственную пошлину.<\/p>", "k": ["другие обязательные платежи в бюджет", "Государственная пошлина", "Сборы", "Плата за пользование земельными участками", "таможенные платежи", "социальные платежи", "Отличие от налога"], "s": "Кроме налогов, Налоговый кодекс РК устанавливает другие обязательные платежи в бюджет — сборы, пошлины и плату за использование государственных ресурсов."}, {"n": 30, "q": "Понятие страхования, его экономическое и социальное значение", "a": "<p><strong>Страхование<\/strong> — отношения по защите имущественных интересов физических и юридических лиц при наступлении страховых случаев за счёт страховых фондов, формируемых из страховых премий (взносов).<\/p>\n<p><strong>Основные понятия:<\/strong><\/p>\n<ul>\n<li><strong>Страховщик<\/strong> — страховая компания;<\/li>\n<li><strong>Страхователь<\/strong> — тот, кто заключает договор и платит премию;<\/li>\n<li><strong>Застрахованный / выгодоприобретатель<\/strong> — лицо, в пользу которого заключён договор;<\/li>\n<li><strong>Страховая премия<\/strong> — плата за страхование;<\/li>\n<li><strong>Страховой случай<\/strong> — событие, при котором выплачивается возмещение;<\/li>\n<li><strong>Страховая сумма<\/strong> — максимальная сумма выплаты.<\/li>\n<\/ul>\n<p><strong>Экономическое значение:<\/strong><\/p>\n<ul>\n<li>возмещение ущерба и восстановление производства;<\/li>\n<li>непрерывность деятельности предприятий;<\/li>\n<li>страховые компании — крупные инвесторы, их средства вкладываются в экономику;<\/li>\n<li>снижение нагрузки на государственный бюджет.<\/li>\n<\/ul>\n<p><strong>Социальное значение:<\/strong><\/p>\n<ul>\n<li>защита жизни, здоровья и имущества граждан;<\/li>\n<li>социальная стабильность и уверенность населения;<\/li>\n<li>финансовая поддержка при болезни, несчастном случае, потере кормильца.<\/li>\n<\/ul>\n<p><strong>Формы страхования в РК:<\/strong> обязательное (например, ОГПО владельцев транспортных средств) и добровольное.<\/p>\n<p><em>Пример:<\/em> после ДТП страховая компания возмещает ущерб пострадавшему по полису ОГПО виновника.<\/p>", "k": ["Страхование", "Страховщик", "Страхователь", "Застрахованный / выгодоприобретатель", "Страховая премия", "Страховой случай", "Страховая сумма", "Формы страхования в РК"], "s": "Страхование — отношения по защите имущественных интересов физических и юридических лиц при наступлении страховых случаев за счёт страховых фондов, формируемых из страховых премий (взносов)."}, {"n": 31, "q": "Страхование как экономический механизм защиты от рисков", "a": "<p><strong>Страхование как механизм защиты<\/strong> основано на принципе <strong>раскладки ущерба<\/strong>: многие страхователи платят небольшие взносы, а из общего фонда возмещаются убытки немногих пострадавших.<\/p>\n<p><strong>Риск<\/strong> — вероятное событие, способное нанести ущерб. Страховать можно только риск, который является случайным, вероятным и имеет измеримый ущерб.<\/p>\n<p><strong>Как работает механизм:<\/strong><\/p>\n<ol type=\"1\">\n<li>Страховщик оценивает риск и рассчитывает тариф.<\/li>\n<li>Страхователи платят страховые премии.<\/li>\n<li>Из премий формируется страховой фонд (страховые резервы).<\/li>\n<li>При наступлении страхового случая выплачивается страховое возмещение.<\/li>\n<\/ol>\n<p><strong>Функции страхования:<\/strong><\/p>\n<ul>\n<li><strong>Рисковая<\/strong> — передача риска от страхователя к страховщику.<\/li>\n<li><strong>Предупредительная<\/strong> — финансирование мер по снижению рисков.<\/li>\n<li><strong>Сберегательная<\/strong> — накопление средств (в страховании жизни).<\/li>\n<li><strong>Контрольная<\/strong> — контроль за целевым формированием и использованием фонда.<\/li>\n<\/ul>\n<p><strong>Отрасли страхования:<\/strong><\/p>\n<ul>\n<li><strong>Страхование жизни<\/strong> — накопительное, пенсионное (аннуитетное).<\/li>\n<li><strong>Общее страхование<\/strong> — имущество, ответственность, медицинское страхование, страхование от несчастных случаев.<\/li>\n<\/ul>\n<p><strong>Методы управления риском:<\/strong> избежание, снижение, принятие на себя, передача (страхование).<\/p>\n<p><em>Пример:<\/em> 1 000 владельцев квартир платят по 10 000 тенге в год, а из общего фонда возмещается ущерб тем, у кого случился пожар или затопление.<\/p>", "k": ["Страхование как механизм защиты", "раскладки ущерба", "Риск", "Рисковая", "Предупредительная", "Сберегательная", "Контрольная", "Страхование жизни", "Общее страхование", "Методы управления риском"], "s": "Страхование как механизм защиты основано на принципе раскладки ущерба: многие страхователи платят небольшие взносы, а из общего фонда возмещаются убытки немногих пострадавших."}, {"n": 32, "q": "Общая характеристика банковской деятельности", "a": "<p><strong>Банк<\/strong> — юридическое лицо, являющееся коммерческой организацией, которое на основании лицензии вправе проводить банковские операции.<\/p>\n<p><strong>Банковская деятельность<\/strong> — проведение банковских операций и иной разрешённой законом деятельности.<\/p>\n<p><strong>Основные банковские операции:<\/strong><\/p>\n<ul>\n<li><strong>Депозитные<\/strong> — приём вкладов от физических и юридических лиц;<\/li>\n<li><strong>Кредитные<\/strong> — выдача займов;<\/li>\n<li><strong>Расчётные<\/strong> — открытие и ведение счетов, переводы денег;<\/li>\n<li><strong>Кассовые<\/strong> — приём и выдача наличных;<\/li>\n<li><strong>Обменные операции с иностранной валютой<\/strong>;<\/li>\n<li><strong>Операции с ценными бумагами<\/strong>;<\/li>\n<li><strong>Выдача гарантий и поручительств<\/strong>;<\/li>\n<li><strong>Сейфовые операции<\/strong>.<\/li>\n<\/ul>\n<p><strong>Принципы банковской деятельности:<\/strong><\/p>\n<ul>\n<li>работа в пределах реально имеющихся ресурсов;<\/li>\n<li>экономическая самостоятельность и ответственность;<\/li>\n<li>коммерческий характер (получение прибыли);<\/li>\n<li>соблюдение банковской тайны;<\/li>\n<li>соблюдение пруденциальных нормативов.<\/li>\n<\/ul>\n<p><strong>Роль банков в экономике<\/strong> — аккумуляция сбережений, кредитование, обслуживание платежей, участие в создании денег.<\/p>\n<p>Деятельность банков в РК регулируется законом «О банках и банковской деятельности в Республике Казахстан», надзор осуществляет АРРФР.<\/p>\n<p><em>Пример:<\/em> банк принимает депозит под 13% годовых и выдаёт кредит под более высокую ставку; разница — его доход.<\/p>", "k": ["Банк", "Банковская деятельность", "Депозитные", "Кредитные", "Расчётные", "Кассовые", "Обменные операции с иностранной валютой", "Операции с ценными бумагами", "Выдача гарантий и поручительств", "Сейфовые операции", "Роль банков в экономике"], "s": "Банк — юридическое лицо, являющееся коммерческой организацией, которое на основании лицензии вправе проводить банковские операции."}, {"n": 33, "q": "Деятельность Национального Банка и банков второго уровня, их взаимосвязь", "a": "<p><strong>Национальный Банк РК<\/strong> — центральный банк, верхний уровень банковской системы. Отвечает за стабильность цен, денежно-кредитную политику, эмиссию денег и платёжные системы. Не обслуживает население и бизнес напрямую.<\/p>\n<p><strong>Банки второго уровня (БВУ)<\/strong> — коммерческие банки, которые принимают депозиты, выдают кредиты, проводят платежи и обслуживают клиентов.<\/p>\n<p><strong>Взаимосвязь:<\/strong><\/p>\n<ul>\n<li><strong>Базовая ставка<\/strong> НБРК влияет на ставки БВУ по кредитам и депозитам;<\/li>\n<li><strong>Минимальные резервные требования<\/strong> — БВУ хранят часть средств в НБРК;<\/li>\n<li><strong>Рефинансирование и кредитор последней инстанции<\/strong> — НБРК предоставляет банкам ликвидность;<\/li>\n<li><strong>Операции с ценными бумагами<\/strong> — БВУ покупают ноты НБРК;<\/li>\n<li><strong>Платёжная система<\/strong> — межбанковские расчёты проходят через системы НБРК;<\/li>\n<li><strong>Наличные деньги<\/strong> — НБРК обеспечивает банки наличностью;<\/li>\n<li><strong>Пруденциальное регулирование и надзор<\/strong> — осуществляет АРРФР.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> НБРК повышает базовую ставку — банки второго уровня повышают ставки по кредитам и депозитам.<\/p>", "k": ["Национальный Банк РК", "Банки второго уровня (БВУ)", "Базовая ставка", "Минимальные резервные требования", "Операции с ценными бумагами", "Платёжная система", "Наличные деньги", "Пруденциальное регулирование и надзор"], "s": "Национальный Банк РК — центральный банк, верхний уровень банковской системы. Отвечает за стабильность цен, денежно-кредитную политику, эмиссию денег и платёжные системы. Не обслуживает население и бизнес напрямую."}, {"n": 34, "q": "Задачи центральных банков и организация их деятельности", "a": "<p><strong>Главная задача<\/strong> — обеспечение стабильности цен и покупательной способности национальной валюты.<\/p>\n<p><strong>Ключевые задачи:<\/strong><\/p>\n<ul>\n<li><strong>Борьба с инфляцией<\/strong> — удержание инфляции в целевом коридоре.<\/li>\n<li><strong>Денежно-кредитная политика<\/strong> — управление базовой ставкой, денежной массой и ликвидностью.<\/li>\n<li><strong>Стабильность финансовой системы<\/strong> — предотвращение системных рисков.<\/li>\n<li><strong>Платёжные системы<\/strong> — бесперебойные межбанковские платежи, развитие цифровых валют.<\/li>\n<li><strong>Валютное регулирование<\/strong> — контроль валютных операций, управление золотовалютными резервами.<\/li>\n<li><strong>Эмиссия наличных<\/strong> — монопольный выпуск банкнот и монет.<\/li>\n<li><strong>Статистика<\/strong> — публикация денежно-кредитной и финансовой статистики.<\/li>\n<\/ul>\n<p><strong>Организация деятельности:<\/strong><\/p>\n<p><strong>1. Правовой статус:<\/strong> верхний уровень банковской системы; некоммерческий характер; подотчётность высшим органам власти (в РК — Президенту).<\/p>\n<p><strong>2. Организационная структура:<\/strong> Правление и Совет директоров, центральный аппарат (департаменты), территориальные филиалы, подведомственные организации.<\/p>\n<p><strong>3. Основные функции:<\/strong> ДКП, эмиссия денег, «банк банков», банк и агент Правительства, управление золотовалютными резервами, платёжные системы, валютное регулирование.<\/p>", "k": ["Главная задача", "Борьба с инфляцией", "Денежно-кредитная политика", "Стабильность финансовой системы", "Платёжные системы", "Валютное регулирование", "Эмиссия наличных", "Статистика"], "s": "Главная задача — обеспечение стабильности цен и покупательной способности национальной валюты."}, {"n": 35, "q": "Вторичный рынок ценных бумаг", "a": "<p><strong>Вторичный рынок ценных бумаг<\/strong> — рынок, на котором обращаются ранее выпущенные ценные бумаги, то есть их перепродают одни инвесторы другим.<\/p>\n<p><strong>Отличие от первичного рынка:<\/strong> на первичном рынке бумаги впервые размещаются эмитентом, и деньги получает эмитент; на вторичном — деньги переходят от одного инвестора к другому.<\/p>\n<p><strong>Виды вторичного рынка:<\/strong><\/p>\n<ul>\n<li><strong>Биржевой (организованный)<\/strong> — торги проходят на фондовой бирже по установленным правилам (в РК — KASE, AIX).<\/li>\n<li><strong>Внебиржевой (OTC)<\/strong> — сделки заключаются напрямую между участниками вне биржи.<\/li>\n<\/ul>\n<p><strong>Функции вторичного рынка:<\/strong><\/p>\n<ul>\n<li>обеспечение <strong>ликвидности<\/strong> — инвестор может продать бумагу в любой момент;<\/li>\n<li><strong>определение рыночной цены<\/strong> ценных бумаг;<\/li>\n<li>перераспределение капитала между инвесторами;<\/li>\n<li>оценка состояния компаний и экономики.<\/li>\n<\/ul>\n<p><strong>Участники:<\/strong> инвесторы, брокеры, дилеры, фондовая биржа, центральный депозитарий, регистраторы.<\/p>\n<p><em>Пример:<\/em> инвестор купил акции «Казатомпрома» при IPO (первичный рынок), а затем продал их другому инвестору на бирже (вторичный рынок).<\/p>", "k": ["Вторичный рынок ценных бумаг", "Отличие от первичного рынка", "Биржевой (организованный)", "Внебиржевой (OTC)", "ликвидности", "определение рыночной цены", "Участники"], "s": "Вторичный рынок ценных бумаг — рынок, на котором обращаются ранее выпущенные ценные бумаги, то есть их перепродают одни инвесторы другим."}, {"n": 36, "q": "Правовые основы организации банков второго уровня в Республике Казахстан", "a": "<p>Деятельность банков второго уровня регулируется:<\/p>\n<ul>\n<li><strong>Конституцией РК<\/strong>;<\/li>\n<li><strong>Гражданским кодексом РК<\/strong>;<\/li>\n<li><strong>Законом РК «О банках и банковской деятельности в Республике Казахстан»<\/strong>;<\/li>\n<li><strong>Законом РК «О Национальном Банке Республики Казахстан»<\/strong>;<\/li>\n<li><strong>Законом «О государственном регулировании, контроле и надзоре финансового рынка и финансовых организаций»<\/strong>;<\/li>\n<li><strong>Законом «Об обязательном гарантировании депозитов»<\/strong>;<\/li>\n<li>нормативными актами АРРФР и НБРК.<\/li>\n<\/ul>\n<p><strong>Основные правовые требования к созданию банка:<\/strong><\/p>\n<ul>\n<li>банк создаётся в форме <strong>акционерного общества<\/strong>;<\/li>\n<li>необходимо получить <strong>согласие на открытие<\/strong> и <strong>лицензию<\/strong> АРРФР на проведение банковских операций;<\/li>\n<li>требования к <strong>минимальному размеру уставного капитала<\/strong>;<\/li>\n<li>требования к <strong>руководящим работникам<\/strong> (квалификация, деловая репутация);<\/li>\n<li>требования к <strong>крупным участникам<\/strong> банка;<\/li>\n<li>обязательное участие в <strong>системе гарантирования депозитов<\/strong> (Казахстанский фонд гарантирования депозитов).<\/li>\n<\/ul>\n<p><strong>Пруденциальные нормативы:<\/strong> достаточность капитала, ликвидность, максимальный риск на одного заёмщика, лимиты валютной позиции.<\/p>\n<p><em>Пример:<\/em> банк не может принимать депозиты населения без лицензии АРРФР и без участия в системе гарантирования депозитов.<\/p>", "k": ["Конституцией РК", "Гражданским кодексом РК", "акционерного общества", "согласие на открытие", "минимальному размеру уставного капитала", "руководящим работникам", "крупным участникам", "системе гарантирования депозитов", "Пруденциальные нормативы"], "s": "Пруденциальные нормативы: достаточность капитала, ликвидность, максимальный риск на одного заёмщика, лимиты валютной позиции."}, {"n": 37, "q": "Статус и функции Национального Банка Республики Казахстан", "a": "<p><strong>Национальный Банк РК<\/strong> — центральный банк Республики Казахстан, представляющий верхний (первый) уровень банковской системы. Создан в 1993 году; деятельность регулируется Законом РК «О Национальном Банке Республики Казахстан».<\/p>\n<p><strong>Статус:<\/strong><\/p>\n<ul>\n<li>является <strong>государственным учреждением<\/strong>;<\/li>\n<li><strong>подотчётен Президенту РК<\/strong>;<\/li>\n<li>в пределах своих полномочий <strong>независим<\/strong> от исполнительной власти;<\/li>\n<li><strong>не преследует цель получения прибыли<\/strong>;<\/li>\n<li>является собственником имущества, переданного ему государством.<\/li>\n<\/ul>\n<p><strong>Главная цель<\/strong> — обеспечение стабильности цен в Республике Казахстан.<\/p>\n<p><strong>Задачи и функции:<\/strong><\/p>\n<ul>\n<li>разработка и проведение <strong>денежно-кредитной политики<\/strong>;<\/li>\n<li><strong>эмиссия<\/strong> банкнот и монет;<\/li>\n<li>обеспечение функционирования <strong>платёжных систем<\/strong>;<\/li>\n<li><strong>валютное регулирование<\/strong> и валютный контроль;<\/li>\n<li>управление <strong>золотовалютными активами<\/strong>;<\/li>\n<li>доверительное <strong>управление Национальным фондом<\/strong>;<\/li>\n<li>содействие <strong>финансовой стабильности<\/strong>;<\/li>\n<li>ведение <strong>статистики<\/strong> денежно-кредитной сферы;<\/li>\n<li>функции <strong>банка и финансового агента Правительства<\/strong>.<\/li>\n<\/ul>\n<p><strong>Органы управления:<\/strong> Председатель, Правление, Совет директоров.<\/p>\n<p><em>Пример:<\/em> решения о размере базовой ставки принимает Комитет по денежно-кредитной политике Национального Банка.<\/p>", "k": ["Национальный Банк РК", "государственным учреждением", "подотчётен Президенту РК", "независим", "не преследует цель получения прибыли", "Главная цель", "денежно-кредитной политики", "платёжных систем", "валютное регулирование", "золотовалютными активами", "управление Национальным фондом", "финансовой стабильности", "статистики", "банка и финансового агента Правительства"], "s": "Национальный Банк РК — центральный банк Республики Казахстан, представляющий верхний (первый) уровень банковской системы. Создан в 1993 году; деятельность регулируется Законом РК «О Национальном Банке Республики Казахстан»."}, {"n": 38, "q": "Активные и пассивные операции коммерческих банков", "a": "<p><strong>Пассивные операции<\/strong> — операции, с помощью которых банк <strong>формирует свои ресурсы<\/strong>.<\/p>\n<p><strong>Виды пассивных операций:<\/strong><\/p>\n<ul>\n<li>приём <strong>депозитов<\/strong> (вкладов) физических и юридических лиц;<\/li>\n<li>выпуск собственных <strong>ценных бумаг<\/strong> (облигаций, акций);<\/li>\n<li>получение <strong>межбанковских кредитов<\/strong>;<\/li>\n<li>получение займов у Национального Банка;<\/li>\n<li>формирование <strong>собственного капитала<\/strong> (уставный капитал, резервы, прибыль).<\/li>\n<\/ul>\n<p><strong>Активные операции<\/strong> — операции по <strong>размещению ресурсов<\/strong> банка для получения дохода.<\/p>\n<p><strong>Виды активных операций:<\/strong><\/p>\n<ul>\n<li><strong>кредитование<\/strong> физических и юридических лиц;<\/li>\n<li><strong>инвестирование<\/strong> в ценные бумаги;<\/li>\n<li>размещение средств на межбанковском рынке;<\/li>\n<li>лизинговые и факторинговые операции;<\/li>\n<li>вложения в основные средства банка.<\/li>\n<\/ul>\n<p><strong>Комиссионные (посреднические) операции<\/strong> — расчётно-кассовое обслуживание, переводы, обмен валюты, гарантии; приносят комиссионный доход без размещения ресурсов.<\/p>\n<p><strong>Взаимосвязь:<\/strong> пассивные операции дают ресурсы для активных. Доход банка — разница между процентами по активным и пассивным операциям (процентная маржа).<\/p>\n<p><em>Пример:<\/em> банк принимает депозит под 13% (пассивная операция) и выдаёт кредит под 20% (активная операция).<\/p>", "k": ["Пассивные операции", "формирует свои ресурсы", "депозитов", "ценных бумаг", "межбанковских кредитов", "собственного капитала", "Активные операции", "размещению ресурсов", "кредитование", "инвестирование", "Комиссионные (посреднические) операции", "Взаимосвязь"], "s": "Пассивные операции — операции, с помощью которых банк формирует свои ресурсы."}, {"n": 39, "q": "Международный валютный фонд (МВФ)", "a": "<p><strong>Международный валютный фонд (МВФ)<\/strong> — международная финансовая организация, созданная в 1944 году на Бреттон-Вудской конференции. Штаб-квартира — в Вашингтоне. В МВФ входят почти все страны мира, Казахстан — член МВФ с 1992 года.<\/p>\n<p><strong>Цели МВФ:<\/strong><\/p>\n<ul>\n<li>содействие международному валютному сотрудничеству;<\/li>\n<li>обеспечение стабильности валютных курсов;<\/li>\n<li>содействие росту международной торговли;<\/li>\n<li>помощь странам при дефиците платёжного баланса.<\/li>\n<\/ul>\n<p><strong>Функции МВФ:<\/strong><\/p>\n<ul>\n<li><strong>Кредитование<\/strong> стран с проблемами платёжного баланса (обычно с условиями проведения реформ);<\/li>\n<li><strong>Надзор<\/strong> за экономической и валютной политикой стран;<\/li>\n<li><strong>Техническая помощь<\/strong> и консультации;<\/li>\n<li>выпуск <strong>специальных прав заимствования (СДР)<\/strong> — международного резервного актива.<\/li>\n<\/ul>\n<p><strong>Капитал МВФ<\/strong> формируется из взносов стран-членов (<strong>квот<\/strong>). Размер квоты определяет количество голосов страны и объём доступных кредитов.<\/p>\n<p><em>Пример:<\/em> МВФ ежегодно проводит консультации с Казахстаном и даёт рекомендации по денежно-кредитной и бюджетной политике.<\/p>", "k": ["Международный валютный фонд (МВФ)", "Кредитование", "Надзор", "Техническая помощь", "специальных прав заимствования (СДР)", "Капитал МВФ"], "s": "Международный валютный фонд (МВФ) — международная финансовая организация, созданная в 1944 году на Бреттон-Вудской конференции. Штаб-квартира — в Вашингтоне. В МВФ входят почти все страны мира, Казахстан — член МВФ с 1992 года."}, {"n": 40, "q": "Понятия лизинга, факторинга и форфейтинга", "a": "<p><strong>Лизинг<\/strong> — долгосрочная аренда имущества (оборудования, транспорта, недвижимости) с последующим правом выкупа. Лизингодатель покупает имущество и передаёт его лизингополучателю за периодические платежи.<\/p>\n<ul>\n<li><strong>Участники:<\/strong> лизингодатель, лизингополучатель, продавец имущества.<\/li>\n<li><strong>Виды:<\/strong> финансовый (с выкупом) и оперативный (имущество возвращается).<\/li>\n<li><em>Пример:<\/em> предприятие получает в лизинг грузовики и платит ежемесячно, а в конце срока выкупает их.<\/li>\n<\/ul>\n<p><strong>Факторинг<\/strong> — финансирование под уступку денежного требования. Банк (фактор) выкупает у поставщика долги его покупателей и сразу выплачивает поставщику большую часть суммы.<\/p>\n<ul>\n<li><strong>
