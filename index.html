орение от потребления всего количества блага.<\/li>\n<li><strong>Предельная полезность (MU)<\/strong> — дополнительная полезность от потребления ещё одной единицы блага.<\/li>\n<\/ul>\n<p><strong>Подходы к измерению полезности:<\/strong><\/p>\n<ul>\n<li><strong>Кардиналистский (количественный)<\/strong> — полезность можно измерить в условных единицах (ютилях).<\/li>\n<li><strong>Ординалистский (порядковый)<\/strong> — полезность нельзя измерить, но потребитель может упорядочить наборы благ по предпочтению (кривые безразличия).<\/li>\n<\/ul>\n<p><strong>Цель потребителя<\/strong> — получить максимальную полезность при ограниченном доходе.<\/p>\n<p><em>Пример:<\/em> первый стакан воды после пробежки приносит большое удовлетворение, а пятый — уже почти никакого.<\/p>", "k": ["Полезность", "субъективна", "количества", "Общая полезность (TU)", "Предельная полезность (MU)", "Кардиналистский (количественный)", "Ординалистский (порядковый)", "Цель потребителя"], "s": "Полезность — способность блага удовлетворять потребности человека; удовлетворение, которое потребитель получает от потребления блага."}, {"n": 22, "q": "В чем суть закона убывающей предельной полезности?", "a": "<p><strong>Закон убывающей предельной полезности<\/strong> (первый закон Госсена): с увеличением количества потребляемого блага <strong>предельная полезность каждой следующей единицы уменьшается<\/strong>.<\/p>\n<p><strong>Суть:<\/strong> по мере удовлетворения потребности каждая дополнительная единица блага приносит всё меньше удовлетворения.<\/p>\n<p><strong>Связь общей и предельной полезности:<\/strong><\/p>\n<ul>\n<li>пока предельная полезность <strong>положительна<\/strong>, общая полезность <strong>растёт<\/strong>;<\/li>\n<li>когда предельная полезность равна <strong>нулю<\/strong>, общая полезность <strong>максимальна<\/strong> (насыщение);<\/li>\n<li>если предельная полезность становится <strong>отрицательной<\/strong>, общая полезность <strong>снижается<\/strong>.<\/li>\n<\/ul>\n<p><strong>Значение закона:<\/strong><\/p>\n<ul>\n<li>объясняет <strong>закон спроса<\/strong>: человек готов платить за дополнительную единицу меньше, поэтому покупает больше только при снижении цены;<\/li>\n<li>объясняет <strong>парадокс воды и алмазов<\/strong>: вода полезнее, но её много, и предельная полезность низкая; алмазов мало — предельная полезность высокая.<\/li>\n<\/ul>\n<p><strong>Правило максимизации полезности (второй закон Госсена):<\/strong> потребитель распределяет доход так, чтобы предельная полезность на каждый потраченный тенге была одинаковой для всех товаров.<\/p>\n<p><em>Пример:<\/em> первый кусок пиццы — 10 единиц удовольствия, второй — 7, третий — 3, четвёртый — 0.<\/p>", "k": ["Закон убывающей предельной полезности", "Суть", "положительна", "максимальна", "отрицательной", "снижается", "закон спроса", "парадокс воды и алмазов"], "s": "Закон убывающей предельной полезности (первый закон Госсена): с увеличением количества потребляемого блага предельная полезность каждой следующей единицы уменьшается."}, {"n": 23, "q": "Что такое кривая безразличия и что она демонстрирует в поведении покупателя?", "a": "<p><strong>Кривая безразличия<\/strong> — кривая, каждая точка которой показывает наборы двух товаров, приносящие потребителю <strong>одинаковую полезность<\/strong>. Потребителю безразлично, какой набор выбрать.<\/p>\n<p><strong>Свойства кривых безразличия:<\/strong><\/p>\n<ul>\n<li>имеют <strong>отрицательный наклон<\/strong> — чтобы получить больше одного товара, нужно отказаться от части другого;<\/li>\n<li><strong>выпуклы к началу координат<\/strong> — из-за убывающей предельной нормы замещения;<\/li>\n<li><strong>не пересекаются<\/strong>;<\/li>\n<li>чем <strong>дальше<\/strong> кривая от начала координат, тем <strong>выше<\/strong> полезность.<\/li>\n<\/ul>\n<p><strong>Карта безразличия<\/strong> — набор кривых безразличия одного потребителя.<\/p>\n<p><strong>Предельная норма замещения (MRS)<\/strong> — количество одного товара, от которого потребитель готов отказаться ради дополнительной единицы другого товара при той же полезности.<\/p>\n<p><strong>Что демонстрирует:<\/strong> предпочтения и вкусы покупателя, его готовность заменять одни товары другими.<\/p>\n<p><em>Пример:<\/em> студенту одинаково полезны набор «2 пиццы + 4 бургера» и «4 пиццы + 2 бургера» — оба набора лежат на одной кривой безразличия.<\/p>", "k": ["Кривая безразличия", "одинаковую полезность", "отрицательный наклон", "выпуклы к началу координат", "не пересекаются", "Карта безразличия", "Предельная норма замещения (MRS)", "Что демонстрирует"], "s": "Кривая безразличия — кривая, каждая точка которой показывает наборы двух товаров, приносящие потребителю одинаковую полезность. Потребителю безразлично, какой набор выбрать."}, {"n": 24, "q": "Как бюджетная линия ограничивает выбор потребителя?", "a": "<p><strong>Бюджетная линия (бюджетное ограничение)<\/strong> — линия, показывающая все наборы двух товаров, которые потребитель может купить на весь свой доход при данных ценах.<\/p>\n<p><strong>Уравнение:<\/strong> I = Px · X + Py · Y, где I — доход, Px и Py — цены товаров, X и Y — количество товаров.<\/p>\n<p><strong>Как ограничивает выбор:<\/strong><\/p>\n<ul>\n<li>наборы <strong>на линии<\/strong> — доступны, весь доход потрачен;<\/li>\n<li>наборы <strong>ниже линии<\/strong> — доступны, но часть дохода остаётся;<\/li>\n<li>наборы <strong>выше линии<\/strong> — <strong>недоступны<\/strong> при данном доходе.<\/li>\n<\/ul>\n<p><strong>Изменение бюджетной линии:<\/strong><\/p>\n<ul>\n<li><strong>рост дохода<\/strong> — линия сдвигается параллельно <strong>вправо<\/strong>, снижение — влево;<\/li>\n<li><strong>изменение цены одного товара<\/strong> — линия <strong>поворачивается<\/strong>.<\/li>\n<\/ul>\n<p><strong>Равновесие потребителя<\/strong> — точка, где бюджетная линия <strong>касается<\/strong> самой высокой доступной кривой безразличия. В этой точке потребитель получает максимальную полезность при своём доходе.<\/p>\n<p><em>Пример:<\/em> у студента 10 000 тенге, кофе стоит 1 000, а булочка — 500. Он может купить 10 кофе, или 20 булочек, или 6 кофе и 8 булочек — все эти наборы лежат на бюджетной линии.<\/p>", "k": ["Бюджетная линия (бюджетное ограничение)", "Уравнение", "на линии", "ниже линии", "выше линии", "недоступны", "рост дохода", "изменение цены одного товара", "поворачивается", "Равновесие потребителя"], "s": "Бюджетная линия (бюджетное ограничение) — линия, показывающая все наборы двух товаров, которые потребитель может купить на весь свой доход при данных ценах."}, {"n": 25, "q": "Производственная функция предприятия. Параметры и влияющие факторы", "a": "<p><strong>Производственная функция<\/strong> — зависимость между количеством использованных факторов производства и максимальным объёмом выпуска продукции при данной технологии.<\/p>\n<p><strong>Формула:<\/strong> Q = f(L, K), где Q — объём выпуска, L — труд, K — капитал.<\/p>\n<p><strong>Классический пример — функция Кобба–Дугласа:<\/strong> Q = A · L^α · K^β, где A — технологический коэффициент.<\/p>\n<p><strong>Параметры (показатели) производства:<\/strong><\/p>\n<ul>\n<li><strong>Общий продукт (TP)<\/strong> — весь объём выпущенной продукции.<\/li>\n<li><strong>Средний продукт (AP)<\/strong> — выпуск в расчёте на единицу фактора: AP = TP / L.<\/li>\n<li><strong>Предельный продукт (MP)<\/strong> — прирост выпуска от дополнительной единицы фактора: MP = ΔTP / ΔL.<\/li>\n<\/ul>\n<p><strong>Закон убывающей предельной производительности:<\/strong> при увеличении одного фактора при неизменности других предельный продукт сначала растёт, а затем снижается.<\/p>\n<p><strong>Факторы, влияющие на производственную функцию:<\/strong><\/p>\n<ul>\n<li>количество и качество труда;<\/li>\n<li>количество и качество капитала (оборудование);<\/li>\n<li><strong>технологии<\/strong> (новые технологии сдвигают функцию вверх);<\/li>\n<li>организация производства и управление;<\/li>\n<li>природные ресурсы.<\/li>\n<\/ul>\n<p><strong>Отдача от масштаба<\/strong> (при увеличении всех факторов): возрастающая, постоянная или убывающая.<\/p>\n<p><em>Пример:<\/em> если в пекарне с одной печью добавлять пекарей, то сначала выпуск растёт быстро, но затем пекари начинают мешать друг другу, и прирост замедляется.<\/p>", "k": ["Производственная функция", "Формула", "Классический пример — функция Кобба–Дугласа", "Общий продукт (TP)", "Средний продукт (AP)", "Предельный продукт (MP)", "Закон убывающей предельной производительности", "технологии", "Отдача от масштаба"], "s": "Производственная функция — зависимость между количеством использованных факторов производства и максимальным объёмом выпуска продукции при данной технологии."}, {"n": 26, "q": "В чем разница между постоянными и переменными факторами производства в краткосрочном периоде?", "a": "<p><strong>Краткосрочный период<\/strong> — период, в течение которого фирма не может изменить хотя бы один фактор производства (обычно размер предприятия, оборудование).<\/p>\n<p><strong>Долгосрочный период<\/strong> — период, достаточный для изменения всех факторов.<\/p>\n<p><strong>Постоянные факторы<\/strong> — факторы, количество которых нельзя быстро изменить в краткосрочном периоде:<\/p>\n<ul>\n<li>здания и помещения;<\/li>\n<li>оборудование;<\/li>\n<li>земля;<\/li>\n<li>управленческий персонал.<\/li>\n<\/ul>\n<p><strong>Переменные факторы<\/strong> — факторы, количество которых можно изменить быстро, в зависимости от объёма выпуска:<\/p>\n<ul>\n<li>сырьё и материалы;<\/li>\n<li>рабочие;<\/li>\n<li>электроэнергия;<\/li>\n<li>топливо.<\/li>\n<\/ul>\n<p><strong>Отличие:<\/strong><\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Признак<\/th>\n<th>Постоянные факторы<\/th>\n<th>Переменные факторы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Можно ли изменить быстро<\/td>\n<td>Нет<\/td>\n<td>Да<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Зависят от объёма выпуска<\/td>\n<td>Нет<\/td>\n<td>Да<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Связанные издержки<\/td>\n<td>Постоянные (FC)<\/td>\n<td>Переменные (VC)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Пример<\/td>\n<td>Аренда цеха<\/td>\n<td>Сырьё, сдельная зарплата<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>В <strong>долгосрочном периоде<\/strong> все факторы становятся <strong>переменными<\/strong>.<\/p>\n<p><em>Пример:<\/em> швейный цех может за неделю нанять ещё 5 швей и закупить больше ткани, но построить новый цех за неделю не сможет.<\/p>", "k": ["Краткосрочный период", "Долгосрочный период", "Постоянные факторы", "Переменные факторы", "долгосрочном периоде", "переменными"], "s": "Краткосрочный период — период, в течение которого фирма не может изменить хотя бы один фактор производства (обычно размер предприятия, оборудование)."}, {"n": 27, "q": "Что такое издержки производства? Чем отличаются явные (бухгалтерские) издержки от неявных (экономических)?", "a": "<p><strong>Издержки производства<\/strong> — затраты фирмы на приобретение и использование факторов производства для выпуска продукции.<\/p>\n<p><strong>Явные (бухгалтерские) издержки<\/strong> — денежные платежи фирмы внешним поставщикам ресурсов. Отражаются в бухгалтерском учёте.<\/p>\n<ul>\n<li>зарплата работникам;<\/li>\n<li>оплата сырья и материалов;<\/li>\n<li>аренда, коммунальные услуги;<\/li>\n<li>проценты по кредитам, налоги.<\/li>\n<\/ul>\n<p><strong>Неявные (внутренние) издержки<\/strong> — альтернативная стоимость ресурсов, которые принадлежат самому владельцу фирмы. Денежных платежей нет.<\/p>\n<ul>\n<li>зарплата, которую предприниматель мог бы получать, работая по найму;<\/li>\n<li>аренда, которую он мог бы получать, сдавая своё помещение;<\/li>\n<li>проценты, которые он мог бы получить, положив свои деньги на депозит.<\/li>\n<\/ul>\n<p><strong>Экономические издержки<\/strong> = явные издержки + неявные издержки.<\/p>\n<p><strong>Виды прибыли:<\/strong><\/p>\n<ul>\n<li><strong>Бухгалтерская прибыль<\/strong> = выручка − явные издержки.<\/li>\n<li><strong>Экономическая прибыль<\/strong> = выручка − (явные + неявные издержки).<\/li>\n<li><strong>Нормальная прибыль<\/strong> — минимальная прибыль, при которой предпринимателю выгодно продолжать дело (экономическая прибыль = 0).<\/li>\n<\/ul>\n<p><strong>Другие виды издержек:<\/strong> постоянные (FC) и переменные (VC), общие (TC = FC + VC), средние (AC), предельные (MC).<\/p>\n<p><em>Пример:<\/em> предприниматель открыл кафе в собственном помещении. Явные издержки — продукты и зарплата поваров, неявные — 300 000 тенге в месяц, которые он мог бы получать, сдавая помещение в аренду.<\/p>", "k": ["Издержки производства", "Явные (бухгалтерские) издержки", "Неявные (внутренние) издержки", "Экономические издержки", "Бухгалтерская прибыль", "Экономическая прибыль", "Нормальная прибыль", "Другие виды издержек"], "s": "Издержки производства — затраты фирмы на приобретение и использование факторов производства для выпуска продукции."}, {"n": 28, "q": "Каковы особенности рынка труда и как формируется заработная плата?", "a": "<p><strong>Рынок труда<\/strong> — рынок, на котором встречаются работодатели (спрос на труд) и работники (предложение труда) и формируются заработная плата и занятость.<\/p>\n<p><strong>Особенности рынка труда:<\/strong><\/p>\n<ul>\n<li>товар — <strong>услуги труда<\/strong>, а не сам человек;<\/li>\n<li>труд неотделим от работника, важны условия труда, коллектив, престиж;<\/li>\n<li><strong>спрос на труд — производный<\/strong>: зависит от спроса на товары, которые производит работник;<\/li>\n<li>активное участие государства (минимальная зарплата, трудовое законодательство);<\/li>\n<li>существуют <strong>профсоюзы<\/strong>;<\/li>\n<li>низкая мобильность (переезд в другой город сложен).<\/li>\n<\/ul>\n<p><strong>Спрос на труд<\/strong> — зависит от зарплаты (обратная зависимость), производительности, спроса на продукцию.<\/p>\n<p><strong>Предложение труда<\/strong> — зависит от зарплаты (прямая зависимость), численности населения, образования, социальных факторов.<\/p>\n<p><strong>Заработная плата<\/strong> — цена труда, денежное вознаграждение работника за труд.<\/p>\n<ul>\n<li><strong>Номинальная<\/strong> — сумма денег, полученная работником.<\/li>\n<li><strong>Реальная<\/strong> — количество товаров и услуг, которые можно купить на номинальную зарплату (с учётом инфляции).<\/li>\n<\/ul>\n<p><strong>Формы оплаты:<\/strong> <strong>повременная<\/strong> (за отработанное время) и <strong>сдельная<\/strong> (за количество продукции).<\/p>\n<p><strong>Как формируется:<\/strong> равновесная зарплата устанавливается на пересечении спроса и предложения труда. Также влияют квалификация, отрасль, регион, профсоюзы и государство (минимальный размер заработной платы).<\/p>\n<p><em>Пример:<\/em> зарплаты IT-специалистов высокие, так как спрос на них большой, а квалифицированных работников мало.<\/p>", "k": ["Рынок труда", "услуги труда", "спрос на труд — производный", "профсоюзы", "Спрос на труд", "Предложение труда", "Заработная плата", "Номинальная", "Реальная", "Формы оплаты", "повременная", "Как формируется"], "s": "Рынок труда — рынок, на котором встречаются работодатели (спрос на труд) и работники (предложение труда) и формируются заработная плата и занятость."}, {"n": 29, "q": "Как функционирует рынок капитала и что представляет собой процентная ставка?", "a": "<p><strong>Капитал<\/strong> — ресурсы, используемые для производства товаров и услуг.<\/p>\n<ul>\n<li><strong>Физический (реальный) капитал<\/strong> — здания, оборудование, машины.<\/li>\n<li><strong>Денежный капитал<\/strong> — деньги, используемые для покупки физического капитала.<\/li>\n<\/ul>\n<p><strong>Рынок капитала<\/strong> — рынок, на котором владельцы свободных денежных средств предоставляют их тем, кому нужны средства для инвестиций.<\/p>\n<p><strong>Участники:<\/strong><\/p>\n<ul>\n<li><strong>Предложение капитала<\/strong> — домохозяйства и организации со сбережениями.<\/li>\n<li><strong>Спрос на капитал<\/strong> — фирмы и государство, которым нужны средства на инвестиции.<\/li>\n<li><strong>Посредники<\/strong> — банки, биржи, инвестиционные фонды.<\/li>\n<\/ul>\n<p><strong>Процентная ставка<\/strong> — цена использования денежного капитала; плата за кредит в процентах от суммы займа за год.<\/p>\n<ul>\n<li><strong>Номинальная ставка<\/strong> — объявленная банком.<\/li>\n<li><strong>Реальная ставка<\/strong> = номинальная ставка − уровень инфляции.<\/li>\n<\/ul>\n<p><strong>Как формируется:<\/strong> равновесная ставка устанавливается на пересечении спроса и предложения капитала. Влияет базовая ставка Национального Банка, инфляция, риск, срок кредита.<\/p>\n<p><strong>Инвестиционное решение:<\/strong> фирма вкладывает деньги в проект, если ожидаемая доходность выше процентной ставки.<\/p>\n<p><strong>Дисконтирование<\/strong> — определение сегодняшней стоимости будущих доходов: PV = FV / (1 + r)^n.<\/p>\n<p><em>Пример:<\/em> если кредит дают под 20%, а инфляция 10%, то реальная ставка примерно 10%.<\/p>", "k": ["Капитал", "Физический (реальный) капитал", "Денежный капитал", "Рынок капитала", "Предложение капитала", "Спрос на капитал", "Посредники", "Процентная ставка", "Номинальная ставка", "Реальная ставка", "Как формируется", "Инвестиционное решение", "Дисконтирование"], "s": "Капитал — ресурсы, используемые для производства товаров и услуг."}, {"n": 30, "q": "Каковы особенности рынка земли и как определяется земельная рента?", "a": "<p><strong>Земля<\/strong> — в экономике это все природные ресурсы: земельные участки, недра, вода, леса.<\/p>\n<p><strong>Особенности рынка земли:<\/strong><\/p>\n<ul>\n<li><strong>предложение земли фиксировано<\/strong> (абсолютно неэластично) — землю нельзя произвести;<\/li>\n<li>земля <strong>не перемещается<\/strong> — важно местоположение;<\/li>\n<li>земля различается по <strong>плодородию<\/strong> и <strong>расположению<\/strong>;<\/li>\n<li>рынок земли сильно регулируется государством.<\/li>\n<\/ul>\n<p><strong>Земельная рента<\/strong> — доход, получаемый собственником земли за её использование; цена использования земли.<\/p>\n<p><strong>Как определяется:<\/strong> так как предложение земли постоянно, размер ренты определяется <strong>спросом<\/strong> на землю. Рост спроса повышает ренту.<\/p>\n<p><strong>Виды ренты:<\/strong><\/p>\n<ul>\n<li><strong>Дифференциальная рента I<\/strong> — дополнительный доход из-за <strong>плодородия<\/strong> и <strong>местоположения<\/strong> участка.<\/li>\n<li><strong>Дифференциальная рента II<\/strong> — доход от <strong>дополнительных вложений<\/strong> в землю (удобрения, орошение).<\/li>\n<li><strong>Абсолютная рента<\/strong> — рента, которую платят за любой участок, даже самый худший.<\/li>\n<\/ul>\n<p><strong>Цена земли<\/strong> = годовая рента / ставка банковского процента × 100%.<\/p>\n<p><strong>Особенность Казахстана:<\/strong> по Конституции земля находится в государственной собственности, но может быть и в частной. Сельскохозяйственные земли <strong>не продаются и не передаются в аренду иностранцам<\/strong>.<\/p>\n<p><em>Пример:<\/em> если участок приносит 1 млн тенге ренты в год, а ставка по депозитам 10%, то цена участка — 10 млн тенге.<\/p>", "k": ["Земля", "предложение земли фиксировано", "не перемещается", "плодородию", "расположению", "Земельная рента", "Как определяется", "Дифференциальная рента I", "плодородия", "местоположения", "Дифференциальная рента II", "дополнительных вложений", "Абсолютная рента", "Цена земли"], "s": "Земля — в экономике это все природные ресурсы: земельные участки, недра, вода, леса."}, {"n": 31, "q": "Чем предмет изучения макроэкономики отличается от микроэкономики?", "a": "<p><strong>Микроэкономика<\/strong> — раздел экономической теории, изучающий поведение <strong>отдельных<\/strong> экономических субъектов: потребителей, фирм, отраслей и рынков.<\/p>\n<p><strong>Макроэкономика<\/strong> — раздел экономической теории, изучающий экономику <strong>страны в целом<\/strong>.<\/p>\n<p><strong>Сравнение:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Признак<\/th>\n<th>Микроэкономика<\/th>\n<th>Макроэкономика<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Объект<\/td>\n<td>Потребитель, фирма, отрасль<\/td>\n<td>Национальная экономика в целом<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Главные вопросы<\/td>\n<td>Как формируется цена, как фирме максимизировать прибыль<\/td>\n<td>Почему растут цены и безработица, как ускорить рост<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Показатели<\/td>\n<td>Цена, спрос, предложение, издержки, прибыль<\/td>\n<td>ВВП, инфляция, безработица, процентная ставка<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Цель субъектов<\/td>\n<td>Максимум полезности и прибыли<\/td>\n<td>Экономический рост, стабильность цен, занятость<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Взаимосвязь:<\/strong> макроэкономика складывается из суммы микроэкономических решений, а макроэкономическая ситуация влияет на решения отдельных фирм и потребителей.<\/p>\n<p><em>Пример:<\/em> почему подорожали бананы в магазине — вопрос микроэкономики; почему растут цены всех товаров в стране — вопрос макроэкономики.<\/p>", "k": ["Микроэкономика", "отдельных", "Макроэкономика", "страны в целом", "Взаимосвязь"], "s": "Микроэкономика — раздел экономической теории, изучающий поведение отдельных экономических субъектов: потребителей, фирм, отраслей и рынков."}, {"n": 32, "q": "Что такое Валовой внутренний продукт (ВВП) и способы его расчета?", "a": "<p><strong>Валовой внутренний продукт (ВВП)<\/strong> — рыночная стоимость всех конечных товаров и услуг, произведённых на территории страны за год (независимо от того, кому принадлежат предприятия).<\/p>\n<p><strong>Важно:<\/strong><\/p>\n<ul>\n<li>учитываются только <strong>конечные<\/strong> товары (промежуточные не учитываются, чтобы избежать двойного счёта);<\/li>\n<li>не учитываются перепродажи, финансовые сделки, трансферты (пенсии, пособия).<\/li>\n<\/ul>\n<p><strong>Способы расчёта ВВП:<\/strong><\/p>\n<p><strong>1. По расходам:<\/strong><\/p>\n<p>ВВП = C + I + G + Xn<\/p>\n<ul>\n<li><strong>C<\/strong> — потребительские расходы домохозяйств;<\/li>\n<li><strong>I<\/strong> — валовые инвестиции фирм;<\/li>\n<li><strong>G<\/strong> — государственные закупки товаров и услуг;<\/li>\n<li><strong>Xn<\/strong> — чистый экспорт (экспорт − импорт).<\/li>\n<\/ul>\n<p><strong>2. По доходам:<\/strong> сумма всех доходов в экономике — заработная плата, рента, процент, прибыль, плюс амортизация и косвенные налоги.<\/p>\n<p><strong>3. Производственный метод (по добавленной стоимости):<\/strong> сумма добавленной стоимости всех отраслей. <strong>Добавленная стоимость<\/strong> = выручка − стоимость промежуточной продукции.<\/p>\n<p><strong>ВВП на душу населения<\/strong> = ВВП / численность населения — показатель уровня жизни.<\/p>\n<p><em>Пример:<\/em> фермер продаёт пшеницу мельнице за 100 тенге, мельница — муку пекарне за 150, пекарня — хлеб за 250. В ВВП входит только 250 тенге (стоимость конечного хлеба).<\/p>", "k": ["Валовой внутренний продукт (ВВП)", "Добавленная стоимость", "ВВП на душу населения"], "s": "Валовой внутренний продукт (ВВП) — рыночная стоимость всех конечных товаров и услуг, произведённых на территории страны за год (независимо от того, кому принадлежат предприятия)."}, {"n": 33, "q": "Чем отличается номинальный ВВП от реального ВВП?", "a": "<p><strong>Номинальный ВВП<\/strong> — ВВП, рассчитанный в <strong>текущих ценах<\/strong> того года, в котором произведена продукция.<\/p>\n<p><strong>Реальный ВВП<\/strong> — ВВП, рассчитанный в <strong>постоянных (базовых) ценах<\/strong> определённого года. Он очищен от влияния инфляции.<\/p>\n<p><strong>Отличие:<\/strong> номинальный ВВП может расти просто из-за роста цен, а реальный ВВП показывает <strong>реальный рост производства<\/strong>.<\/p>\n<p><strong>Дефлятор ВВП<\/strong> — индекс цен, показывающий изменение цен всех товаров, входящих в ВВП:<\/p>\n<p>Дефлятор ВВП = (Номинальный ВВП / Реальный ВВП) × 100%<\/p>\n<p><strong>Реальный ВВП<\/strong> = Номинальный ВВП / Дефлятор ВВП.<\/p>\n<p><strong>Значение:<\/strong><\/p>\n<ul>\n<li>для сравнения экономики в разные годы используют <strong>реальный ВВП<\/strong>;<\/li>\n<li><strong>рост реального ВВП<\/strong> — главный показатель экономического роста.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> номинальный ВВП вырос на 15%, а цены выросли на 10%. Значит, реальный ВВП вырос примерно на 5%, то есть производство реально увеличилось только на 5%.<\/p>", "k": ["Номинальный ВВП", "текущих ценах", "Реальный ВВП", "постоянных (базовых) ценах", "Отличие", "реальный рост производства", "Дефлятор ВВП", "рост реального ВВП"], "s": "Номинальный ВВП — ВВП, рассчитанный в текущих ценах того года, в котором произведена продукция."}, {"n": 34, "q": "Какие показатели входят в систему национальных счетов?", "a": "<p><strong>Система национальных счетов (СНС)<\/strong> — система взаимосвязанных показателей, характеризующих результаты экономической деятельности страны. Принята ООН, используется в большинстве стран, включая Казахстан.<\/p>\n<p><strong>Основные показатели СНС:<\/strong><\/p>\n<ul>\n<li><strong>ВВП (валовой внутренний продукт)<\/strong> — стоимость конечных товаров и услуг, произведённых на территории страны.<\/li>\n<li><strong>ВНД (валовой национальный доход, ранее ВНП)<\/strong> — стоимость продукции, произведённой гражданами и предприятиями страны (и внутри, и за рубежом): ВНД = ВВП + доходы граждан из-за рубежа − доходы иностранцев внутри страны.<\/li>\n<li><strong>ЧВП (чистый внутренний продукт)<\/strong> = ВВП − амортизация.<\/li>\n<li><strong>НД (национальный доход)<\/strong> = ЧНП − косвенные налоги. Это сумма доходов владельцев факторов производства (зарплата, рента, процент, прибыль).<\/li>\n<li><strong>ЛД (личный доход)<\/strong> — доход, полученный домохозяйствами (НД − взносы на соцстрах − налог на прибыль − нераспределённая прибыль + трансферты).<\/li>\n<li><strong>РЛД (располагаемый личный доход)<\/strong> = ЛД − индивидуальные налоги. Это доход, который люди могут потратить или сохранить.<\/li>\n<\/ul>\n<p><strong>Значение СНС:<\/strong> позволяет оценивать состояние экономики, сравнивать страны и разрабатывать экономическую политику.<\/p>\n<p>В Казахстане расчёт показателей СНС ведёт <strong>Бюро национальной статистики<\/strong>.<\/p>", "k": ["Система национальных счетов (СНС)", "ВВП (валовой внутренний продукт)", "ВНД (валовой национальный доход, ранее ВНП)", "ЧВП (чистый внутренний продукт)", "НД (национальный доход)", "ЛД (личный доход)", "РЛД (располагаемый личный доход)", "Значение СНС", "Бюро национальной статистики"], "s": "Система национальных счетов (СНС) — система взаимосвязанных показателей, характеризующих результаты экономической деятельности страны. Принята ООН, используется в большинстве стран, включая Казахстан."}, {"n": 35, "q": "В чем проявляются «провалы рынка» и почему необходимо вмешательство государства в экономику?", "a": "<p><strong>Провалы рынка<\/strong> — ситуации, в которых рынок не может эффективно распределять ресурсы или решать важные для общества задачи.<\/p>\n<p><strong>Основные провалы рынка:<\/strong><\/p>\n<ul>\n<li><strong>Монополизация<\/strong> — крупные фирмы подавляют конкуренцию, завышают цены.<\/li>\n<li><strong>Внешние эффекты (экстерналии)<\/strong> — последствия деятельности, которые затрагивают третьих лиц:\n<ul>\n<li><strong>отрицательные<\/strong> — загрязнение окружающей среды заводом;<\/li>\n<li><strong>положительные<\/strong> — вакцинация защищает не только привитого, но и окружающих.<\/li>\n<\/ul><\/li>\n<li><strong>Общественные блага<\/strong> — блага, от использования которых нельзя исключить других (оборона, уличное освещение, маяки). Бизнесу их производить невыгодно из-за проблемы «безбилетника».<\/li>\n<li><strong>Неполнота информации (информационная асимметрия)<\/strong> — продавец знает о товаре больше, чем покупатель.<\/li>\n<li><strong>Неравенство доходов<\/strong> — рынок не обеспечивает социальной справедливости.<\/li>\n<li><strong>Нестабильность<\/strong> — циклические кризисы, безработица, инфляция.<\/li>\n<\/ul>\n<p><strong>Почему необходимо вмешательство государства:<\/strong> чтобы устранить или ослабить провалы рынка, обеспечить общество общественными благами, защитить конкуренцию, окружающую среду и социально незащищённых граждан.<\/p>\n<p><strong>Методы вмешательства:<\/strong> законы, налоги, субсидии, антимонопольное регулирование, государственные расходы, социальные программы.<\/p>\n<p><em>Пример:<\/em> завод, загрязняющий реку, не платит за ущерб жителям, поэтому государство вводит плату за эмиссии и экологические штрафы.<\/p>", "k": ["Провалы рынка", "Монополизация", "Внешние эффекты (экстерналии)", "отрицательные", "положительные", "Общественные блага", "Неравенство доходов", "Нестабильность", "Почему необходимо вмешательство государства", "Методы вмешательства"], "s": "Провалы рынка — ситуации, в которых рынок не может эффективно распределять ресурсы или решать важные для общества задачи."}, {"n": 36, "q": "Перечислите основные функции государства в современной рыночной экономике", "a": "<p><strong>Основные функции государства:<\/strong><\/p>\n<ul>\n<li><strong>Создание правовой базы<\/strong> — законы, защищающие собственность и регулирующие экономическую деятельность.<\/li>\n<li><strong>Защита конкуренции<\/strong> — антимонопольная политика.<\/li>\n<li><strong>Производство общественных благ<\/strong> — оборона, правопорядок, дороги, образование, здравоохранение.<\/li>\n<li><strong>Перераспределение доходов<\/strong> — налоги и социальные выплаты для снижения неравенства.<\/li>\n<li><strong>Стабилизация экономики<\/strong> — борьба с инфляцией, безработицей и кризисами через бюджетную и денежно-кредитную политику.<\/li>\n<li><strong>Регулирование внешних эффектов<\/strong> — охрана окружающей среды, экологические налоги и штрафы.<\/li>\n<li><strong>Обеспечение стабильности денежной системы<\/strong> — через Национальный Банк.<\/li>\n<li><strong>Социальная защита<\/strong> — пенсии, пособия, помощь малоимущим.<\/li>\n<li><strong>Стимулирование экономического роста<\/strong> — поддержка инвестиций, инноваций, приоритетных отраслей.<\/li>\n<li><strong>Регулирование внешнеэкономической деятельности<\/strong> — таможенная политика, внешняя торговля.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> государство Казахстан строит дороги (общественное благо), выплачивает пенсии (социальная защита) и через Национальный Банк сдерживает инфляцию (стабилизация).<\/p>", "k": ["Создание правовой базы", "Защита конкуренции", "Производство общественных благ", "Перераспределение доходов", "Стабилизация экономики", "Регулирование внешних эффектов", "Обеспечение стабильности денежной системы", "Социальная защита", "Стимулирование экономического роста"], "s": ""}, {"n": 37, "q": "Каковы цели и направления социальной политики государства?", "a": "<p><strong>Социальная политика<\/strong> — деятельность государства, направленная на повышение уровня жизни населения, снижение неравенства и обеспечение социальной защищённости граждан.<\/p>\n<p><strong>Цели социальной политики:<\/strong><\/p>\n<ul>\n<li>повышение уровня и качества жизни;<\/li>\n<li>снижение бедности и неравенства;<\/li>\n<li>социальная стабильность в обществе;<\/li>\n<li>защита социально уязвимых групп;<\/li>\n<li>развитие человеческого капитала.<\/li>\n<\/ul>\n<p><strong>Основные направления:<\/strong><\/p>\n<ul>\n<li><strong>Политика доходов<\/strong> — установление минимального размера заработной платы, индексация доходов.<\/li>\n<li><strong>Социальная защита<\/strong> — пенсии, пособия по инвалидности, многодетным семьям, по потере кормильца.<\/li>\n<li><strong>Адресная социальная помощь<\/strong> — помощь семьям с доходами ниже черты бедности.<\/li>\n<li><strong>Политика занятости<\/strong> — создание рабочих мест, переобучение, помощь безработным.<\/li>\n<li><strong>Образование<\/strong> — бесплатное среднее образование, гранты в вузах.<\/li>\n<li><strong>Здравоохранение<\/strong> — гарантированный объём бесплатной медицинской помощи, ОСМС.<\/li>\n<li><strong>Жилищная политика<\/strong> — социальное жильё, льготная ипотека (например, через «Отбасы банк»).<\/li>\n<li><strong>Демографическая политика<\/strong> — поддержка рождаемости и семей.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> в Казахстане действует программа «Национальный фонд — детям», по которой на счета детей ежегодно перечисляется часть доходов Национального фонда.<\/p>", "k": ["Социальная политика", "Политика доходов", "Социальная защита", "Адресная социальная помощь", "Политика занятости", "Образование", "Здравоохранение", "Жилищная политика", "Демографическая политика"], "s": "Социальная политика — деятельность государства, направленная на повышение уровня жизни населения, снижение неравенства и обеспечение социальной защищённости граждан."}, {"n": 38, "q": "Что такое прожиточный минимум и как определяется уровень бедности в стране?", "a": "<p><strong>Прожиточный минимум<\/strong> — минимальный денежный доход на одного человека, необходимый для удовлетворения его основных потребностей. Он равен стоимости <strong>минимальной потребительской корзины<\/strong>.<\/p>\n<p><strong>Минимальная потребительская корзина<\/strong> включает:<\/p>\n<ul>\n<li><strong>продукты питания<\/strong> (хлеб, мясо, молоко, овощи и др.);<\/li>\n<li><strong>непродовольственные товары<\/strong> (одежда, обувь);<\/li>\n<li><strong>услуги<\/strong> (жильё, коммунальные услуги, транспорт).<\/li>\n<\/ul>\n<p>В Казахстане величина прожиточного минимума рассчитывается ежегодно и используется для определения размеров пособий, пенсий и минимальной зарплаты.<\/p>\n<p><strong>Черта бедности<\/strong> — уровень дохода, ниже которого человек считается бедным. В Казахстане черта бедности устанавливается в процентах от прожиточного минимума.<\/p>\n<p><strong>Как определяется уровень бедности:<\/strong><\/p>\n<ul>\n<li><strong>Уровень бедности<\/strong> = доля населения с доходами ниже черты бедности (в %).<\/li>\n<li><strong>Абсолютная бедность<\/strong> — доход не позволяет обеспечить минимальные потребности.<\/li>\n<li><strong>Относительная бедность<\/strong> — доход значительно ниже среднего в стране.<\/li>\n<\/ul>\n<p><strong>Показатели неравенства:<\/strong><\/p>\n<ul>\n<li><strong>Коэффициент Джини<\/strong> — от 0 (полное равенство) до 1 (полное неравенство).<\/li>\n<li><strong>Кривая Лоренца<\/strong> — графическое изображение неравенства доходов.<\/li>\n<li><strong>Децильный коэффициент<\/strong> — соотношение доходов 10% самых богатых и 10% самых бедных.<\/li>\n<\/ul>\n<p><strong>Международный подход:<\/strong> Всемирный банк определяет крайнюю бедность как доход ниже определённой суммы в долларах в день по паритету покупательной способности.<\/p>\n<p><em>Пример:<\/em> семье, доход которой на одного члена ниже черты бедности, государство назначает адресную социальную помощь.<\/p>", "k": ["Прожиточный минимум", "минимальной потребительской корзины", "Минимальная потребительская корзина", "продукты питания", "непродовольственные товары", "Черта бедности", "Уровень бедности", "Абсолютная бедность", "Относительная бедность", "Коэффициент Джини", "Кривая Лоренца", "Децильный коэффициент", "Международный подход"], "s": "Прожиточный минимум — минимальный денежный доход на одного человека, необходимый для удовлетворения его основных потребностей. Он равен стоимости минимальной потребительской корзины."}, {"n": 39, "q": "Что представляет собой цикличность экономического развития и из каких фаз состоит экономический цикл?", "a": "<p><strong>Экономический цикл<\/strong> — периодические колебания деловой активности (подъёмы и спады производства, занятости, доходов) в экономике.<\/p>\n<p><strong>Цикличность<\/strong> — экономика развивается не равномерно, а волнообразно.<\/p>\n<p><strong>Фазы экономического цикла:<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>Подъём (оживление)<\/strong> — рост производства, занятости, доходов и инвестиций.<\/li>\n<li><strong>Пик (бум)<\/strong> — максимальная деловая активность, низкая безработица, но растут цены и возможен «перегрев» экономики.<\/li>\n<li><strong>Спад (рецессия, кризис)<\/strong> — сокращение производства, рост безработицы, падение доходов, банкротства.<\/li>\n<li><strong>Дно (депрессия)<\/strong> — нижняя точка цикла; производство и занятость на минимальном уровне, затем начинается восстановление.<\/li>\n<\/ol>\n<p><strong>Причины циклов:<\/strong><\/p>\n<ul>\n<li>колебания совокупного спроса и инвестиций;<\/li>\n<li>изменения денежной массы;<\/li>\n<li>технологические открытия;<\/li>\n<li>внешние шоки (войны, пандемии, падение цен на нефть).<\/li>\n<\/ul>\n<p><strong>Виды циклов по продолжительности:<\/strong><\/p>\n<ul>\n<li><strong>Циклы Китчина<\/strong> — 3–4 года (колебания запасов);<\/li>\n<li><strong>Циклы Жюгляра<\/strong> — 7–11 лет (инвестиции в оборудование);<\/li>\n<li><strong>Циклы Кузнеца<\/strong> — 15–25 лет (строительство);<\/li>\n<li><strong>Циклы Кондратьева<\/strong> — 40–60 лет (смена технологий).<\/li>\n<\/ul>\n<p><em>Пример:<\/em> в 2020 году из-за пандемии экономики многих стран, включая Казахстан, перешли в фазу спада, а в 2021 году началось оживление.<\/p>", "k": ["Экономический цикл", "Цикличность", "Подъём (оживление)", "Пик (бум)", "Спад (рецессия, кризис)", "Дно (депрессия)", "Циклы Китчина", "Циклы Жюгляра", "Циклы Кузнеца", "Циклы Кондратьева"], "s": "Экономический цикл — периодические колебания деловой активности (подъёмы и спады производства, занятости, доходов) в экономике."}, {"n": 40, "q": "Что такое экономический рост и каковы его типы?", "a": "<p><strong>Экономический рост<\/strong> — увеличение объёма производства товаров и услуг в стране за определённый период.<\/p>\n<p><strong>Показатели экономического роста:<\/strong><\/p>\n<ul>\n<li><strong>темп роста реального ВВП<\/strong> (в %);<\/li>\n<li><strong>рост реального ВВП на душу населения.<\/strong><\/li>\n<\/ul>\n<p><strong>Факторы экономического роста:<\/strong> увеличение количества и качества ресурсов (труд, капитал, природные ресурсы), научно-технический прогресс, образование, эффективное управление.<\/p>\n<p><strong>Типы экономического роста:<\/strong><\/p>\n<ul>\n<li><strong>Экстенсивный<\/strong> — рост за счёт <strong>увеличения количества<\/strong> ресурсов (больше работников, больше оборудования, освоение новых земель) при неизменной технологии.<\/li>\n<li><strong>Интенсивный<\/strong> — рост за счёт <strong>повышения эффективности<\/strong> использования ресурсов (новые технологии, рост производительности труда, квалификация).<\/li>\n<\/ul>\n<p><strong>Сравнение:<\/strong><\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Признак<\/th>\n<th>Экстенсивный<\/th>\n<th>Интенсивный<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Источник роста<\/td>\n<td>Больше ресурсов<\/td>\n<td>Лучшее использование ресурсов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Производительность труда<\/td>\n<td>Не меняется<\/td>\n<td>Растёт<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Устойчивость<\/td>\n<td>Ограничена ресурсами<\/td>\n<td>Долгосрочная<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Пример<\/td>\n<td>Распашка целинных земель<\/td>\n<td>Внедрение цифровых технологий<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>На практике обычно сочетаются оба типа (<strong>смешанный рост<\/strong>).<\/p>\n<p><em>Пример:<\/em> освоение целинных земель в Казахстане в 1950-х годах — экстенсивный рост, а внедрение точного земледелия с помощью дронов — интенсивный.<\/p>", "k": ["Экономический рост", "темп роста реального ВВП", "рост реального ВВП на душу населения", "Факторы экономического роста", "Экстенсивный", "увеличения количества", "Интенсивный", "повышения эффективности", "смешанный рост"], "s": "Экономический рост — увеличение объёма производства товаров и услуг в стране за определённый период."}, {"n": 41, "q": "Кто относится к категории занятых, безработных и рабочей силы? Показатели используемые государством для оценки безработицы", "a": "<p><strong>Население страны делится на:<\/strong><\/p>\n<ul>\n<li><strong>Экономически активное население (рабочая сила)<\/strong> = занятые + безработные.<\/li>\n<li><strong>Экономически неактивное население<\/strong> — студенты очной формы, пенсионеры, домохозяйки, люди, не ищущие работу.<\/li>\n<\/ul>\n<p><strong>Занятые<\/strong> — лица, которые выполняют работу за вознаграждение или получают доход (работающие по найму, предприниматели, самозанятые).<\/p>\n<p><strong>Безработные<\/strong> — лица трудоспособного возраста, которые:<\/p>\n<ul>\n<li><strong>не имеют работы<\/strong>;<\/li>\n<li><strong>активно ищут работу<\/strong>;<\/li>\n<li><strong>готовы приступить к работе.<\/strong><\/li>\n<\/ul>\n<p><strong>Показатели безработицы:<\/strong><\/p>\n<ul>\n<li><strong>Уровень безработицы<\/strong> = (число безработных / рабочая сила) × 100%.<\/li>\n<li><strong>Уровень занятости<\/strong> = (число занятых / население трудоспособного возраста) × 100%.<\/li>\n<li><strong>Уровень участия в рабочей силе<\/strong> = (рабочая сила / население трудоспособного возраста) × 100%.<\/li>\n<li><strong>Продолжительность безработицы<\/strong> — сколько времени человек ищет работу.<\/li>\n<li><strong>Число зарегистрированных безработных<\/strong> в центрах занятости.<\/li>\n<\/ul>\n<p><strong>Естественный уровень безработицы<\/strong> = фрикционная + структурная безработица (при отсутствии циклической).<\/p>\n<p><strong>Закон Оукена:<\/strong> превышение фактической безработицы над естественной на 1% приводит к отставанию ВВП от потенциального примерно на 2–2,5%.<\/p>\n<p>В Казахстане уровень безработицы рассчитывает <strong>Бюро национальной статистики<\/strong>.<\/p>\n<p><em>Пример:<\/em> если в стране 10 млн человек рабочей силы, из них 500 тыс. безработных, то уровень безработицы — 5%.<\/p>", "k": ["Экономически неактивное население", "Занятые", "Безработные", "не имеют работы", "активно ищут работу", "готовы приступить к работе", "Уровень безработицы", "Уровень занятости", "Уровень участия в рабочей силе", "Продолжительность безработицы", "Число зарегистрированных безработных", "Естественный уровень безработицы", "Закон Оукена", "Бюро национальной статистики"], "s": "Занятые — лица, которые выполняют работу за вознаграждение или получают доход (работающие по найму, предприниматели, самозанятые)."}, {"n": 42, "q": "Каковы основные виды безработицы?", "a": "<p><strong>Безработица<\/strong> — социально-экономическое явление, при котором часть трудоспособного населения, желающего работать, не может найти работу.<\/p>\n<p><strong>Основные виды безработицы:<\/strong><\/p>\n<ul>\n<li><strong>Фрикционная<\/strong> — временная безработица, связанная с поиском новой работы, переездом, окончанием учёбы. <em>Пример:<\/em> выпускник колледжа ищет первую работу.<\/li>\n<li><strong>Структурная<\/strong> — возникает из-за изменений в структуре экономики, когда квалификация работников не соответствует требованиям рынка. <em>Пример:<\/em> кассиры теряют работу из-за внедрения касс самообслуживания.<\/li>\n<li><strong>Циклическая<\/strong> — вызвана спадом производства в экономике (кризисом). <em>Пример:<\/em> массовые сокращения во время кризиса.<\/li>\n<li><strong>Сезонная<\/strong> — зависит от времени года. <em>Пример:<\/em> работники в сельском хозяйстве, туризме, строительстве зимой.<\/li>\n<\/ul>\n<p><strong>Другие виды:<\/strong><\/p>\n<ul>\n<li><strong>Скрытая<\/strong> — формально человек работает, но фактически не занят (неполная занятость, вынужденные отпуска).<\/li>\n<li><strong>Добровольная<\/strong> — человек не хочет работать на предлагаемых условиях.<\/li>\n<li><strong>Вынужденная<\/strong> — человек хочет работать, но не может найти работу.<\/li>\n<li><strong>Застойная (длительная)<\/strong> — безработица больше года.<\/li>\n<\/ul>\n<p><strong>Последствия безработицы:<\/strong><\/p>\n<ul>\n<li>экономические — недопроизводство ВВП, снижение доходов и налогов;<\/li>\n<li>социальные — бедность, рост преступности, потеря квалификации, стресс.<\/li>\n<\/ul>\n<p><strong>Меры борьбы:<\/strong> создание рабочих мест, переобучение, поддержка предпринимательства, пособия по безработице.<\/p>", "k": ["Безработица", "Фрикционная", "Структурная", "Циклическая", "Сезонная", "Скрытая", "Добровольная", "Вынужденная", "Застойная (длительная)", "Меры борьбы"], "s": "Безработица — социально-экономическое явление, при котором часть трудоспособного населения, желающего работать, не может найти работу."}, {"n": 43, "q": "Что такое денежная система и какова структура денежной массы (денежные агрегаты М0, М1, М2)?", "a": "<p><strong>Денежная система<\/strong> — установленная законом форма организации денежного обращения в стране.<\/p>\n<p><strong>Элементы денежной системы:<\/strong><\/p>\n<ul>\n<li><strong>денежная единица<\/strong> (в Казахстане — тенге, 1 тенге = 100 тиын);<\/li>\n<li><strong>виды денежных знаков<\/strong> (банкноты, монеты, безналичные и цифровые деньги);<\/li>\n<li><strong>эмиссионная система<\/strong> — порядок выпуска денег (в РК выпускает Национальный Банк);<\/li>\n<li><strong>органы регулирования<\/strong> денежного обращения;<\/li>\n<li><strong>режим валютного курса.<\/strong><\/li>\n<\/ul>\n<p><strong>Денежная масса<\/strong> — совокупность наличных и безналичных денежных средств в экономике.<\/p>\n<p><strong>Денежные агрегаты<\/strong> — показатели денежной массы, различающиеся по степени ликвидности:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Агрегат<\/th>\n<th>Состав<\/th>\n<th>Ликвидность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>M0<\/strong><\/td>\n<td>Наличные деньги в обращении (банкноты и монеты вне банков)<\/td>\n<td>Самая высокая<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>M1<\/strong><\/td>\n<td>M0 + переводные депозиты (на текущих счетах, до востребования)<\/td>\n<td>Высокая<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>M2<\/strong><\/td>\n<td>M1 + другие депозиты (срочные, сберегательные)<\/td>\n<td>Ниже<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>M3<\/strong> (в некоторых методиках)<\/td>\n<td>M2 + ценные бумаги, крупные срочные вклады<\/td>\n<td>Самая низкая<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Ликвидность<\/strong> — способность актива быстро превратиться в наличные деньги без потерь.<\/p>\n<p><em>Пример:<\/em> деньги в кошельке входят в M0, деньги на карте — в M1, а срочный депозит на год — в M2.<\/p>", "k": ["Денежная система", "денежная единица", "виды денежных знаков", "эмиссионная система", "органы регулирования", "режим валютного курса", "Денежная масса", "Денежные агрегаты", "Ликвидность"], "s": "Денежная система — установленная законом форма организации денежного обращения в стране."}, {"n": 44, "q": "Каковы функции Национального банка в денежно-кредитной системе страны?", "a": "<p><strong>Национальный Банк Республики Казахстан<\/strong> — центральный банк страны, верхний уровень двухуровневой банковской системы. Подотчётен Президенту РК.<\/p>\n<p><strong>Главная цель<\/strong> — обеспечение стабильности цен.<\/p>\n<p><strong>Функции Национального Банка:<\/strong><\/p>\n<ul>\n<li><strong>Эмиссия денег<\/strong> — монопольное право выпуска национальной валюты (тенге).<\/li>\n<li><strong>Денежно-кредитная политика<\/strong> — управление базовой ставкой и денежной массой для контроля инфляции.<\/li>\n<li><strong>Банк банков<\/strong> — хранение резервов банков второго уровня, их кредитование, кредитор последней инстанции.<\/li>\n<li><strong>Банк Правительства<\/strong> — обслуживание государственных счетов, размещение государственных ценных бумаг.<\/li>\n<li><strong>Управление золотовалютными резервами<\/strong> и <strong>Национальным фондом<\/strong>.<\/li>\n<li><strong>Валютное регулирование<\/strong> и валютный контроль.<\/li>\n<li><strong>Организация платёжных систем<\/strong> — обеспечение межбанковских расчётов.<\/li>\n<li><strong>Обеспечение финансовой стабильности.<\/strong><\/li>\n<li><strong>Статистика<\/strong> — сбор и публикация денежно-кредитной статистики.<\/li>\n<\/ul>\n<p>С 2020 года надзор за банками осуществляет <strong>АРРФР<\/strong> (Агентство по регулированию и развитию финансового рынка).<\/p>\n<p><em>Пример:<\/em> Национальный Банк выпускает новые банкноты тенге и устанавливает базовую ставку, от которой зависят ставки по кредитам в банках.<\/p>", "k": ["Национальный Банк Республики Казахстан", "Главная цель", "Эмиссия денег", "Денежно-кредитная политика", "Банк банков", "Банк Правительства", "Управление золотовалютными резервами", "Национальным фондом", "Валютное регулирование", "Организация платёжных систем", "Обеспечение финансовой стабильности", "Статистика", "АРРФР"], "s": "Национальный Банк Республики Казахстан — центральный банк страны, верхний уровень двухуровневой банковской системы. Подотчётен Президенту РК."}, {"n": 45, "q": "В чем суть денежно-кредитной (монетарной) политики и каковы ее основные инструменты?", "a": "<p><strong>Денежно-кредитная (монетарная) политика<\/strong> — совокупность мер центрального банка по регулированию денежной массы, процентных ставок и кредита для обеспечения стабильности цен и экономического роста.<\/p>\n<p><strong>Цели:<\/strong><\/p>\n<ul>\n<li>стабильность цен (низкая инфляция);<\/li>\n<li>экономический рост;<\/li>\n<li>полная занятость;<\/li>\n<li>стабильность финансовой системы.<\/li>\n<\/ul>\n<p><strong>Типы монетарной политики:<\/strong><\/p>\n<ul>\n<li><strong>Стимулирующая (политика «дешёвых денег»)<\/strong> — увеличение денежной массы, снижение ставок. Применяется при спаде экономики.<\/li>\n<li><strong>Сдерживающая (политика «дорогих денег»)<\/strong> — сокращение денежной массы, повышение ставок. Применяется при высокой инфляции.<\/li>\n<\/ul>\n<p><strong>Основные инструменты:<\/strong><\/p>\n<ul>\n<li><strong>Базовая (учётная) ставка<\/strong> — ставка, по которой центральный банк кредитует банки. Её повышение удорожает кредиты и сдерживает инфляцию.<\/li>\n<li><strong>Операции на открытом рынке<\/strong> — покупка или продажа государственных ценных бумаг. Покупка увеличивает денежную массу, продажа — уменьшает.<\/li>\n<li><strong>Нормы обязательных резервов<\/strong> — доля средств, которую банки обязаны хранить в центральном банке. Повышение нормы уменьшает возможности банков выдавать кредиты.<\/li>\n<li><strong>Валютные интервенции<\/strong> — покупка или продажа иностранной валюты.<\/li>\n<\/ul>\n<p>В Казахстане с 2015 года Национальный Банк применяет режим <strong>инфляционного таргетирования<\/strong>.<\/p>\n<p><em>Пример:<\/em> при росте инфляции Национальный Банк повышает базовую ставку — кредиты дорожают, люди меньше тратят, рост цен замедляется.<\/p>", "k": ["Денежно-кредитная (монетарная) политика", "Стимулирующая (политика «дешёвых денег»)", "Сдерживающая (политика «дорогих денег»)", "Базовая (учётная) ставка", "Операции на открытом рынке", "Нормы обязательных резервов", "Валютные интервенции", "инфляционного таргетирования"], "s": "Денежно-кредитная (монетарная) политика — совокупность мер центрального банка по регулированию денежной массы, процентных ставок и кредита для обеспечения стабильности цен и экономического роста."}, {"n": 46, "q": "Понятие «мировая экономика» и назовите ее основные субъекты", "a": "<p><strong>Мировая экономика (мировое хозяйство)<\/strong> — совокупность национальных экономик всех стран мира, связанных между собой международным разделением труда и международными экономическими отношениями.<\/p>\n<p><strong>Основные субъекты мировой экономики:<\/strong><\/p>\n<ul>\n<li><strong>Национальные государства<\/strong> — главные субъекты; заключают договоры, регулируют внешнюю торговлю.<\/li>\n<li><strong>Транснациональные корпорации (ТНК)<\/strong> — крупные компании, работающие во многих странах (Apple, Toyota, Samsung).<\/li>\n<li><strong>Международные организации:<\/strong>\n<ul>\n<li><strong>финансовые<\/strong> — МВФ, Всемирный банк, ЕБРР;<\/li>\n<li><strong>торговые<\/strong> — ВТО (Всемирная торговая организация);<\/li>\n<li><strong>политико-экономические<\/strong> — ООН, ОЭСР.<\/li>\n<\/ul><\/li>\n<li><strong>Региональные интеграционные объединения<\/strong> — Евросоюз, Евразийский экономический союз (ЕАЭС), АСЕАН.<\/li>\n<li><strong>Международные банки и финансовые институты.<\/strong><\/li>\n<li><strong>Физические лица<\/strong> — участники международной миграции, туризма, инвестиций.<\/li>\n<\/ul>\n<p><strong>Структура мировой экономики:<\/strong> развитые страны, развивающиеся страны, страны с переходной экономикой.<\/p>\n<p><em>Пример:<\/em> Казахстан — член ВТО (с 2015 года) и ЕАЭС, сотрудничает с МВФ и Всемирным банком.<\/p>", "k": ["Мировая экономика (мировое хозяйство)", "Национальные государства", "Транснациональные корпорации (ТНК)", "Международные организации", "финансовые", "политико-экономические", "Региональные интеграционные объединения", "Международные банки и финансовые институты", "Физические лица", "Структура мировой экономики"], "s": "Мировая экономика (мировое хозяйство) — совокупность национальных экономик всех стран мира, связанных между собой международным разделением труда и международными экономическими отношениями."}, {"n": 47, "q": "Какие этапы развития прошла мировая экономика в XX–XXI века?", "a": "<p><strong>Основные этапы развития мировой экономики:<\/strong><\/p>\n<p><strong>1. Начало XX века – Первая мировая война (до 1918 г.)<\/strong><\/p>\n<ul>\n<li>окончательное формирование мирового хозяйства;<\/li>\n<li><strong>золотой стандарт<\/strong>, свободная торговля;<\/li>\n<li>колониальная система, господство европейских держав.<\/li>\n<\/ul>\n<p><strong>2. Межвоенный период (1918–1939 гг.)<\/strong><\/p>\n<ul>\n<li>разрушение мирового рынка после Первой мировой войны;<\/li>\n<li><strong>Великая депрессия (1929–1933 гг.)<\/strong> — крупнейший экономический кризис;<\/li>\n<li>рост протекционизма, отказ от золотого стандарта;<\/li>\n<li>формирование плановой экономики в СССР.<\/li>\n<\/ul>\n<p><strong>3. После Второй мировой войны (1945–1970-е гг.)<\/strong><\/p>\n<ul>\n<li><strong>Бреттон-Вудская валютная система<\/strong>, создание МВФ и Всемирного банка;<\/li>\n<li>раскол мира на капиталистическую и социалистическую системы;<\/li>\n<li>распад колониальной системы, появление развивающихся стран;<\/li>\n<li>быстрый экономический рост, начало европейской интеграции.<\/li>\n<\/ul>\n<p><strong>4. 1970–1980-е гг.<\/strong><\/p>\n<ul>\n<li>нефтяные кризисы, высокая инфляция;<\/li>\n<li>переход к плавающим валютным курсам (Ямайская система);<\/li>\n<li>научно-техническая революция, рост ТНК;<\/li>\n<li>«экономическое чудо» Японии и стран Юго-Восточной Азии.<\/li>\n<\/ul>\n<p><strong>5. 1990-е гг.<\/strong><\/p>\n<ul>\n<li>распад СССР, переход бывших социалистических стран к рынку;<\/li>\n<li>создание <strong>ВТО<\/strong> (1995 г.);<\/li>\n<li>ускорение <strong>глобализации<\/strong>, развитие интернета.<\/li>\n<\/ul>\n<p><strong>6. XXI век<\/strong><\/p>\n<ul>\n<li>быстрый рост <strong>Китая<\/strong> и других развивающихся стран;<\/li>\n<li>мировой финансовый кризис <strong>2008–2009 гг.<\/strong>;<\/li>\n<li><strong>цифровая экономика<\/strong>, искусственный интеллект;<\/li>\n<li>пандемия <strong>COVID-19<\/strong> (2020 г.);<\/li>\n<li>рост торговых конфликтов, санкций и перестройка цепочек поставок.<\/li>\n<\/ul>", "k": ["золотой стандарт", "Великая депрессия (1929–1933 гг.)", "Бреттон-Вудская валютная система", "ВТО", "глобализации", "Китая", "2008–2009 гг", "цифровая экономика", "COVID-19"], "s": "1. Начало XX века – Первая мировая война (до 1918 г.)"}, {"n": 48, "q": "В чем сущность международного разделения труда (МРТ)?", "a": "<p><strong>Международное разделение труда (МРТ)<\/strong> — специализация стран на производстве определённых товаров и услуг, которыми они обмениваются между собой.<\/p>\n<p><strong>Сущность<\/strong> — каждая страна производит то, что у неё получается лучше и дешевле, а остальное покупает у других стран.<\/p>\n<p><strong>Факторы МРТ:<\/strong><\/p>\n<ul>\n<li>природно-климатические условия;<\/li>\n<li>наличие природных ресурсов;<\/li>\n<li>размер территории и численность населения;<\/li>\n<li>уровень развития технологий;<\/li>\n<li>исторические традиции.<\/li>\n<\/ul>\n<p><strong>Теории МРТ:<\/strong><\/p>\n<ul>\n<li><strong>Теория абсолютных преимуществ (А. Смит)<\/strong> — страна должна производить товары, которые она производит с меньшими затратами, чем другие.<\/li>\n<li><strong>Теория сравнительных преимуществ (Д. Рикардо)<\/strong> — страна выигрывает, специализируясь на товаре, в котором у неё <strong>относительно<\/strong> меньшие издержки, даже если у неё нет абсолютного преимущества.<\/li>\n<\/ul>\n<p><strong>Формы МРТ:<\/strong><\/p>\n<ul>\n<li><strong>Межотраслевая специализация<\/strong> — страны специализируются на разных отраслях (сырьё — промышленность).<\/li>\n<li><strong>Внутриотраслевая специализация<\/strong> — специализация на отдельных видах продукции внутри отрасли.<\/li>\n<li><strong>Подетальная специализация<\/strong> — производство отдельных деталей (детали самолёта производят в разных странах).<\/li>\n<\/ul>\n<p><strong>Значение МРТ:<\/strong> повышение производительности, экономия ресурсов, расширение ассортимента товаров, развитие международной торговли.<\/p>\n<p><em>Пример:<\/em> Казахстан специализируется на экспорте нефти, урана, металлов и зерна, а импортирует машины, оборудование и электронику.<\/p>", "k": ["Международное разделение труда (МРТ)", "Сущность", "Теория абсолютных преимуществ (А. Смит)", "Теория сравнительных преимуществ (Д. Рикардо)", "относительно", "Межотраслевая специализация", "Внутриотраслевая специализация", "Подетальная специализация", "Значение МРТ"], "s": "Международное разделение труда (МРТ) — специализация стран на производстве определённых товаров и услуг, которыми они обмениваются между собой."}, {"n": 49, "q": "Что характеризует процесс экономической глобализации и каковы ее последствия для национальных экономик?", "a": "<p><strong>Экономическая глобализация<\/strong> — процесс усиления взаимосвязи и взаимозависимости национальных экономик, формирование единого мирового рынка товаров, услуг, капитала, труда и информации.<\/p>\n<p><strong>Признаки глобализации:<\/strong><\/p>\n<ul>\n<li>быстрый рост <strong>международной торговли<\/strong>;<\/li>\n<li>свободное движение <strong>капитала<\/strong> и инвестиций;<\/li>\n<li>деятельность <strong>транснациональных корпораций<\/strong>;<\/li>\n<li>развитие <strong>международных финансовых рынков<\/strong>;<\/li>\n<li><strong>информационная революция<\/strong> (интернет, цифровые технологии);<\/li>\n<li><strong>миграция<\/strong> рабочей силы;<\/li>\n<li>рост роли международных организаций (ВТО, МВФ).<\/li>\n<\/ul>\n<p><strong>Положительные последствия:<\/strong><\/p>\n<ul>\n<li>доступ к новым рынкам, технологиям и инвестициям;<\/li>\n<li>рост производительности и экономический рост;<\/li>\n<li>снижение цен и расширение выбора товаров;<\/li>\n<li>обмен знаниями и опытом.<\/li>\n<\/ul>\n<p><strong>Отрицательные последствия:<\/strong><\/p>\n<ul>\n<li><strong>рост зависимости<\/strong> от мировых рынков (кризис в одной стране распространяется на другие);<\/li>\n<li><strong>усиление неравенства<\/strong> между богатыми и бедными странами;<\/li>\n<li><strong>вытеснение национальных производителей<\/strong> иностранной конкуренцией;<\/li>\n<li>потеря части <strong>экономического суверенитета<\/strong>;<\/li>\n<li>экологические проблемы;<\/li>\n<li>«утечка мозгов».<\/li>\n<\/ul>\n<p><em>Пример:<\/em> падение мировых цен на нефть в 2015 и 2020 годах привело к ослаблению тенге и замедлению экономики Казахстана — это проявление зависимости от мирового рынка.<\/p>", "k": ["Экономическая глобализация", "международной торговли", "транснациональных корпораций", "международных финансовых рынков", "информационная революция", "рост зависимости", "усиление неравенства", "вытеснение национальных производителей", "экономического суверенитета"], "s": "Экономическая глобализация — процесс усиления взаимосвязи и взаимозависимости национальных экономик, формирование единого мирового рынка товаров, услуг, капитала, труда и информации."}, {"n": 50, "q": "По каким критериям страны мира делятся на развитые, развивающиеся и страны с переходной экономикой?", "a": "<p><strong>Критерии классификации стран:<\/strong><\/p>\n<ul>\n<li><strong>ВВП (ВНД) на душу населения<\/strong> — главный критерий;<\/li>\n<li><strong>структура экономики<\/strong> (доля промышленности, услуг, сельского хозяйства);<\/li>\n<li><strong>уровень и качество жизни населения<\/strong>;<\/li>\n<li><strong>Индекс человеческого развития (ИЧР)<\/strong> ООН — учитывает доходы, образование и продолжительность жизни;<\/li>\n<li><strong>тип экономической системы.<\/strong><\/li>\n<\/ul>\n<p><strong>Группы стран:<\/strong><\/p>\n<p><strong>1. Развитые страны<\/strong> (около 30–40 стран):<\/p>\n<ul>\n<li>высокий ВВП на душу населения;<\/li>\n<li>преобладание сферы услуг и высоких технологий;<\/li>\n<li>высокий уровень жизни и развитая социальная сфера;<\/li>\n<li><em>примеры:<\/em> США, Германия, Япония, Великобритания, Франция, Канада.<\/li>\n<\/ul>\n<p><strong>2. Развивающиеся страны<\/strong> (большинство стран мира):<\/p>\n<ul>\n<li>низкий или средний ВВП на душу населения;<\/li>\n<li>преобладание сельского хозяйства и добычи сырья;<\/li>\n<li>высокий рост населения, бедность;<\/li>\n<li>внутри группы различают <strong>новые индустриальные страны<\/strong> (Южная Корея, Сингапур), <strong>страны — экспортёры нефти<\/strong> (Саудовская Аравия), <strong>наименее развитые страны<\/strong> (Чад, Афганистан);<\/li>\n<li><em>примеры:<\/em> Индия, Бразилия, Египет, Нигерия.<\/li>\n<\/ul>\n<p><strong>3. Страны с переходной экономикой:<\/strong><\/p>\n<ul>\n<li>переходят от плановой (командной) к рыночной экономике;<\/li>\n<li><em>примеры:<\/em> страны бывшего СССР (Казахстан, Россия, Узбекистан), часть стран Восточной Европы.<\/li>\n<\/ul>\n<p>Также Всемирный банк делит страны по уровню доходов: <strong>высокий, выше среднего, ниже среднего, низкий<\/strong>. Казахстан относится к странам с доходом <strong>выше среднего<\/strong>.<\/p>", "k": ["ВВП (ВНД) на душу населения", "структура экономики", "уровень и качество жизни населения", "Индекс человеческого развития (ИЧР)", "тип экономической системы", "новые индустриальные страны", "страны — экспортёры нефти", "наименее развитые страны", "высокий, выше среднего, ниже среднего, низкий", "выше среднего"], "s": "Также Всемирный банк делит страны по уровню доходов: высокий, выше среднего, ниже среднего, низкий. Казахстан относится к странам с доходом выше среднего."}, {"n": 51, "q": "Какова роль научно-технического прогресса (НТП) в развитии мировой экономики XXI века?", "a": "<p><strong>Научно-технический прогресс (НТП)<\/strong> — постоянное развитие науки и техники и внедрение их достижений в производство и жизнь общества.<\/p>\n<p><strong>Научно-техническая революция (НТР)<\/strong> — коренной качественный скачок в развитии науки и техники.<\/p>\n<p><strong>Роль НТП в мировой экономике XXI века:<\/strong><\/p>\n<ul>\n<li><strong>главный фактор экономического роста<\/strong> — рост производительности труда за счёт новых технологий;<\/li>\n<li><strong>изменение структуры экономики<\/strong> — рост сферы услуг, высокотехнологичных отраслей;<\/li>\n<li><strong>формирование цифровой экономики<\/strong> — интернет, электронная торговля, цифровые платежи;<\/li>\n<li><strong>автоматизация и роботизация<\/strong> производства;<\/li>\n<li><strong>появление новых отраслей<\/strong> — IT, биотехнологии, возобновляемая энергетика;<\/li>\n<li><strong>ускорение глобализации<\/strong> — снижение затрат на связь и транспорт;<\/li>\n<li><strong>изменение рынка труда<\/strong> — исчезновение одних профессий и появление новых.<\/li>\n<\/ul>\n<p><strong>Ключевые направления НТП XXI века:<\/strong><\/p>\n<ul>\n<li><strong>искусственный интеллект<\/strong> и машинное обучение;<\/li>\n<li><strong>цифровизация<\/strong>, большие данные (Big Data), облачные технологии;<\/li>\n<li><strong>альтернативная энергетика<\/strong> (солнечная, ветровая);<\/li>\n<li><strong>биотехнологии<\/strong> и генная инженерия;<\/li>\n<li><strong>нанотехнологии<\/strong>, новые материалы;<\/li>\n<li><strong>электромобили<\/strong>, космические технологии.<\/li>\n<\/ul>\n<p><strong>Проблемы:<\/strong> технологический разрыв между развитыми и развивающимися странами, сокращение рабочих мест, киберугрозы.<\/p>\n<p><em>Пример:<\/em> в Казахстане развивается цифровизация госуслуг (eGov), онлайн-банкинг (Kaspi) и цифровой тенге.<\/p>", "k": ["Научно-технический прогресс (НТП)", "Научно-техническая революция (НТР)", "главный фактор экономического роста", "изменение структуры экономики", "формирование цифровой экономики", "автоматизация и роботизация", "появление новых отраслей", "ускорение глобализации", "изменение рынка труда", "искусственный интеллект", "цифровизация", "альтернативная энергетика", "биотехнологии", "нанотехнологии"], "s": "Научно-технический прогресс (НТП) — постоянное развитие науки и техники и внедрение их достижений в производство и жизнь общества."}, {"n": 52, "q": "Что представляет собой природно-ресурсный потенциал мирового хозяйства?", "a": "<p><strong>Природно-ресурсный потенциал<\/strong> — совокупность природных ресурсов, которые используются или могут быть использованы в хозяйственной деятельности.<\/p>\n<p><strong>Природные ресурсы<\/strong> — элементы природы, которые человек использует для удовлетворения своих потребностей.<\/p>\n<p><strong>Классификация природных ресурсов:<\/strong><\/p>\n<p><strong>1. По происхождению:<\/strong><\/p>\n<ul>\n<li><strong>минеральные<\/strong> (нефть, газ, уголь, металлические руды);<\/li>\n<li><strong>земельные<\/strong>;<\/li>\n<li><strong>водные<\/strong>;<\/li>\n<li><strong>лесные<\/strong>;<\/li>\n<li><strong>биологические<\/strong> (растительный и животный мир);<\/li>\n<li><strong>климатические и рекреационные.<\/strong><\/li>\n<\/ul>\n<p><strong>2. По исчерпаемости:<\/strong><\/p>\n<ul>\n<li><strong>Исчерпаемые:<\/strong>\n<ul>\n<li><strong>невозобновимые<\/strong> — полезные ископаемые (нефть, уголь, газ);<\/li>\n<li><strong>возобновимые<\/strong> — леса, почва, животный мир (могут восстанавливаться).<\/li>\n<\/ul><\/li>\n<li><strong>Неисчерпаемые<\/strong> — энергия солнца, ветра, приливов.<\/li>\n<\/ul>\n<p><strong>Ресурсообеспеченность<\/strong> — соотношение запасов природных ресурсов и объёмов их использования. Измеряется в годах (на сколько лет хватит ресурса) или в расчёте на душу населения.<\/p>\n<p><strong>Значение:<\/strong> природные ресурсы — основа развития мировой экономики, особенно для стран-экспортёров сырья.<\/p>\n<p><strong>Проблемы:<\/strong> истощение ресурсов, загрязнение окружающей среды, неравномерное распределение ресурсов между странами.<\/p>\n<p><em>Пример:<\/em> Казахстан обладает богатым природно-ресурсным потенциалом — крупными запасами нефти, газа, урана, угля, хрома и других металлов.<\/p>", "k": ["Природно-ресурсный потенциал", "Природные ресурсы", "минеральные", "земельные", "биологические", "климатические и рекреационные", "Исчерпаемые", "невозобновимые", "возобновимые", "Неисчерпаемые", "Ресурсообеспеченность", "Значение", "Проблемы"], "s": "Природно-ресурсный потенциал — совокупность природных ресурсов, которые используются или могут быть использованы в хозяйственной деятельности."}, {"n": 53, "q": "Как распределены минерально-сырьевые ресурсы между регионами мира?", "a": "<p><strong>Минерально-сырьевые ресурсы<\/strong> — полезные ископаемые, используемые в экономике. Они распределены по планете <strong>неравномерно<\/strong>.<\/p>\n<p><strong>Топливные ресурсы:<\/strong><\/p>\n<ul>\n<li><strong>Нефть<\/strong> — крупнейшие запасы: <strong>Ближний Восток<\/strong> (Саудовская Аравия, Иран, Ирак, ОАЭ, Кувейт), <strong>Венесуэла<\/strong>, <strong>Канада<\/strong>, <strong>Россия<\/strong>; значительные запасы в <strong>Казахстане<\/strong>.<\/li>\n<li><strong>Природный газ<\/strong> — <strong>Россия<\/strong>, <strong>Иран<\/strong>, <strong>Катар<\/strong>, <strong>Туркменистан<\/strong>, США.<\/li>\n<li><strong>Уголь<\/strong> — <strong>США<\/strong>, <strong>Китай<\/strong>, <strong>Россия<\/strong>, <strong>Австралия<\/strong>, <strong>Индия<\/strong>, Казахстан.<\/li>\n<li><strong>Уран<\/strong> — <strong>Австралия<\/strong>, <strong>Казахстан<\/strong> (крупнейший в мире производитель урана), Канада, Россия.<\/li>\n<\/ul>\n<p><strong>Рудные ресурсы:<\/strong><\/p>\n<ul>\n<li><strong>Железная руда<\/strong> — Австралия, Бразилия, Россия, Китай.<\/li>\n<li><strong>Медь<\/strong> — <strong>Чили<\/strong>, Перу, Австралия, Казахстан.<\/li>\n<li><strong>Алюминиевое сырьё (бокситы)<\/strong> — Гвинея, Австралия, Бразилия.<\/li>\n<li><strong>Золото<\/strong> — Австралия, ЮАР, Россия, Китай.<\/li>\n<li><strong>Хром<\/strong> — <strong>ЮАР<\/strong>, <strong>Казахстан<\/strong>.<\/li>\n<\/ul>\n<p><strong>Закономерности размещения:<\/strong><\/p>\n<ul>\n<li><strong>осадочного происхождения<\/strong> (нефть, газ, уголь) — на равнинах, в прогибах;<\/li>\n<li><strong>рудные<\/strong> — в горах и на древних щитах.<\/li>\n<\/ul>\n<p><strong>Значение:<\/strong> неравномерное распределение ресурсов определяет международное разделение труда и мировую торговлю сырьём.<\/p>\n<p><em>Пример:<\/em> страны Персидского залива являются главными экспортёрами нефти, а Япония, почти не имея своих ресурсов, импортирует большую часть сырья.<\/p>", "k": ["Минерально-сырьевые ресурсы", "неравномерно", "Нефть", "Ближний Восток", "Венесуэла", "Канада", "Россия", "Казахстане", "Природный газ", "Иран", "Катар", "Туркменистан", "Уголь", "США"], "s": "Минерально-сырьевые ресурсы — полезные ископаемые, используемые в экономике. Они распределены по планете неравномерно."}, {"n": 54, "q": "Какова роль земельных и водно-энергетических ресурсов в мировой экономике?", "a": "<p><strong>Земельные ресурсы<\/strong> — земли, используемые в хозяйстве. Это основа сельского хозяйства, а также место для размещения городов, промышленности и транспорта.<\/p>\n<p><strong>Структура мирового земельного фонда:<\/strong><\/p>\n<ul>\n<li><strong>сельскохозяйственные угодья<\/strong> (пашни, пастбища) — около трети суши;<\/li>\n<li><strong>леса<\/strong> — около трети;<\/li>\n<li><strong>малопродуктивные земли<\/strong> (пустыни, ледники, горы) и земли под поселениями и промышленностью.<\/li>\n<\/ul>\n<p><strong>Роль земельных ресурсов:<\/strong> обеспечение продовольственной безопасности, производство сырья для лёгкой и пищевой промышленности.<\/p>\n<p><strong>Проблемы:<\/strong> опустынивание, эрозия почв, сокращение площади пашни на душу населения из-за роста населения.<\/p>\n<p><strong>Водные ресурсы<\/strong> — поверхностные и подземные воды, пригодные для использования. Пресная вода составляет лишь около <strong>2,5%<\/strong> всех водных запасов Земли.<\/p>\n<p><strong>Роль водных ресурсов:<\/strong><\/p>\n<ul>\n<li>питьевое водоснабжение;<\/li>\n<li><strong>орошение<\/strong> в сельском хозяйстве — главный потребитель воды;<\/li>\n<li>промышленность;<\/li>\n<li>транспорт.<\/li>\n<\/ul>\n<p><strong>Проблема:<\/strong> дефицит пресной воды во многих регионах (Ближний Восток, Центральная Азия, Африка).<\/p>\n<p><strong>Водно-энергетические (гидроэнергетические) ресурсы<\/strong> — энергия рек, используемая на ГЭС. Это <strong>возобновляемый<\/strong> и экологически более чистый источник энергии. Крупнейшие гидроэнергетические потенциалы — у Китая, России, Бразилии, Канады, США.<\/p>\n<p><em>Пример:<\/em> в Казахстане проблема воды стоит остро — высыхание Аральского моря, зависимость от рек, приходящих из соседних стран; работают ГЭС на Иртыше (Бухтарминская, Шульбинская).<\/p>", "k": ["Земельные ресурсы", "сельскохозяйственные угодья", "малопродуктивные земли", "Роль земельных ресурсов", "Проблемы", "Водные ресурсы", "2,5%", "Проблема", "возобновляемый"], "s": "Земельные ресурсы — земли, используемые в хозяйстве. Это основа сельского хозяйства, а также место для размещения городов, промышленности и транспорта."}, {"n": 55, "q": "Что такое демографический потенциал и трудовые ресурсы мирового хозяйства?", "a": "<p><strong>Демографический потенциал<\/strong> — численность и качество населения, которое является основой экономического развития.<\/p>\n<p><strong>Основные показатели:<\/strong><\/p>\n<ul>\n<li><strong>численность населения<\/strong> — более <strong>8 млрд человек<\/strong> (крупнейшие по населению — Индия и Китай);<\/li>\n<li><strong>естественный прирост<\/strong> = рождаемость − смертность;<\/li>\n<li><strong>возрастная и половая структура<\/strong>;<\/li>\n<li><strong>продолжительность жизни<\/strong>;<\/li>\n<li><strong>уровень образования<\/strong> и урбанизации.<\/li>\n<\/ul>\n<p><strong>Типы воспроизводства населения:<\/strong><\/p>\n<ul>\n<li><strong>Первый тип<\/strong> — низкая рождаемость, низкая смертность, низкий прирост; характерен для развитых стран (Европа, Япония); проблема — <strong>старение населения<\/strong>.<\/li>\n<li><strong>Второй тип<\/strong> — высокая рождаемость, снижающаяся смертность, высокий прирост; характерен для развивающихся стран (Африка, Южная Азия); проблема — <strong>демографический взрыв<\/strong>.<\/li>\n<\/ul>\n<p><strong>Трудовые ресурсы<\/strong> — часть населения, способная к труду по возрасту и здоровью.<\/p>\n<p><strong>Экономически активное население<\/strong> — люди, которые работают или ищут работу.<\/p>\n<p><strong>Особенности трудовых ресурсов мира:<\/strong><\/p>\n<ul>\n<li>неравномерное распределение: большая часть — в развивающихся странах;<\/li>\n<li>различия в <strong>квалификации<\/strong> и <strong>производительности труда<\/strong>;<\/li>\n<li><strong>международная трудовая миграция<\/strong> — из бедных стран в богатые.<\/li>\n<\/ul>\n<p><strong>Человеческий капитал<\/strong> — знания, навыки и здоровье людей, которые повышают производительность труда.<\/p>\n<p><em>Пример:<\/em> в Казахстане население превышает 20 млн человек; страна принимает трудовых мигрантов из соседних стран, а часть казахстанцев уезжает работать за рубеж.<\/p>", "k": ["Демографический потенциал", "численность населения", "8 млрд человек", "естественный прирост", "возрастная и половая структура", "продолжительность жизни", "уровень образования", "Первый тип", "старение населения", "Второй тип", "демографический взрыв", "Трудовые ресурсы", "Экономически активное население", "квалификации"], "s": "Демографический потенциал — численность и качество населения, которое является основой экономического развития."}, {"n": 56, "q": "Каковы основные формы международных экономических отношений?", "a": "<p><strong>Международные экономические отношения (МЭО)<\/strong> — система хозяйственных связей между странами, их компаниями и организациями.<\/p>\n<p><strong>Основные формы МЭО:<\/strong><\/p>\n<ul>\n<li><strong>Международная торговля товарами и услугами<\/strong> — экспорт и импорт; главная и старейшая форма.<\/li>\n<li><strong>Международное движение капитала<\/strong> — иностранные инвестиции и международные кредиты:\n<ul>\n<li><strong>прямые инвестиции<\/strong> — вложения в предприятия с правом контроля;<\/li>\n<li><strong>портфельные инвестиции<\/strong> — покупка ценных бумаг без контроля;<\/li>\n<li><strong>кредиты и займы.<\/strong><\/li>\n<\/ul><\/li>\n<li><strong>Международная миграция рабочей силы<\/strong> — перемещение людей в другие страны для работы.<\/li>\n<li><strong>Международные валютно-финансовые отношения<\/strong> — обмен валют, международные расчёты, валютные рынки.<\/li>\n<li><strong>Международное научно-техническое сотрудничество<\/strong> — обмен технологиями, лицензиями, патентами, ноу-хау.<\/li>\n<li><strong>Международная экономическая интеграция<\/strong> — объединение экономик нескольких стран (ЕС, ЕАЭС).<\/li>\n<li><strong>Международный туризм<\/strong> и транспортные услуги.<\/li>\n<\/ul>\n<p><em>Пример:<\/em> Казахстан экспортирует нефть в Европу (торговля), привлекает инвестиции Chevron в Тенгиз (движение капитала) и является членом ЕАЭС (интеграция).<\/p>", "k": ["Международные экономические отношения (МЭО)", "Международная торговля товарами и услугами", "Международное движение капитала", "прямые инвестиции", "портфельные инвестиции", "кредиты и займы", "Международная миграция рабочей силы", "Международные валютно-финансовые отношения", "Международная экономическая интеграция", "Международный туризм"], "s": "Международные экономические отношения (МЭО) — система хозяйственных связей между странами, их компаниями и организациями."}, {"n": 57, "q": "Что такое мировой рынок и чем определяется международная торговля товарами и услугами?", "a": "<p><strong>Мировой рынок<\/strong> — сфера устойчивых товарно-денежных отношений между странами, основанная на международном разделении труда.<\/p>\n<p><strong>Международная торговля<\/strong> — обмен товарами и услугами между странами.<\/p>\n<ul>\n<li><strong>Экспорт<\/strong> — продажа товаров за рубеж.<\/li>\n<li><strong>Импорт<\/strong> — покупка товаров из-за рубежа.<\/li>\n<li><strong>Внешнеторговый оборот<\/strong> = экспорт + импорт.<\/li>\n<li><strong>Сальдо торгового баланса<\/strong> = экспорт − импорт (положительное — профицит, отрицательное — дефицит).<\/li>\n<\/ul>\n<p><strong>Чем определяется (причины) международной торговли:<\/strong><\/p>\n<ul>\n<li><strong>неравномерное распределение природных ресурсов<\/strong>;<\/li>\n<li><strong>международное разделение труда<\/strong> и специализация;<\/li>\n<li><strong>различия в издержках производства<\/strong> (сравнительные преимущества);<\/li>\n<li>различия в технологиях;<\/li>\n<li><strong>эффект масштаба<\/strong> — дешевле производить больше и продавать в разных странах;<\/li>\n<li>стремление потребителей к <strong>разнообразию<\/strong> товаров.<\/li>\n<\/ul>\n<p><strong>Структура мировой торговли:<\/strong><\/p>\n<ul>\n<li><strong>товары<\/strong> — машины и оборудование, топливо, сырьё, продовольствие, химическая продукция;<\/li>\n<li><strong>услуги<\/strong> — транспорт, туризм, финансовые, IT-услуги (быстро растущая часть).<\/li>\n<\/ul>\n<p><strong>Регулирование:<\/strong> <strong>ВТО<\/strong> — устанавливает правила мировой торговли.<\/p>\n<p><em>Пример:<\/em> Казахстан экспортирует в основном нефть, металлы и зерно, а импортирует машины, оборудование, электронику и потребительские товары.<\/p>", "k": ["Мировой рынок", "Международная торговля", "Экспорт", "Импорт", "Внешнеторговый оборот", "Сальдо торгового баланса", "международное разделение труда", "различия в издержках производства", "эффект масштаба", "разнообразию", "Регулирование", "ВТО"], "s": "Мировой рынок — сфера устойчивых товарно-денежных отношений между странами, основанная на международном разделении труда."}, {"n": 58, "q": "В чем разница между политикой протекционизма и свободной торговли (фритрейдерства)?", "a": "<p><strong>Внешнеторговая политика<\/strong> — меры государства по регулированию внешней торговли.<\/p>\n<p><strong>Протекционизм<\/strong> — политика <strong>защиты внутреннего рынка<\/strong> от иностранной конкуренции.<\/p>\n<p><strong>Инструменты протекционизма:<\/strong><\/p>\n<ul>\n<li><strong>Тарифные<\/strong> — таможенные (ввозные) пошлины.<\/li>\n<li><strong>Нетарифные<\/strong> — квоты (ограничение объёма импорта), лицензирование, эмбарго (запрет), технические стандарты, субсидии местным производителям.<\/li>\n<\/ul>\n<p><strong>Аргументы в пользу протекционизма:<\/strong><\/p>\n<ul>\n<li>защита молодых национальных отраслей;<\/li>\n<li>сохранение рабочих мест;<\/li>\n<li>национальная безопасность;<\/li>\n<li>пополнение бюджета за счёт пошлин.<\/li>\n<\/ul>\n<p><strong>Свободная торговля (фритрейдерство)<\/strong> — политика <strong>минимального вмешательства<\/strong> государства во внешнюю торговлю, отмена пошлин и ограничений.<\/p>\n<p><strong>Аргументы в пользу свободной торговли:<\/strong><\/p>\n<ul>\n<li>конкуренция повышает качество и снижает цены;<\/li>\n<li>более широкий выбор товаров для потребителей;<\/li>\n<li>эффективное использование ресурсов на основе сра
