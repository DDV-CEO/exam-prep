внительных преимуществ;<\/li>\n<li>рост экспорта и экономики.<\/li>\n<\/ul>\n<p><strong>Сравнение:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Признак<\/th>\n<th>Протекционизм<\/th>\n<th>Свободная торговля<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Цель<\/td>\n<td>Защита внутреннего рынка<\/td>\n<td>Развитие обмена между странами<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Пошлины<\/td>\n<td>Высокие<\/td>\n<td>Низкие или отсутствуют<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Плюсы<\/td>\n<td>Защита национальных производителей<\/td>\n<td>Низкие цены, конкуренция, выбор<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Минусы<\/td>\n<td>Высокие цены, низкая конкуренция<\/td>\n<td>Угроза для слабых отраслей<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>На практике страны сочетают обе политики. ВТО способствует снижению торговых барьеров.<\/p>\n<p><em>Пример:<\/em> внутри ЕАЭС товары перемещаются без пошлин (свободная торговля), а на ввоз некоторых товаров из третьих стран действуют пошлины (протекционизм).<\/p>", "k": ["Внешнеторговая политика", "Протекционизм", "защиты внутреннего рынка", "Тарифные", "Нетарифные", "Свободная торговля (фритрейдерство)", "минимального вмешательства"], "s": "Внешнеторговая политика — меры государства по регулированию внешней торговли."}, {"n": 59, "q": "Какую роль играют транснациональные корпорации (ТНК) в мировой экономике?", "a": "<p><strong>Транснациональная корпорация (ТНК)<\/strong> — крупная компания, которая владеет производственными и торговыми подразделениями (филиалами) в нескольких странах, при этом управление осуществляется из головного центра в одной стране.<\/p>\n<p><strong>Признаки ТНК:<\/strong><\/p>\n<ul>\n<li>производство и продажи во многих странах;<\/li>\n<li>огромные финансовые ресурсы;<\/li>\n<li>единая стратегия управления;<\/li>\n<li>международная структура собственности и персонала.<\/li>\ /* ---------- storage (safe) ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } }
};

/* ---------- spaced repetition (Leitner-style) ---------- */
const DAY = 864e5;
const INTERVALS = [0, 1, 3, 7, 14, 30]; // days for box 0..5
function state(sid){
  const st = store.get("p_" + sid, {});
  return Object.assign({ cards:{}, exams:[], examDate:"", streak:{last:"",count:0}, daily:{}, routine:{}, perDay:10 }, st);
}
const dayStr = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
function save(sid, st){ store.set("p_" + sid, st); }
function card(st, n){ return st.cards[n] || { box:0, due:0, seen:0, right:0, wrong:0, last:0 }; }
function level(c){ if(!c.seen) return "new"; if(c.box >= 3) return "good"; if(c.box >= 1) return "mid"; return "bad"; }
function grade(sid, n, g){ // g: 0 не помню, 1 частично, 2 помню
  const st = state(sid); const c = card(st, n); const now = Date.now();
  const sameDay = c.last && dayStr(c.last) === dayStr(now) && c.box > 0;
  if(!c.first) c.first = dayStr(now);
  c.seen++; c.last = now;
  if(g === 2 && sameDay){ c.right++; c.due = Math.max(c.due, now + DAY); } // повтор в тот же день не «перепрыгивает» интервалы
  else if(g === 2){ c.box = Math.min(5, c.box + 1); c.right++; c.due = now + INTERVALS[c.box] * DAY; }
  else if(g === 1){ c.box = Math.max(1, Math.min(c.box, 2)); c.due = now + DAY; }
  else { c.box = 0; c.wrong++; c.due = now + 10 * 60e3; }
  st.cards[n] = c;
  const today = dayStr();
  st.daily[today] = (st.daily[today] || 0) + 1;
  if(st.streak.last !== today){
    const y = dayStr(now - DAY);
    st.streak.count = st.streak.last === y ? st.streak.count + 1 : 1;
    st.streak.last = today;
  }
  save(sid, st);
}
function counts(sid){
  const st = state(sid); const r = { new:0, bad:0, mid:0, good:0, due:0 };
  subj(sid).questions.forEach(q => { const c = card(st, q.n); r[level(c)]++; if(c.seen && c.due <= Date.now()) r.due++; });
  return r;
}
/* probability all 10 random tickets are from the "known" set (hypergeometric) */
function comb(n,k){ if(k<0||k>n) return 0; let r=1; for(let i=1;i<=k;i++) r = r*(n-k+i)/i; return r; }
function pAll(known, total=60, draw=10){ return comb(known, draw) / comb(total, draw); }
function readiness(sid){
  const st = state(sid); let score = 0;
  subj(sid).questions.forEach(q => { const c = card(st, q.n); score += c.seen ? [0.15,0.45,0.65,0.85,0.95,1][c.box] : 0; });
  return score / 60;
}
function predictedGrade(r){ return r >= .9 ? 5 : r >= .75 ? 4 : r >= .5 ? 3 : 2; }

  const close=()=>{ m.hidden=true; m.style.display="none"; }; $("#modal-no").onclick=close; $("#modal-yes").onclick=()=>{ close(); onYes(); }; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1800); }
function plural(n, a, b, c){ n = Math.abs(n) % 100; const n1 = n % 10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
const stem = w => w.toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9]/g,"").slice(0, Math.max(4, Math.min(6, w.length - 2)));
function termHit(term, text){
  const t = text.toLowerCase().replace(/ё/g,"е");
  const words = term.split(/[\s\-–—(),«»"\/]+/).filter(w => w.replace(/[^a-zа-яё0-9]/gi,"").length >= 3);
  if(!words.length) return false;
  const hits = words.filter(w => t.includes(stem(w))).length;
  return hits / words.length >= 0.6;
}
function ringSVG(v, size=84){
  const r = 34, c = 2*Math.PI*r, off = c*(1-v);
  return `<svg class="ring" viewBox="0 0 84 84" style="width:${size}px;height:${size}px"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--soft)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${Math.round(v*100)}%</text></svg>`;
}
function distBar(cn){
  const t = 60, seg = (n, cls) => n ? `<i class="${cls}" style="width:${n/t*100}%"></i>` : "";

}

function dailyPlan(sid){
  const st = state(sid), cn = counts(sid);

  if(st.examDate){ daysLeft = Math.ceil((new Date(st.examDate + "T09:00") - Date.now()) / DAY); }
  const learnDays = daysLeft ? Math.max(1, daysLeft - 1) : null; // последний день — только повторение
  const needed = learnDays ? Math.ceil(cn.new / learnDays) : 0;
  const learnedToday = learnedOn(sid, dayStr()).length;
  const newPerDay = Math.max(0, Math.min(cn.new, st.perDay - learnedToday));
  return { daysLeft, newPerDay, due: cn.due, needed, perDay: st.perDay, learnedToday };
}
/* вопросы, впервые изученные в указанный день */
function learnedOn(sid, day){ const st = state(sid); return subj(sid).questions.filter(q => card(st,q.n).first === day).map(q => q.n); }
/* последний учебный день до сегодня (если вчера пропустил — берётся предыдущий) */

  return days[days.length - 1] || null;
}

/* ---------- session queue ---------- */
function buildQueue(kind){
  const s = subj(S), st = state(S), now = Date.now();
  const qs = s.questions;
  if(kind === "today"){
    const due = qs.filter(q => { const c = card(st,q.n); return c.seen && c.due <= now; });
    return shuffle(due).map(q => q.n);
  }
  if(kind === "learn") return qs.filter(q => !card(st,q.n).seen).slice(0, dailyPlan(S).newPerDay).map(q => q.n); // по порядку программы
  if(kind === "morning"){ const d = prevStudyDay(S); return d ? shuffle(learnedOn(S, d)) : []; }
  if(kind === "evening") return shuffle(learnedOn(S, dayStr()));
  if(kind === "weak"){
    const w = qs.filter(q => { const c = card(st,q.n); return c.seen && c.box < 3; });
    return shuffle(w).map(q => q.n);
  }
  return shuffle(qs).map(q => q.n);
}
function startSession(kind, mode){
  const queue = buildQueue(kind);
  if(!queue.length){ toast(kind === "weak" ? "Слабых вопросов нет" : "Нечего повторять"); return; }
  session = { kind, queue, i:0, results:[], revealed:false, hints:false, again:[], phase: kind === "learn" ? "read" : "recall" };
  go(`#${S}-${mode || "study"}`);
  if(location.hash === `#${S}-${mode || "study"}`) route();
}

}

  $("#app").innerHTML = `<div class="fade">
    <div class="card"><div class="row" style="align-items:center"><div><div class="label">Твой билет</div><div class="stat" style="font-size:20px">${exam.qs.length} вопросов</div></div>
    <div style="text-align:right"><div class="label">${exam.minutes ? "Осталось" : "Таймер выключен"}</div><div id="tm" style="font-size:20px">${examTimer()}</div></div></div></div>
    <div class="card">${exam.qs.map((n,i) => { const q = s.questions.find(x => x.n === n); return `<div class="list-item" style="cursor:default"><span class="n">${i+1}.</span><span class="q">${esc(q.q)}</span></div>`; }).join("")}</div>
    <p class="note">Подготовься как на реальном экзамене: набросай план ответа на каждый вопрос на бумаге. Когда будешь готов, переходи к проверке.</p>
    <button class="btn primary mt" onclick="exam.phase='check';exam.i=0;renderExam()">Перейти к проверке</button>
    <button class="btn ghost mt" onclick="ask('Прервать экзамен?',()=>{exam=null;renderExam()})">Прервать</button>
  </div>`;
  if(exam.minutes){ timerInt = setInterval(() => { const t = $("#tm"); if(t) t.innerHTML = examTimer(); else clearInterval(timerInt); }, 1000); }
}
function renderExamCheck(){
  clearInterval(timerInt);
  const q = subj(S).questions.find(x => x.n === exam.qs[exam.i]);
  const open = exam.open;
  $("#app").innerHTML = `<div class="fade">
    <div class="progress-top"><div class="bar"><i style="width:${exam.i/10*100}%;background:var(--acc)"></i></div><span class="label">${exam.i+1} / 10</span></div>
    <div class="card"><div class="qnum">Вопрос ${q.n}</div><div class="qtext">${esc(q.q)}</div>
    ${open ? "" : `<div class="hint mt">Ответь вслух полностью, как преподавателю, и только потом открой эталон.</div>`}</div>
    ${open ? `<div class="card answer">${q.a}</div>
      <div class="label mt mb center">Как бы ты ответил на экзамене?</div>
      <div class="grades">
        <button class="g-bad" onclick="examGrade(0)">Не ответил<span>2</span></button>
        <button class="g-mid" onclick="examGrade(1)">Частично<span>3–4</span></button>
        <button class="g-good" onclick="examGrade(2)">Полностью<span>5</span></button>
      </div>` : `<button class="btn primary mt" onclick="exam.open=true;renderExam()">Показать эталон</button>`}
  </div>`;
}
function examGrade(g){
  exam.grades.push(g); grade(S, exam.qs[exam.i], g); exam.open = false; exam.i++;
  if(exam.i >= exam.qs.length){
    exam.phase = "result";
    const good = exam.grades.filter(x=>x===2).length, mid = exam.grades.filter(x=>x===1).length, bad = exam.grades.filter(x=>x===0).length;
    const score = (good + mid*0.5) / 10;
    exam.result = { good, mid, bad, grade: score >= .9 ? 5 : score >= .7 ? 4 : score >= .5 ? 3 : 2, date: Date.now() };
    const st = state(S); st.exams.push(exam.result); save(S, st);
  }
  renderExam(); window.scrollTo(0,0);
}
function renderExamResult(){
  const r = exam.result, s = subj(S);
  const weak = exam.qs.filter((n,i) => exam.grades[i] < 2);
  const msg = { 5:"Отлично. Так держать: повторяй по плану, чтобы не забыть.", 4:"Хорошо. Доведи частично знакомые вопросы до уверенных.", 3:"Удовлетворительно. Сосредоточься на слабых вопросах ниже.", 2:"Пока не сдано. Начни с ежедневной тренировки и вернись к экзамену через пару дней." }[r.grade];
  $("#app").innerHTML = `<div class="fade">
    <div class="card center"><div class="label">Оценка за пробный экзамен</div><div class="big-grade" style="color:${r.grade>=4?"var(--good)":r.grade===3?"var(--mid)":"var(--bad)"}">${r.grade}</div>
    <div class="note">Полностью ${r.good} · частично ${r.mid} · не ответил ${r.bad}</div><p class="sub mt" style="margin:12px 0 0">${msg}</p></div>
    ${weak.length ? `<h3>Что подтянуть</h3><div class="card">${weak.map(n => { const q = s.questions.find(x=>x.n===n); return `<button class="list-item" onclick="go('#${S}-q-${n}')"><span class="n">${n}</span><span class="q">${esc(q.q)}</span></button>`; }).join("")}</div>` : ""}
    <button class="btn primary mt" onclick="exam=null;renderExam()">Ещё один экзамен</button>
    <button class="btn mt" onclick="exam=null;go('#${S}-home')">На главную</button>
  </div>`;
}

/* ---------- list & question ---------- */
let listFilter = "all", listQuery = "";
function renderList(){
  setTop("Все вопросы", `go('#${S}-home')`);
  const st = state(S), qs = subj(S).questions;
  const f = { all:()=>true, new:c=>level(c)==="new", weak:c=>["bad","mid"].includes(level(c)), good:c=>level(c)==="good" };
  const items = qs.filter(q => f[listFilter](card(st,q.n)) && (!listQuery || (q.n + " " + q.q).toLowerCase().includes(listQuery.toLowerCase())));
  const colors = { new:"c-new", bad:"c-bad", mid:"c-mid", good:"c-good" };
  $("#app").innerHTML = `<div class="fade">
    <input class="search" id="search" placeholder="Поиск по вопросам" value="${esc(listQuery)}">
    <p class="note" style="margin:-4px 0 12px">Статус вопроса ставится сам по твоим ответам в тренировках. Чтобы отметить вручную, открой вопрос.</p>
    <div class="seg">${[["all","Все"],["new","Новые"],["weak","Учу"],["good","Знаю"]].map(([k,l]) => `<button class="${listFilter===k?"on":""}" onclick="listFilter='${k}';renderList()">${l}</button>`).join("")}</div>
    <div class="card" style="padding:4px 12px">${items.length ? items.map(q => `<button class="list-item" onclick="go('#${S}-q-${q.n}')"><span class="n">${q.n}</span><span class="q">${esc(q.q)}</span><span class="dot ${colors[level(card(st,q.n))]}"></span></button>`).join("") : '<p class="label" style="padding:12px 0">Ничего не найдено</p>'}</div>
  </div>`;
  const inp = $("#search"); inp.addEventListener("input", () => { listQuery = inp.value; const pos = inp.selectionStart; renderList(); const n = $("#search"); n.focus(); n.setSelectionRange(pos,pos); });
}
function setLevel(n, lv){
  const st = state(S), now = Date.now();
  if(lv === "new"){ delete st.cards[n]; save(S, st); renderQuestion(n); toast("Статус сброшен"); return; }
  const c = card(st, n);
  if(!c.first) c.first = "manual"; // ручная отметка не попадает в утреннее/вечернее повторение
  c.seen = Math.max(1, c.seen); c.last = now;
  if(lv === "good"){ c.box = Math.max(3, c.box); c.due = now + 7 * DAY; }
  if(lv === "mid"){ c.box = Math.min(Math.max(1, c.box), 2); c.due = now + DAY; }
  if(lv === "bad"){ c.box = 0; c.due = now; }
  st.cards[n] = c; save(S, st); renderQuestion(n);
  toast({good:"Отмечено: знаю", mid:"Отмечено: учу", bad:"Отмечено: не знаю"}[lv]);
}
function renderQuestion(n){
  n = +n; const s = subj(S), q = s.questions.find(x => x.n === n), c = card(state(S), n);
  setTop("Вопрос " + n, `history.length>1?history.back():go('#${S}-list')`);
  const lv = { new:"Не начат", bad:"Слабо", mid:"Учу", good:"Знаю" }[level(c)];
  $("#app").innerHTML = `<div class="fade">
    <div class="card"><div class="qnum">Вопрос ${n} · ${lv}</div><div class="qtext">${esc(q.q)}</div></div>
    <div class="card"><div class="label mb">Отметить вручную</div>
      <div class="seg" style="margin:0">${[["bad","Не знаю"],["mid","Учу"],["good","Знаю"]].map(([k,l]) => `<button class="${level(c)===k?"on":""}" onclick="setLevel(${n},'${k}')">${l}</button>`).join("")}</div>
      <div class="note">Статус также меняется сам, когда ты оцениваешь себя в карточках, письменно и на экзамене. «Знаю» вернёт вопрос на повторение через неделю, «Учу» — завтра, «Не знаю» — сразу.${c.seen ? ` <button style="text-decoration:underline;color:var(--muted);font-size:13px" onclick="setLevel(${n},'new')">Сбросить статус</button>` : ""}</div></div>
    ${q.s ? `<div class="card"><div class="label mb">Суть в одном предложении</div><div>${esc(q.s)}</div></div>` : ""}
    <div class="card"><div class="label mb">Ключевые термины — опоры для ответа</div><div class="chips">${q.k.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>
    <h3>Полный ответ</h3>
    <div class="card answer">${q.a}</div>
    <div class="card mt"><div class="method"><div class="ic">?</div><div><b>Проверь себя методом Фейнмана</b><p>Закрой ответ и объясни тему простыми словами, как другу, который её не знает. Где запнулся — там пробел, вернись к этому месту.</p></div></div></div>
    <div class="grid2 mt">
      <button class="btn primary" onclick="writeState={sid:S,n:${n},text:'',checked:false};go('#${S}-write')">Написать по памяти</button>
      <button class="btn" onclick="session={kind:'one',queue:[${n}],i:0,results:[],revealed:false,hints:false,again:[]};go('#${S}-study')">Карточка</button>
    </div>
    <div class="grid2 mt">
      ${n > 1 ? `<button class="btn ghost" onclick="go('#${S}-q-${n-1}')">← ${n-1}</button>` : "<span></span>"}
      ${n < 60 ? `<button class="btn ghost" onclick="go('#${S}-q-${n+1}')">${n+1} →</button>` : "<span></span>"}
    </div>
  </div>`;
}

/* ---------- method ---------- */
function renderMethod(){
  setTop("Как готовиться", S ? `go('#${S}-home')` : "go('#start')");
  const m = [
    ["1","Активное вспоминание","Не перечитывай, а вспоминай. Попытка достать ответ из памяти закрепляет его гораздо сильнее, чем повторное чтение. Поэтому в карточках ответ скрыт."],
    ["2","Интервальное повторение","Каждый вопрос возвращается тогда, когда ты начинаешь его забывать: не помню — через 10 минут, частично — завтра, помню — через 1, 3, 7, 14, 30 дней."],
    ["3","Письменная проверка","Выпиши всё, что помнишь, без подсказок, и сравни с эталоном. Красные термины покажут, что именно ты упускаешь."],
    ["4","Перемешивание","Вопросы идут вразнобой, а не по порядку, как и на экзамене. Так ты учишься узнавать тему по самому вопросу."],
    ["5","Пробные экзамены","10 случайных вопросов с таймером. Это тренирует ответ в условиях стресса и честно показывает уровень."],
    ["6","Метод Фейнмана","Объясни тему простыми словами. Если не получается, значит понимания пока нет, только заучивание."],
    ["7","Опорные термины","Для каждого вопроса выделены ключевые слова. Они как скелет ответа: определение → пункты → пример."],
  ];
  $("#app").innerHTML = `<div class="fade">
    <h2>Как сдать на 5</h2>
    <p class="sub">Приложение построено на методах с самой сильной научной базой: активное вспоминание, интервальное повторение и пробные тесты.</p>
    ${m.map(([i,t,d]) => `<div class="card method"><div class="ic">${i}</div><div><b>${t}</b><p>${d}</p></div></div>`).join("")}
    <h3>Распорядок на каждый день</h3>
    <div class="card"><ol style="margin:0;padding-left:20px">
      <li><b>Утро:</b> повтори вопросы, выученные вчера, по памяти.</li>
      <li><b>Утро:</b> выучи 10 новых вопросов по каждому предмету и сразу ответь на них по памяти.</li>
      <li><b>За 30 минут до сна:</b> повтори 10 сегодняшних вопросов. Сон закрепляет то, что повторено перед ним.</li>
      <li><b>Вопросы «по графику»</b> — когда появляются, повторяй их в любое время дня.</li>
      <li><b>2–3 вопроса письменно</b> — из тех, что были трудными.</li>
      <li><b>Раз в 2–3 дня — пробный экзамен.</b></li>
      <li>Занимайся отрезками по 25 минут с перерывом 5 минут. Лучше каждый день понемногу, чем всё за одну ночь.</li>
      <li>Высыпайся: во сне память закрепляет выученное.</li>
    </ol></div>
    <h3>Как отвечать на экзамене</h3>
    <div class="card"><ol style="margin:0;padding-left:20px">
      <li>Начни с <b>определения</b>.</li>
      <li>Назови <b>виды, функции или элементы</b> по пунктам.</li>
      <li>Приведи <b>пример</b>, лучше из Казахстана.</li>
      <li>Закончи коротким <b>выводом</b>: зачем это нужно.</li>
    </ol></div>
    <h3>Как понять, что готов</h3>
    <div class="card"><p style="margin:0">На главной показан шанс, что все 10 билетов будут из уверенно выученных. При 45 выученных из 60 он всего около 4%, при 55 — около 38%, при 60 — 100%. Поэтому цель — все 60 вопросов в зелёной зоне, а пробные экзамены стабильно на 5.</p></div>
  </div>`;
}

route();
</script>
</body>
</html>
